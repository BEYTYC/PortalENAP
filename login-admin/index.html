<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal ENAP - Acceso Administrativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://alcdn.msauth.net/browser/3.7.0/js/msal-browser.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
    <div class="flex flex-col items-center text-center mb-8">
      <div class="w-16 h-16 rounded-full bg-slate-900 flex items-center justify-center mb-4">
        <span class="text-white font-bold text-xl">EN</span>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Portal ENAP</h1>
      <p class="text-sm text-slate-500 mt-2">Acceso administrativo institucional</p>
    </div>

    <div id="error-box" class="hidden mb-5 rounded-lg bg-red-50 border border-red-200 px-4 py-3">
      <p id="error-msg" class="text-sm text-red-700"></p>
    </div>

    <button id="btn-login" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm rounded-lg px-4 py-3">
      Iniciar sesión con cuenta institucional ENAP
    </button>
  </div>

  <script type="module" src="./login.js"></script>
</body>
</html>
