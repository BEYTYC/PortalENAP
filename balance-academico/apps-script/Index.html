<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance Académico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--navy:#12294A;--navy2:#1F3D6B;--gold:#B8892B;--bg:#F3F5F9;--line:#D4DBE7;--line2:#E5E9F1;--ink:#16233A;--mute:#4A5A78;
  --ok-bg:#DFF2E7;--ok:#115C37;--warn-bg:#FFEFCF;--warn:#6E4300;--bad-bg:#FADFDC;--bad:#8E1A12;--mute-bg:#E5E9F1;--mute2:#33425C}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Aptos Display','Aptos','Segoe UI Variable Text','Segoe UI','Libre Franklin',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 24px;height:52px;border-bottom:3px solid var(--gold);flex-shrink:0}
.top b{font-size:16px}.top .sep{opacity:.5}
.top .quien{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.top select{background:var(--navy2);color:#fff;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.top .prueba{font-size:11px;opacity:.7}
.tabs{display:flex;gap:4px;padding:10px 24px 0;border-bottom:1px solid var(--line);background:#fff;flex-shrink:0;align-items:flex-end}
.tab{border:0;background:none;padding:9px 16px;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tab[aria-selected=true]{color:var(--navy);border-bottom-color:var(--gold)}
.tab:disabled{opacity:.45;cursor:not-allowed}
.tab .n{width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.tabs .est{margin-left:auto;padding-bottom:8px;display:flex;gap:8px;align-items:center;font-weight:600}
main{flex:1;min-height:0;padding:16px 24px;overflow:hidden}
.card{background:#fff;border:1px solid var(--line);border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.mute{background:var(--mute-bg);color:var(--mute2)}
.btn{font-weight:600;border-radius:8px;padding:7px 14px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.btn:hover:not(:disabled){background:#EEF2F9}
.btn.pri{background:var(--navy);color:#fff}.btn.pri:hover:not(:disabled){background:var(--navy2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1400}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
label.f{min-width:0;display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
label.f input,label.f select,label.f textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;font-weight:400;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
label.f input:focus,label.f select:focus,label.f textarea:focus,.cell:focus{outline:2px solid var(--gold);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.alert{border-radius:8px;padding:9px 12px;font-size:13px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.ok{background:var(--ok-bg);color:var(--ok)}.alert.mute{background:var(--mute-bg);color:var(--mute2)}

/* inicio */
.inicio{height:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
.inicio .col{display:flex;flex-direction:column;gap:12px;min-height:0}
.inicio textarea{flex:1;min-height:120px;resize:none;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.guardados{overflow:auto;display:flex;flex-direction:column}
.gd{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2)}
.gd:last-child{border-bottom:0}
.gd .t{flex:1;min-width:0}.gd .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gd .t span{color:var(--mute);font-size:12px}

/* revisión */
.rev{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
.tablewrap{display:flex;flex-direction:column;min-height:0}
.tbar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.tbar .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.tbar .seg button{border:0;background:#fff;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--mute)}
.tbar .seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.scroll{overflow:auto;flex:1;min-height:0}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:#F7F9FC;text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:7px 8px;border-bottom:1px solid var(--line);z-index:1;white-space:nowrap}
td{padding:3px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.area td{background:#FBF6EA;color:#6B4E10;font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;border-left:3px solid var(--gold);padding:5px 8px}
tr.area td .chip{margin-left:8px;text-transform:none;letter-spacing:0}
tr.falta td{background:#FFFBF1}
tr.perdida td{background:#FEF3F1}
.cell{width:100%;border:1px solid transparent;border-radius:6px;padding:3px 6px;background:transparent}
.cell:hover:not(:disabled){border-color:var(--line);background:#fff}
.cell:disabled{color:var(--ink)}
.cell.edit{background:#FFF8E8}
.cell.falta-nombre{border-color:var(--bad);background:#FEF3F1}
table{font-size:13px}
td:nth-child(2){min-width:190px}td:nth-child(4){min-width:250px}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.kpi b{display:block;font-size:22px;color:var(--navy);line-height:1.15}.kpi span{font-size:12px;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden;margin:0 14px 14px}.bar i{display:block;height:100%;background:var(--gold)}
.log{max-height:230px;overflow:auto;font-size:12px}
.log div{padding:6px 14px;border-bottom:1px solid var(--line2)}
.log time{color:var(--mute);display:block;font-size:11px}

/* firma */
.firma{height:100%;display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px}
.firma .panel{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0;padding-right:2px}
.prevbox{height:100%;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#E9EDF4;padding:12px;display:flex;justify-content:center;align-items:flex-start}
.prevbox canvas{box-shadow:0 2px 12px rgba(18,41,74,.25);background:#fff}
.sigprev{border:1px dashed var(--line);border-radius:8px;height:70px;display:flex;align-items:center;justify-content:center;color:var(--mute);background:#fff;overflow:hidden}
.sigprev img{max-height:66px;max-width:100%}
.steps{display:flex;flex-direction:column;gap:8px}
.steps .s{display:flex;gap:10px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--mute2);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dot.ok{background:var(--ok);color:#fff}

/* modal */
.modal{position:fixed;inset:0;background:rgba(18,41,74,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:#fff;border-radius:12px;width:min(760px,94vw);max-height:84vh;display:flex;flex-direction:column;border-top:4px solid var(--gold)}
.modal .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal .bd{overflow:auto}
.modal input.q{margin:10px 18px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:calc(100% - 36px)}
.pick{display:flex;gap:10px;align-items:center;padding:7px 18px;border-top:1px solid var(--line2)}
.pick .t{flex:1;min-width:0}.pick .t span{display:block;color:var(--mute);font-size:12px}
.vacío{padding:30px;text-align:center;color:var(--mute)}
@media (max-width:1100px){.rev{grid-template-columns:1fr}.inicio,.firma{grid-template-columns:1fr}main{overflow:auto}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* Balance Académico · motor de datos (sin interfaz).
   Funciona en el navegador (window.BalanceMotor) y en Node (module.exports) para pruebas. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.BalanceMotor = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ───────── utilidades ───────── */
  function quitarTildes(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function normCode(s) { return String(s == null ? '' : s).toUpperCase().replace(/\s+/g, '').trim(); }
  function normTexto(s) { return quitarTildes(s).toUpperCase().replace(/[^A-Z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
  function soloDigitos(s) { return String(s == null ? '' : s).replace(/\D+/g, ''); }
  function titulo(s) {
    return String(s || '').toLowerCase().replace(/(^|[\s\-'(])([a-záéíóúüñ])/g, function (m, a, b) { return a + b.toUpperCase(); })
      .replace(/\b(De|Del|La|Las|Los|Y|E)\b/g, function (m, w, i) { return i === 0 ? w : w.toLowerCase(); }).replace(/\b(Ii|Iii|Iv|Vi|Vii|Viii|Ix)\b/g, function (m) { return m.toUpperCase(); });
  }
  /* Notas: siempre 3 decimales y coma (7,950 · 10,000). */
  function fmtNota(n) {
    if (n == null || n === '' || isNaN(n)) return '';
    return (Math.round(Number(n) * 1000) / 1000).toFixed(3).replace('.', ',');
  }
  function fmtFecha(d) { d = d || new Date(); return d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear(); }
  function numero(s) {
    if (typeof s === 'number') return s;
    var t = String(s == null ? '' : s).trim().replace(',', '.');
    var n = parseFloat(t);
    return isNaN(n) ? 0 : n;
  }
  function hash(str) { // FNV-1a, suficiente para detectar cambios
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
    return ('00000000' + h.toString(16)).slice(-8);
  }

  /* ───────── lector del SMA ───────── */
  var RE_PERIODO = /^\s*(\d{4})\s*-\s*(\d)\b/;

  function parseSMA(texto) {
    var lineas = String(texto || '').replace(/\r/g, '').split('\n');
    var ident = { codigo: '', documento: '', sexo: '', apellidos: '', nombres: '', programa: '', semestre: '' };
    var registros = [], periodos = [], periodoActual = null, avisos = [];
    var cont = {};
    lineas.forEach(function (ln) {
      var celdas = ln.split('\t').map(function (c) { return c.trim(); });
      var c0 = celdas[0] || '';
      var m;
      if (/^c[oó]digo$/i.test(c0) && celdas[1] && /ident/i.test(celdas[1])) {
        ident.codigo = (celdas[1].match(/^(\S+)/) || [])[1] || '';
        m = celdas[1].match(/Ident\.?\s+(\S+)/i); if (m) ident.documento = m[1];
        m = celdas[1].match(/Sexo\s+(\S+)/i); if (m) ident.sexo = m[1];
        return;
      }
      if (/^apellidos$/i.test(c0)) { ident.apellidos = celdas[1] || ''; return; }
      if (/^nombres?$/i.test(c0)) { ident.nombres = celdas[1] || ''; return; }
      if (/^programa$/i.test(c0)) {
        var p = celdas[1] || '';
        m = p.match(/Sem:\s*(\d+)/i); if (m) ident.semestre = m[1];
        ident.programa = p.replace(/\s*Sem:.*$/i, '').trim();
        return;
      }
      m = ln.match(RE_PERIODO);
      if (m && celdas.length === 1) {
        periodoActual = m[1] + ' - ' + m[2];
        if (periodos.indexOf(periodoActual) < 0) periodos.push(periodoActual);
        return;
      }
      // fila de materia: Item, Código, Materia, Crd, 1P..4P, Def, Hab, Final
      if (/^\d+$/.test(c0) && celdas.length >= 10 && periodoActual) {
        var cod = celdas[1];
        var k = periodoActual + '|' + normCode(cod);
        cont[k] = (cont[k] || 0) + 1;
        registros.push({
          key: k + '|' + cont[k], periodo: periodoActual, item: +c0,
          cod: cod, nombre: celdas[2], crd: numero(celdas[3]),
          p: [numero(celdas[4]), numero(celdas[5]), numero(celdas[6]), numero(celdas[7])],
          def: numero(celdas[8]), hab: numero(celdas[9]), final: numero(celdas[10])
        });
      }
    });
    return { identidad: ident, periodos: periodos, registros: registros, avisos: avisos };
  }

  function firmaRegistro(r) { return [r.periodo, normCode(r.cod), r.def, r.hab, r.p.join(',')].join('|'); }

  /* Une varios pegados; los grupos repetidos (mismo periodo, código y notas) se cuentan una vez. */
  function unirSMA(textos) {
    var vistos = {}, registros = [], periodos = [], ids = [], cont = {};
    (textos || []).forEach(function (t, idx) {
      var s = parseSMA(t);
      var estaVez = {};
      s.registros.forEach(function (r) {
        var f = firmaRegistro(r);
        if (vistos[f] != null && vistos[f] !== idx) return;      // repetido de un pegado anterior
        vistos[f] = idx; estaVez[f] = (estaVez[f] || 0) + 1;
        var base = r.periodo + '|' + normCode(r.cod);
        cont[base] = (cont[base] || 0) + 1;
        r.key = base + '|' + cont[base];
        registros.push(r);
      });
      s.periodos.forEach(function (p) { if (periodos.indexOf(p) < 0) periodos.push(p); });
      if (s.identidad.documento || s.identidad.nombres || s.identidad.apellidos) ids.push(s.identidad);
    });
    periodos.sort(compararPeriodo);
    return { identidades: ids, periodos: periodos, registros: registros };
  }

  function compararPeriodo(a, b) {
    var x = String(a).split(/\s*-\s*/), y = String(b).split(/\s*-\s*/);
    return (+x[0] - +y[0]) || (+x[1] - +y[1]);
  }

  /* Periodo de terminación: el último con notas. Como en la plantilla, 3 o más cuenta como 2. */
  function periodoTerminacion(registros) {
    var ult = null;
    registros.forEach(function (r) {
      if (!(r.def > 0 || r.hab > 0 || r.final > 0)) return;
      if (!ult || compararPeriodo(r.periodo, ult) > 0) ult = r.periodo;
    });
    if (!ult) return '';
    var p = ult.split(/\s*-\s*/);
    return p[0] + ' - ' + (+p[1] > 2 ? 2 : p[1]);
  }

  /* ───────── verificación de identidad ───────── */
  function fichaNombre(s) { return normTexto(s).split(' ').filter(Boolean).sort().join(' '); }

  /* est: {nombres, apellidos, tipoDoc: 'CC'|'PA'|'CE'..., documento}.
     Devuelve {ok, errores[], avisos[]}; los errores bloquean la creación. */
  function verificarEstudiante(smaUnido, est) {
    var errores = [], avisos = [];
    var ids = smaUnido.identidades || [];
    if (!ids.length) {
      errores.push('No se encontró el encabezado del estudiante en lo pegado. Copie el historial completo desde el SMA, con “Código … N° Ident.”, apellidos y nombre.');
      return { ok: false, errores: errores, avisos: avisos };
    }
    var docs = {};
    ids.forEach(function (i) { if (i.documento) docs[soloDigitos(i.documento)] = 1; });
    if (Object.keys(docs).length > 1) errores.push('Lo pegado trae más de un número de identificación. Pegue solo las notas de este estudiante.');
    var esCedula = /^(cc|c\.c|cedula|cédula|cedula de ciudadania)/i.test(String(est.tipoDoc || 'CC').trim());
    var nombreSolicitud = fichaNombre((est.nombres || '') + ' ' + (est.apellidos || ''));
    var nombresSMA = ids.map(function (i) { return fichaNombre((i.nombres || '') + ' ' + (i.apellidos || '')); });
    var coincideNombre = nombresSMA.every(function (n) { return n === nombreSolicitud; });
    if (esCedula) {
      var docSol = soloDigitos(est.documento);
      var iguales = Object.keys(docs).every(function (d) { return d === docSol; });
      if (!iguales) errores.push('La cédula del SMA no es la de la solicitud. Revise la cédula en la solicitud o en el SMA.');
      else if (!coincideNombre) avisos.push('La cédula coincide, pero el nombre del SMA es distinto al de la solicitud. Verifique que sea el mismo estudiante.');
    } else {
      if (!coincideNombre) errores.push('Los nombres del SMA no coinciden con los de la solicitud. Con pasaporte o cédula de extranjería solo se comparan los nombres.');
    }
    return { ok: errores.length === 0, errores: errores, avisos: avisos };
  }

  /* ───────── estado del balance ───────── */
  function nuevoEstado(programaId, estudiante, quien) {
    var e = {
      v: 1, programaId: programaId,
      estudiante: {
        nombres: estudiante.nombres || '', apellidos: estudiante.apellidos || '',
        tipoDoc: estudiante.tipoDoc || 'CC', documento: estudiante.documento || '', nivel: estudiante.nivel || ''
      },
      textos: [],          // notas pegadas tal cual salen del SMA
      ediciones: {},       // idFila -> {cod, nombre}  (solo código y nombre cursado, nunca notas)
      vinculos: {},        // idFila -> key de registro SMA (equivalencia aplicada por el jefe)
      optativas: [],       // [{bloque, reg, cod?, nombre?}]
      creado: new Date().toISOString(),
      elaboracion: fmtFecha(new Date()),
      firmas: { jefe: null, decano: null },
      bitacora: []
    };
    registrar(e, quien, 'creó el balance');
    return e;
  }

  function registrar(e, quien, accion, detalle) {
    e.bitacora.push({ t: new Date().toISOString(), quien: quien || '', accion: accion, detalle: detalle || '' });
  }

  /* Lo que firman: si esto cambia, la firma deja de valer. */
  function huella(e) {
    return hash(JSON.stringify({
      p: e.programaId, s: e.estudiante, t: e.textos.map(function (x) { return hash(x); }),
      d: e.ediciones, v: e.vinculos, o: e.optativas, f: e.elaboracion
    }));
  }

  function estadoFirmas(e) {
    var h = huella(e);
    function vig(f) { return !!(f && f.huella === h); }
    var j = vig(e.firmas.jefe), d = vig(e.firmas.decano);
    return { jefe: j, decano: d, huella: h,
      jefeObsoleta: !!(e.firmas.jefe && !j), decanoObsoleta: !!(e.firmas.decano && !d),
      fase: d ? 'firmado' : j ? 'cerrado_jefe' : 'borrador' };
  }

  function agregarNotas(e, texto, quien) {
    var t = String(texto || '').trim();
    if (!t) return { agregados: 0 };
    var antes = unirSMA(e.textos).registros.length;
    e.textos.push(t);
    var despues = unirSMA(e.textos).registros.length;
    var n = despues - antes;
    if (n <= 0) { e.textos.pop(); return { agregados: 0 }; }
    registrar(e, quien, 'pegó notas del SMA', n + ' asignaturas nuevas');
    return { agregados: n };
  }

  function editarCursado(e, fila, campo, valor, quien, etiqueta) {
    var ed = e.ediciones[fila.id] || (e.ediciones[fila.id] = {});
    var antes = ed[campo] != null ? ed[campo] : (campo === 'cod' ? fila.cod : fila.nombre);
    valor = String(valor || '').trim();
    if (valor === String(antes || '')) return false;
    if (valor === '') delete ed[campo]; else ed[campo] = valor;
    registrar(e, quien, 'cambió el ' + (campo === 'cod' ? 'código' : 'nombre') + ' de ' + (etiqueta || fila.nombreVig),
      '“' + (antes || '—') + '” → “' + (valor || '—') + '”');
    return true;
  }

  function aplicarEquivalencia(e, fila, reg, quien) {
    e.vinculos[fila.id] = reg.key;
    registrar(e, quien, 'aplicó equivalencia a ' + fila.nombreVig,
      reg.cod + ' ' + reg.nombre + ' (' + reg.periodo + ') → ' + (fila.codVig || 'espacio de electiva'));
  }
  function quitarEquivalencia(e, fila, quien) {
    delete e.vinculos[fila.id];
    registrar(e, quien, 'quitó la equivalencia de ' + fila.nombreVig);
  }
  function agregarOptativa(e, bloque, reg, quien) {
    e.optativas.push({ bloque: bloque.id, reg: reg.key });
    registrar(e, quien, 'agregó optativa a ' + bloque.label, reg.cod + ' ' + reg.nombre);
  }
  function quitarOptativa(e, regKey, quien, nombre) {
    e.optativas = e.optativas.filter(function (o) { return o.reg !== regKey; });
    registrar(e, quien, 'quitó una optativa', nombre || regKey);
  }
  function editarOptativa(e, regKey, campo, valor, quien, antes) {
    var o = e.optativas.filter(function (x) { return x.reg === regKey; })[0];
    if (!o) return false;
    valor = String(valor || '').trim();
    if (valor === String(antes || '')) return false;
    o[campo] = valor;
    registrar(e, quien, 'cambió el ' + (campo === 'cod' ? 'código' : 'nombre') + ' de una optativa', '“' + (antes || '—') + '” → “' + valor + '”');
    return true;
  }

  /* ───────── cruce con el pénsum ───────── */
  function aprobada(reg, minimo) { return reg.def >= minimo || reg.hab >= minimo; }
  function conNota(reg) { return reg.def > 0 || reg.hab > 0 || reg.final > 0; }

  function truncado(n) { return /\.\.\.|…/.test(String(n || '')); }
  function esMayusculas(n) { n = String(n || ''); return n === n.toUpperCase() && n !== n.toLowerCase(); }

  /* Índice de nombres completos del programa: pénsum, equivalencias (todas las columnas), optativas y electivas. */
  function indiceNombres(prog) {
    if (prog._indiceNombres) return prog._indiceNombres;
    var vistos = {}, lista = [];
    function add(cod, nombre) {
      nombre = String(nombre || '').trim();
      if (!nombre || truncado(nombre)) return;
      var k = normTexto(nombre) + '|' + normCode(cod);
      if (vistos[k]) return; vistos[k] = 1;
      lista.push({ cod: normCode(cod), nombre: nombre, tokens: normTexto(nombre).split(' ') });
    }
    Object.keys(prog.catalogo).forEach(function (k) { add(k, prog.catalogo[k].nombre); });
    Object.keys(prog.equivalencias).forEach(function (k) {
      var e = prog.equivalencias[k]; add(k, e.nombre);
      e.alts.forEach(function (a) { add(a.cod, a.nombre); });
    });
    prog._indiceNombres = lista;
    return lista;
  }
  /* “FUNDAMENTOS DE ...” o “PROCED. DISCIPL...” → el nombre completo si hay uno solo posible. */
  function completarTruncado(prog, cod, nombreSMA) {
    var base = String(nombreSMA || '').replace(/(\.\.\.|…).*$/, '');
    var pt = normTexto(base).split(' ').filter(Boolean);
    if (!pt.length) return null;
    var c = normCode(cod);
    var cand = indiceNombres(prog).filter(function (x) {
      if (x.tokens.length < pt.length) return false;
      for (var i = 0; i < pt.length; i++) if (x.tokens[i].indexOf(pt[i]) !== 0) return false;
      return true;
    });
    if (!cand.length) return null;
    var mismo = cand.filter(function (x) { return x.cod === c; });
    var pool = mismo.length ? mismo : cand;
    var nombres = {}; pool.forEach(function (x) { nombres[normTexto(x.nombre)] = x.nombre; });
    var ks = Object.keys(nombres);
    return ks.length === 1 ? nombres[ks[0]] : null;
  }
  /* Nombre completo con el que sale en el balance: Excel del programa primero; el SMA solo si no hay otro. */
  function nombreCompleto(prog, cod, nombreSMA) {
    var c = prog.catalogo[normCode(cod)];
    if (c && c.nombre) return c.nombre;
    if (truncado(nombreSMA)) return completarTruncado(prog, cod, nombreSMA) || nombreSMA;
    return esMayusculas(nombreSMA) ? titulo(nombreSMA) : nombreSMA;
  }

  function minimoAprobacion(prog, est) {
    var nivel = (est && est.nivel) || prog.nivel || 'pregrado';
    return /pos/i.test(nivel) ? 7 : 6;
  }

  /* prog: resultado de LectorExcel.parsePrograma · e: estado del balance */
  function calcular(prog, e) {
    var sma = unirSMA(e.textos);
    var registros = sma.registros;
    var minimo = minimoAprobacion(prog, e.estudiante);
    var porClave = {}, porCodigo = {};
    registros.forEach(function (r) {
      porClave[r.key] = r;
      var c = normCode(r.cod);
      (porCodigo[c] = porCodigo[c] || []).push(r);
    });
    function ultimo(lista) {  // la nota vale del último periodo cursado (repetición)
      var mejor = null;
      lista.forEach(function (r) {
        if (!mejor || compararPeriodo(r.periodo, mejor.periodo) > 0 || (r.periodo === mejor.periodo && r.item > mejor.item)) mejor = r;
      });
      return mejor;
    }

    var usados = {};            // códigos del SMA que ya sirvieron a una fila
    var regsUsados = {};
    var lineas = [], bloques = [], faltantes = [];
    var optPorBloque = {};
    e.optativas.forEach(function (o) { (optPorBloque[o.bloque] = optPorBloque[o.bloque] || []).push(o); });

    prog.items.forEach(function (it) {
      if (it.kind === 'mat' || it.kind === 'slot') {
        var ed = e.ediciones[it.id] || {};
        var reg = null, origen = '', via = '';
        if (e.vinculos[it.id] && porClave[e.vinculos[it.id]]) {
          reg = porClave[e.vinculos[it.id]]; origen = 'manual';
          var lm = porCodigo[normCode(reg.cod)];
          reg = ultimo(lm) || reg; // si repitió esa materia, vale la última
        } else if (it.kind === 'mat') {
          var cand = [];
          if (ed.cod) cand.push({ c: normCode(ed.cod), o: 'codigo-editado' });
          cand.push({ c: normCode(it.cod), o: 'codigo' });
          var eq = prog.equivalencias[normCode(it.cod)];
          if (eq) eq.alts.forEach(function (a, i) { cand.push({ c: normCode(a.cod), o: 'equiv' + (i + 1) }); });
          for (var i = 0; i < cand.length && !reg; i++) {
            var lista = porCodigo[cand[i].c];
            if (lista && lista.length) { reg = ultimo(lista); origen = cand[i].o; }
          }
        }
        var linea = {
          id: it.id, kind: it.kind, area: it.area, codVig: it.cod || '', nombreVig: it.nombre, cred: it.cred,
          estado: 'falta', cod: ed.cod || '', nombre: ed.nombre || '', nota: null, hab: null, periodo: '',
          origen: origen, regKey: reg ? reg.key : '', editado: !!(ed.cod || ed.nombre), nombreTruncado: false
        };
        if (reg) {
          usados[normCode(reg.cod)] = true; regsUsados[reg.key] = true;
          (porCodigo[normCode(reg.cod)] || []).forEach(function (r) { regsUsados[r.key] = true; });
          var sinCredito = !(it.cred > 0);
          var ok = sinCredito ? conNota(reg) : aprobada(reg, minimo);
          linea.estado = ok ? 'ok' : 'perdida';
          linea.nota = reg.def; linea.hab = reg.hab > 0 ? reg.hab : null; linea.periodo = reg.periodo;
          if (!linea.cod) linea.cod = reg.cod;
          if (!linea.nombre) {
            if (normCode(reg.cod) === normCode(it.cod)) linea.nombre = it.nombre;
            else {
              linea.nombre = nombreCompleto(prog, reg.cod, reg.nombre);
            }
          }
          linea.nombreTruncado = truncado(linea.nombre);
        }
        if (linea.estado !== 'ok') faltantes.push(linea);
        lineas.push(linea);
      } else if (it.kind === 'bloque') {
        var sel = optPorBloque[it.id] || [];
        var credSel = 0, filas = [];
        sel.forEach(function (o) {
          var r = porClave[o.reg];
          if (!r) return;
          regsUsados[r.key] = true; usados[normCode(r.cod)] = true;
          (porCodigo[normCode(r.cod)] || []).forEach(function (x) { regsUsados[x.key] = true; });
          var cat = prog.catalogo[normCode(r.cod)];
          var cred = cat && cat.cred > 0 ? cat.cred : r.crd;
          var okOpt = aprobada(r, minimo);
          var nombre = o.nombre || nombreCompleto(prog, r.cod, r.nombre);
          credSel += okOpt ? cred : 0;
          filas.push({
            id: it.id + ':' + r.key, kind: 'opt', bloque: it.id, area: it.area, codVig: '', nombreVig: '', cred: cred,
            estado: okOpt ? 'ok' : 'perdida', cod: o.cod || r.cod, nombre: nombre,
            nota: r.def, hab: r.hab > 0 ? r.hab : null, periodo: r.periodo, origen: 'optativa', regKey: r.key,
            nombreTruncado: truncado(nombre), editado: !!(o.cod || o.nombre)
          });
        });
        var satisfecho = credSel >= it.req && it.req > 0 ? true : (it.req === 0 ? filas.length > 0 : false);
        bloques.push({ id: it.id, label: it.label, area: it.area, req: it.req, sel: credSel, ok: satisfecho });
        if (!filas.length) {
          var vacia = { id: it.id + ':vacia', kind: 'optvacia', bloque: it.id, area: it.area, codVig: '', nombreVig: it.label, cred: 0, estado: 'falta', cod: '', nombre: '', nota: null, hab: null, periodo: '', origen: '', regKey: '' };
          lineas.push(vacia);
        } else filas.forEach(function (f, i) { f.etiqueta = i === 0 ? it.label : ''; lineas.push(f); });
        if (!satisfecho) faltantes.push({ id: it.id, kind: 'bloque', nombreVig: it.label + ' (' + credSel + ' de ' + it.req + ' créditos)' });
      }
    });

    // asignaturas del SMA que no entraron: candidatas para equivalencias u optativas (la más reciente de cada código)
    var sinUsar = [], vistoCod = {};
    registros.slice().sort(function (a, b) { return compararPeriodo(b.periodo, a.periodo) || b.item - a.item; }).forEach(function (r) {
      if (regsUsados[r.key]) return;
      var c = normCode(r.cod);
      if (usados[c] || vistoCod[c]) return;
      vistoCod[c] = true; sinUsar.push(r);
    });

    // totales
    var total = 0, suma = 0, aprobadas = 0, filasPensum = 0, ptos = 0;
    lineas.forEach(function (l) {
      if (l.kind === 'mat' || l.kind === 'slot') { filasPensum++; if (l.estado === 'ok') aprobadas++; }
      if (l.estado === 'ok') { total += l.cred; if (l.cred > 0 && l.nota != null) { suma += l.cred * l.nota; ptos += l.cred; } }
    });
    var promedio = ptos > 0 ? suma / ptos : 0;
    var avisosNombre = lineas.filter(function (l) { return l.nombreTruncado; }).length;   // con puntos suspensivos: el jefe debe completarlos
    return {
      lineas: lineas, bloques: bloques, sinUsar: sinUsar, minimo: minimo,
      totalCreditos: total, promedio: promedio, periodoTerm: periodoTerminacion(registros),
      cruzadas: aprobadas, totalFilas: filasPensum, faltantes: faltantes, avisosNombre: avisosNombre,
      completo: faltantes.length === 0 && avisosNombre === 0 && filasPensum > 0 && registros.length > 0,
      registros: registros, sma: sma
    };
  }

  return {
    normCode: normCode, normTexto: normTexto, titulo: titulo, fmtNota: fmtNota, fmtFecha: fmtFecha,
    parseSMA: parseSMA, unirSMA: unirSMA, periodoTerminacion: periodoTerminacion, compararPeriodo: compararPeriodo,
    verificarEstudiante: verificarEstudiante, nuevoEstado: nuevoEstado, registrar: registrar,
    agregarNotas: agregarNotas, editarCursado: editarCursado, aplicarEquivalencia: aplicarEquivalencia,
    quitarEquivalencia: quitarEquivalencia, agregarOptativa: agregarOptativa, quitarOptativa: quitarOptativa,
    editarOptativa: editarOptativa, huella: huella, estadoFirmas: estadoFirmas, calcular: calcular,
    minimoAprobacion: minimoAprobacion, hash: hash
  };
});

<script>
/* Programas con plantilla de Balance Académico.
   Los Excel viven en ../balances/ y siguen siendo la fuente de verdad (el portal también los enlaza). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.BalanceProgramas = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var LISTA = [
    { id: 'administracion',        archivo: 'Balance_Administracion.xlsm',                              nombre: 'Administración',                                      nivel: 'pregrado',  alias: ['Administración'] },
    { id: 'administracion-maritima', archivo: 'Balance_Administracion_Maritima.xlsm',                   nombre: 'Administración Marítima',                             nivel: 'pregrado',  alias: ['Administración Marítima'] },
    { id: 'cn-maquinas',           archivo: 'Balance_Ciencias_Nauticas_Maquinas.xlsm',                  nombre: 'Ciencias Náuticas para Oficiales Mercantes de Máquinas', nivel: 'pregrado', alias: ['Ciencias Náuticas Mercantes de Máquinas', 'Ciencias Náuticas para Oficiales Mercantes de Máquinas'] },
    { id: 'cn-puente',             archivo: 'Balance_Ciencias_Nauticas_Puente.xlsm',                    nombre: 'Ciencias Náuticas para Oficiales Mercantes de Puente',   nivel: 'pregrado', alias: ['Ciencias Náuticas Oficiales Mercantes', 'Ciencias Náuticas para Oficiales Mercantes de Puente'] },
    { id: 'cn-infanteria',         archivo: 'Balance_Ciencias_Navales_Oficiales_Infanteria_Marina.xlsm', nombre: 'Ciencias Navales para Oficiales de Infantería de Marina', nivel: 'pregrado', alias: ['Ciencias Navales Infantería de Marina', 'Ciencias Navales para Oficiales de Infantería de Marina'] },
    { id: 'cn-navales',            archivo: 'Balance_Ciencias_Navales_Oficiales_Navales.xlsm',          nombre: 'Ciencias Navales para Oficiales Navales',                nivel: 'pregrado', alias: ['Ciencias Navales Oficiales Navales', 'Ciencias Navales para Oficiales Navales'] },
    { id: 'esp-logistica',         archivo: 'Balance_Especializacion_Gestion_Logistica.xlsm',           nombre: 'Especialización en Gestión Logística',                   nivel: 'posgrado', alias: ['Especialización en Logística', 'Especialización en Gestión Logística'] },
    { id: 'ing-electronica',       archivo: 'Balance_Ingenieria_Electronica.xlsm',                      nombre: 'Ingeniería Electrónica',                                 nivel: 'pregrado', alias: ['Ingeniería Electrónica'] },
    { id: 'ing-naval',             archivo: 'Balance_Ingenieria_Naval.xlsm',                            nombre: 'Ingeniería Naval',                                       nivel: 'pregrado', alias: ['Ingeniería Naval'] },
    { id: 'mae-logistica',         archivo: 'Balance_Maestria_Gestion_Logistica.xlsm',                  nombre: 'Maestría en Gestión Logística',                          nivel: 'posgrado', alias: ['Maestría en Gestión Logística'] },
    { id: 'mae-ing-naval',         archivo: 'Balance_Maestria_Ingenieria_Naval.xltm',                   nombre: 'Maestría en Ingeniería Naval',                           nivel: 'posgrado', alias: ['Maestría en Ingeniería Naval'] },
    { id: 'mae-oceanografia',      archivo: 'Balance_Maestria_Oceanografia.xlsm',                       nombre: 'Maestría en Oceanografía',                               nivel: 'posgrado', alias: ['Maestría en Oceanografía'] },
    { id: 'oceanografia-fisica',   archivo: 'Balance_Oceanografia_Fisica.xlsm',                         nombre: 'Oceanografía Física',                                    nivel: 'pregrado', alias: ['Oceanografía Física'] }
  ];

  /* Siguen cargando el balance a mano (no se genera aquí). */
  var MANUALES = [
    'Especialización en Política y Estrategia Marítima',
    'Doctorado en Ciencias del Mar'
  ];

  function norm(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
  }
  function porId(id) { return LISTA.filter(function (p) { return p.id === id; })[0] || null; }
  function porNombre(n) {
    var x = norm(n);
    if (!x) return null;
    for (var i = 0; i < LISTA.length; i++) {
      if (norm(LISTA[i].nombre) === x) return LISTA[i];
      for (var j = 0; j < LISTA[i].alias.length; j++) if (norm(LISTA[i].alias[j]) === x) return LISTA[i];
    }
    return null;
  }
  function esManual(n) { var x = norm(n); return MANUALES.some(function (m) { return norm(m) === x; }); }

  return { lista: LISTA, manuales: MANUALES, porId: porId, porNombre: porNombre, esManual: esManual };
});

<script>
/* Lee un Excel de Balance (hoja Balance + Equivalencia + Optativas/Electivas) y lo convierte en el pénsum vigente.
   Navegador: LectorExcel.cargarPrograma(meta) · Node: parsePrograma(XLSX, wb, meta). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.LectorExcel = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  function txt(v) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim(); }
  function nCod(s) { return String(s == null ? '' : s).toUpperCase().replace(/\s+/g, '').trim(); }
  function esNum(v) { return typeof v === 'number' && !isNaN(v); }
  var RE_CODIGO = /^[A-Za-z]{1,5}\s?\d[\d.]*[A-Za-z]?$/;
  function pareceCodigo(s) {
    s = txt(s);
    return RE_CODIGO.test(s) && (s.match(/\d/g) || []).length >= 2;
  }
  var RE_BLOQUE = /electiv|optativ|obligatori/i;

  function filas(XLSX, wb, nombre) {
    var h = wb.Sheets[nombre];
    if (!h) return [];
    return XLSX.utils.sheet_to_json(h, { header: 1, defval: '', raw: true });
  }

  function parsePrograma(XLSX, wb, meta) {
    var rows = filas(XLSX, wb, 'Balance');
    if (!rows.length) throw new Error('El archivo ' + meta.archivo + ' no tiene la hoja “Balance”.');
    var c = function (r, i) { return rows[r] ? txt(rows[r][i]) : ''; };

    var encabezado = {
      titulo: c(2, 4) || 'BALANCE ACADÉMICO', autoridad: c(2, 9),
      proceso: c(4, 4), rige: c(4, 9).replace(/^Rige a partir de:?\s*/i, ''), codigo: c(5, 4)
    };

    var ini = -1, fin = rows.length;
    for (var i = 0; i < rows.length; i++) {
      if (ini < 0 && /^COD\.?$/i.test(txt(rows[i][2]))) { ini = i; continue; }
      if (ini >= 0 && /^TOTA/i.test(txt(rows[i][2]))) { fin = i; break; }
    }
    if (ini < 0) throw new Error('No se encontró la tabla del pénsum en ' + meta.archivo);

    var items = [], area = '', bloque = null, cuentaSlots = 0, usados = {};
    function idUnico(base) {
      var k = base, n = 1;
      while (usados[k]) { n++; k = base + '#' + n; }
      usados[k] = true; return k;
    }
    for (var r = ini + 1; r < fin; r++) {
      var row = rows[r];
      var C = txt(row[2]), D = txt(row[3]), E = txt(row[4]), J = row[9];
      if (!C && !D && !E && !row[6] && !row[7] && J === '') continue;
      // en algunas plantillas el rótulo “Optativas: 8 créditos” está en la columna del código
      if (D && !E && RE_BLOQUE.test(D) && !pareceCodigo(D)) { E = D; D = ''; }

      if (D && E) {                                   // asignatura del pénsum vigente
        if (C) area = C;
        bloque = null;
        items.push({ kind: 'mat', id: idUnico(nCod(D)), area: area, cod: D, nombre: E, cred: esNum(J) ? J : 0 });
        continue;
      }
      var etiqueta = C + ' ' + E;
      if (!D && RE_BLOQUE.test(etiqueta)) {           // arranca un bloque de electivas / optativas
        var conCred = /cr[eé]ditos/i.test(E) ? E : (/cr[eé]ditos/i.test(C) ? C : '');
        var req = 0, m = (C + ' ' + E).match(/(\d+)\s*cr[eé]ditos?/i);
        if (m) req = +m[1];
        var areaB = C.replace(/[:\s]*\d+\s*cr[eé]ditos?.*$/i, '').trim() || 'Electivas';
        var slotAqui = E && !/cr[eé]ditos/i.test(E) && esNum(J);
        if (slotAqui) {                               // Maestría Gestión Logística: “Electiva I… III” fijas
          cuentaSlots++;
          items.push({ kind: 'slot', id: 'slot' + cuentaSlots, area: areaB, cod: '', nombre: E, cred: J });
          bloque = { slots: true, area: areaB };
        } else {
          var etq = conCred || C || E;
          bloque = { slots: false, area: areaB };
          items.push({ kind: 'bloque', id: idUnico('bloque' + (items.length + 1)), area: areaB, label: etq, req: req });
        }
        continue;
      }
      if (bloque && !D && E && !/cr[eé]ditos/i.test(E) && esNum(J) && bloque.slots) {
        cuentaSlots++;
        items.push({ kind: 'slot', id: 'slot' + cuentaSlots, area: bloque.area, cod: '', nombre: E, cred: J });
        continue;
      }
      if (!D && !E && C && !bloque) { area = C; continue; }   // rótulo de área suelto
      // el resto son filas de ejemplo del bloque (códigos cursados de otro estudiante): se ignoran
    }

    // Maestría Gestión Logística: el último bloque de slots no lleva etiqueta de créditos
    items.forEach(function (it) {
      if (it.kind === 'bloque' && it.req === 0) {
        // sin créditos exigidos en la plantilla: se pide al menos una asignatura
      }
    });

    // firmantes
    var jefe = '', decano = '';
    for (var k = fin; k < rows.length; k++) {
      rows[k].forEach(function (v) {
        var t = txt(v);
        if (/^jefe/i.test(t) && !jefe) jefe = t;
        if (/^decano/i.test(t) && !decano) decano = t;
      });
    }

    // equivalencias y catálogo de nombres
    var eq = {}, catalogo = {};
    function aCat(cod, nombre, cred) {
      var k = nCod(cod);
      if (!k || !pareceCodigo(cod)) return;
      var cur = catalogo[k] || (catalogo[k] = { cod: txt(cod), nombre: '', cred: 0 });
      if (!cur.nombre && txt(nombre)) cur.nombre = txt(nombre);
      if (!(cur.cred > 0) && esNum(cred) && cred > 0) cur.cred = cred;
    }
    var eqRows = filas(XLSX, wb, 'Equivalencia');
    for (var q = 1; q < eqRows.length; q++) {
      var er = eqRows[q];
      var v = nCod(er[0]);
      if (!v) continue;
      aCat(er[0], er[1], er[2]);
      var alts = [];
      [[4, 5], [7, 8]].forEach(function (p) {
        if (nCod(er[p[0]])) { alts.push({ cod: txt(er[p[0]]), nombre: txt(er[p[1]]) }); aCat(er[p[0]], er[p[1]]); }
      });
      var cur = eq[v] || (eq[v] = { nombre: txt(er[1]), alts: [] });

  var cache = {};

<script>
(function () {
  'use strict';
  var M = BalanceMotor, PR = BalanceProgramas, LE = LectorExcel, PDF = BalancePDF;
  var ROLES = { jefe: 'Jefe de Programa', decano: 'Decano de Facultad' };
  var imagenesAssets = { logo: null, marca: null };

  var S = {
    vista: 'inicio', rol: 'jefe', prog: null, est: null, res: null, ver: null,
    imgs: { jefe: null, decano: null }, dims: { jefe: null, decano: null },
    form: { programaId: '', tipoDoc: 'CC', documento: '', nombres: '', apellidos: '', nivel: 'pregrado', notas: '' },
    formErr: null, cargando: false, filtro: 'todas', modal: null, firmaForm: { jefe: {}, decano: {} },
    sesion: { nombre: '', email: '', roles: ['jefe', 'decano'], prueba: true }, msg: null,
    guardados: [], guardando: '', toast: null, dialogo: null, arranque: true, errorArranque: null
  };

  /* ───── entorno: Apps Script (producción) o navegador suelto (pruebas) ───── */
  var GAS = !!(window.__GAS && window.google && google.script && google.script.run);
  function srv(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, no) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { no(new Error((e && e.message) || String(e))); })[fn].apply(null, args);
    });
  }
  /* Identidad: el Portal entrega el token de Microsoft (mismo mecanismo que Titulación y Concesiones).
     Sin Portal (modo independiente) no llega token y el servidor decide si permite el modo prueba. */
  var tokenMs = { valor: '', t: 0 };
  function obtenerToken() {
    if (!GAS) return Promise.resolve('');
    if (tokenMs.valor && Date.now() - tokenMs.t < 40 * 60 * 1000) return Promise.resolve(tokenMs.valor);
    if (tokenMs.sinPortal && Date.now() - tokenMs.sinPortal < 10 * 60 * 1000) return Promise.resolve('');
    return new Promise(function (ok) {
      var hecho = false;
      function on(ev) {
        if (ev.data && ev.data.type === 'balance:token' && ev.data.token) {
          hecho = true; window.removeEventListener('message', on);
          tokenMs = { valor: ev.data.token, t: Date.now() }; ok(ev.data.token);
        }
      }
      window.addEventListener('message', on);
      try { window.top.postMessage({ type: 'balance:token-request' }, '*'); } catch (e) {}
      setTimeout(function () { if (!hecho) { window.removeEventListener('message', on); tokenMs.sinPortal = Date.now(); ok(''); } }, 2500);
    });
  }
  function srvAuth(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    function intento(reintento) {
      return obtenerToken().then(function (t) { return srv.apply(null, [fn, t].concat(args)); }).catch(function (err) {
        if (!reintento && /venci/i.test(err.message)) { tokenMs = { valor: '', t: 0 }; return intento(true); }
        throw err;
      });
    }
    return intento(false);
  }
  function b64aBuffer(b64) { var bin = atob(b64), n = bin.length, u = new Uint8Array(n); for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
  function resumen(e) {
    var fs = M.estadoFirmas(e);
    return { key: claveEstado(e), programaId: e.programaId, estudiante: e.estudiante, fase: fs.fase, actualizado: new Date().toISOString() };
  }
  var Backend = {
    sesion: function () {
      return GAS ? srvAuth('infoSesion') : Promise.resolve({ email: '', roles: ['jefe', 'decano'], prueba: true });
    },
    excel: function (meta) { return GAS ? srvAuth('plantilla', meta.archivo).then(b64aBuffer) : null; },
    listar: function () {
      if (GAS) return srvAuth('listarBalances');
      var out = [];
      try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('balance:') === 0) { try { var e = JSON.parse(localStorage.getItem(k)); if (e && e.programaId) { var r = resumen(e); r.actualizado = e.bitacora && e.bitacora.length ? e.bitacora[e.bitacora.length - 1].t : ''; out.push(r); } } catch (x) {} } } } catch (e) {}
      return Promise.resolve(out);
    },
    cargar: function (key) {
      if (GAS) return srvAuth('cargarBalance', key).then(function (t) { return JSON.parse(t); });
      try { return Promise.resolve(JSON.parse(localStorage.getItem(key))); } catch (e) { return Promise.reject(e); }
    },
    guardar: function (e) {
      var copia = JSON.parse(JSON.stringify(e));
      if (GAS) return srvAuth('guardarBalance', claveEstado(e), JSON.stringify(copia), JSON.stringify(resumen(e)));
      try { localStorage.setItem(claveEstado(e), JSON.stringify(copia)); } catch (x) {}
      return Promise.resolve();
    },
    borrar: function (key) {
      if (GAS) return srvAuth('eliminarBalance', key);
      try { localStorage.removeItem(key); } catch (e) {}
      return Promise.resolve();
    }
  };

  /* ───── utilidades ───── */
  function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(sel, el) { return (el || document).querySelector(sel); }
  function quien() { return S.sesion.nombre ? S.sesion.nombre + ' (' + ROLES[S.rol] + ')' : ROLES[S.rol]; }
  function fecha(iso) { try { return new Date(iso).toLocaleString('es-CO', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return iso; } }
  function claveEstado(e) { return 'balance:' + e.programaId + ':' + String(e.estudiante.documento).replace(/\D+/g, ''); }

  function leerSesion() {
    return Backend.sesion().then(function (x) {
      S.sesion.email = x.email || ''; S.sesion.nombre = x.nombre || x.email || '';
      S.sesion.roles = x.roles || []; S.sesion.prueba = !!x.prueba;
      if (S.sesion.roles.length && S.sesion.roles.indexOf(S.rol) < 0) S.rol = S.sesion.roles[0];
    });
  }

  /* ───── guardado ───── */
  var colaGuardado = Promise.resolve();
  function guardar() {
    if (!S.est) return colaGuardado;
    var est = S.est;
    S.guardando = 'guardando'; pintarEstadoGuardado();
    colaGuardado = colaGuardado.then(function () { return Backend.guardar(est); }).then(function () {
      S.guardando = 'guardado'; pintarEstadoGuardado();
    }).catch(function (err) {
      S.guardando = 'error'; S.errorGuardado = err.message; pintarEstadoGuardado();
    });
    return colaGuardado;
  }
  function pintarEstadoGuardado() {
    var el = $('#estado-guardado'); if (!el) return;
    var m = { guardando: ['mute', 'Guardando…'], guardado: ['ok', 'Guardado'], error: ['bad', 'No se pudo guardar'] }[S.guardando];
    el.innerHTML = m ? '<span class="chip ' + m[0] + '" title="' + h(S.errorGuardado || '') + '">' + m[1] + '</span>' : '';
  }
  function refrescarGuardados() {
    return Backend.listar().then(function (l) {
      S.guardados = (l || []).sort(function (a, b) { return String(b.actualizado || '').localeCompare(String(a.actualizado || '')); });
    }).catch(function () { S.guardados = []; });
  }

  /* ───── carga de imágenes fijas del PDF ───── */
  function aDataURL(url) {
    return fetch(url).then(function (r) { return r.blob(); }).then(function (b) {
      return new Promise(function (ok) { var fr = new FileReader(); fr.onload = function () { ok(fr.result); }; fr.readAsDataURL(b); });
    }).catch(function () { return null; });
  }
  function cargarAssets() {
    if (window.__ASSETS) { imagenesAssets.logo = window.__ASSETS.logo; imagenesAssets.marca = window.__ASSETS.marca; return Promise.resolve(); }
    return Promise.all([aDataURL('assets/logo-armada.png'), aDataURL('assets/marca-agua.png')]).then(function (r) {
      imagenesAssets.logo = r[0]; imagenesAssets.marca = r[1];
    });
  }

  /* ───── diálogos propios (sin alert/confirm del navegador) ───── */
  function pregunta(titulo, texto, ok, cancelar) {
    return new Promise(function (res) { S.dialogo = { titulo: titulo, texto: texto, ok: ok || 'Aceptar', cancelar: cancelar === undefined ? 'Cancelar' : cancelar, res: res }; render(); });
  }
  function aviso(titulo, texto) { return pregunta(titulo, texto, 'Entendido', null); }
  function vDialogo() {
    var d = S.dialogo;
    return '<div class="modal" data-act="dialogo-no"><div class="box" role="alertdialog" aria-modal="true" style="width:min(460px,94vw)"><div class="hd"><b>' + h(d.titulo) + '</b></div>' +
      '<div style="padding:16px 18px;white-space:pre-line">' + h(d.texto) + '</div><div style="padding:0 18px 16px;display:flex;gap:8px;justify-content:flex-end">' +
      (d.cancelar ? '<button class="btn" data-act="dialogo-no">' + h(d.cancelar) + '</button>' : '') + '<button class="btn pri" data-act="dialogo-si" id="dialogo-ok">' + h(d.ok) + '</button></div></div></div>';
  }

  /* ───── flujo ───── */
  function recalcular() {
    S.res = M.calcular(S.prog, S.est);
    S.ver = M.verificarEstudiante(S.res.sma, S.est.estudiante);
    S.fs = M.estadoFirmas(S.est);
  }
  function fase() { return S.fs ? S.fs.fase : 'borrador'; }
  function bloqueado() { return S.rol !== 'jefe' || fase() !== 'borrador'; }
  function puedeEmitir() { return S.res && S.res.completo && S.ver && S.ver.ok; }

  function abrir(estado, irA) {
    var meta = PR.porId(estado.programaId);
    if (!meta) { aviso('Programa no disponible', 'El programa de este balance ya no tiene plantilla.'); return Promise.resolve(); }
    S.cargando = true; render();
    return LE.cargarPrograma(meta, null, GAS ? Backend.excel : null).then(function (prog) {
      S.prog = prog; S.est = estado; S.cargando = false;
      S.firmaForm = { jefe: {}, decano: {} };
      if (estado.firmas.jefe) S.firmaForm.jefe = { grado: estado.firmas.jefe.grado, nombre: estado.firmas.jefe.nombre, cargo: estado.firmas.jefe.cargo };
      if (estado.firmas.decano) S.firmaForm.decano = { grado: estado.firmas.decano.grado, nombre: estado.firmas.decano.nombre, cargo: estado.firmas.decano.cargo };
      recalcular(); S.vista = irA || 'revision'; S.msg = null; render();
    }).catch(function (err) { S.cargando = false; S.formErr = [String(err.message || err)]; S.vista = 'inicio'; render(); });
  }

  function crear() {
    var f = S.form, meta = PR.porId(f.programaId);
    var errs = [];
    if (!meta) errs.push('Elija el programa de grado.');
    if (!f.documento.trim()) errs.push('Escriba el número de documento.');
    if (!f.nombres.trim() || !f.apellidos.trim()) errs.push('Escriba los nombres y apellidos como están en la solicitud.');
    if (!f.notas.trim()) errs.push('Pegue las notas del SMA.');
    if (errs.length) { S.formErr = errs; S.formAv = null; render(); return; }
    var est = M.nuevoEstado(meta.id, { nombres: f.nombres.trim(), apellidos: f.apellidos.trim(), tipoDoc: f.tipoDoc, documento: f.documento.trim(), nivel: f.nivel }, quien());
    var r = M.agregarNotas(est, f.notas, quien());
    var ver = M.verificarEstudiante(M.unirSMA(est.textos), est.estudiante);
    if (!r.agregados && ver.ok) { errs.push('No se encontraron asignaturas en lo pegado. Copie el historial completo desde el SMA.'); }
    if (!ver.ok) errs = errs.concat(ver.errores);
    if (errs.length) { S.formErr = errs; S.formAv = null; render(); return; }
    S.formErr = null; S.formAv = ver.avisos;
    var previo = S.guardados.some(function (g) { return g.key === claveEstado(est); });
    var seguir = previo ? pregunta('Ya existe un balance', 'Ya hay un balance guardado para este estudiante y programa. ¿Reemplazarlo con uno nuevo?\nSe pierde el registro de cambios del anterior.', 'Reemplazar') : Promise.resolve(true);
    seguir.then(function (si) {
      if (!si) return;

      '<div style="margin-top:12px" class="lbl">Imagen de la firma (se carga cada vez; no se guarda)</div>' +
      '<div class="sigprev" style="margin-top:6px">' + (img ? '<img alt="Firma" src="' + img + '">' : 'Sin firma cargada') + '</div>' +
      '<label class="btn sm" style="margin-top:8px;display:inline-block;cursor:pointer">' + (img ? 'Cambiar imagen' : 'Cargar imagen (PNG o JPG)') + '<input type="file" id="firma-img" accept="image/png,image/jpeg" hidden></label></div>' +
      msg +
      (rol === 'decano' && fs.jefe && !S.imgs.jefe ? '<div class="card" style="padding:12px 16px"><div class="alert warn" style="margin-bottom:8px">La imagen de la firma del Jefe no se guarda. Cárguela para que salga en el PDF, o abra el archivo del balance que le envió.</div><label class="btn sm" style="cursor:pointer;display:inline-block">Cargar firma del Jefe<input type="file" id="firma-img-jefe" accept="image/png,image/jpeg" hidden></label></div>' : '') +
      '<div class="card" style="padding:14px 16px"><div class="steps">' +
      pasoFirma(S.res.completo && S.ver.ok, 'Balance completo' + (S.res.completo ? '' : ' (faltan ' + S.res.faltantes.length + ')')) +
      pasoFirma(fs.jefe, 'Firma del Jefe de Programa' + (fs.jefe ? ' · ' + h(S.est.firmas.jefe.nombre) : '')) +
      pasoFirma(fs.decano, 'Firma del Decano de Facultad' + (fs.decano ? ' · ' + h(S.est.firmas.decano.nombre) : '')) + '</div></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">' +
      '<button class="btn pri" data-act="firmar"' + (puedeFirmar ? '' : ' disabled') + '>' + (firmado ? 'Ya firmó' : rol === 'jefe' ? 'Firmar y cerrar mi parte' : 'Firmar como Decano') + '</button>' +
      '<button class="btn" data-act="pdf"' + (emitir ? '' : ' disabled') + '>Descargar PDF' + (fs.fase === 'firmado' ? '' : ' (pendiente de firma)') + '</button>' +
      '<button class="btn" data-act="exportar">Descargar copia del balance (archivo)</button>' +
      (rol === 'jefe' && fs.fase !== 'borrador' ? '<button class="btn" data-act="reabrir">Reabrir balance</button>' : '') + '</div>' +
      (!emitir ? '<div class="alert warn">No se puede firmar ni descargar el PDF hasta que el balance esté completo y el estudiante verificado.</div>' : '') +
      (rol === 'decano' && !fs.jefe ? '<div class="alert mute">El Jefe de Programa aún no ha firmado. Ábrale el archivo del balance cuando lo envíe.</div>' : '') +
      '</div>';
    return '<div class="firma">' + panel + '<div id="prev" style="min-height:0"></div></div>';
  }

  function render() {
    var app = $('#app');
    var cuerpo;
    if (S.vista === 'inicio' || !S.est) cuerpo = vInicio();
    else if (S.vista === 'revision') cuerpo = vRevision();
    else cuerpo = vFirma();
    if (S.arranque) { app.innerHTML = vTop() + '<main><div class="card vacío" style="height:100%;display:flex;align-items:center;justify-content:center">Cargando…</div></main>'; return; }
    if (S.errorArranque) { app.innerHTML = vTop() + '<main><div class="card" style="padding:24px;max-width:640px;margin:40px auto"><b>No se pudo iniciar</b><p>' + h(S.errorArranque) + '</p></div></main>'; return; }
    if (!S.sesion.roles.length) { app.innerHTML = vTop() + '<main><div class="card" style="padding:24px;max-width:640px;margin:40px auto"><b>Sin permiso</b><p>La cuenta ' + h(S.sesion.email || '') + ' no tiene un rol asignado para el Balance Académico. Solicítelo a la Oficina de Estadística.</p></div></main>'; return; }
    app.innerHTML = vTop() + vTabs() + '<main>' + cuerpo + '</main>' + (S.modal ? vModal() : '') + (S.dialogo ? vDialogo() : '');
    if (S.vista === 'firma' && S.est) pintarPrevia();
    if (S.modal) { var q = $('#modal-q'); if (q) q.focus(); }
    if (S.dialogo) { var ok = $('#dialogo-ok'); if (ok) ok.focus(); }
    pintarEstadoGuardado();
  }

  /* vista previa con pdf.js (funciona también dentro del recuadro protegido de Apps Script) */
  var pdfjsListo = null;
  function prepararPdfjs() {
    if (pdfjsListo) return pdfjsListo;
    pdfjsListo = new Promise(function (ok, no) {
      if (!window.pdfjsLib) return no(new Error('pdf.js no cargó'));
      var v = pdfjsLib.version, url = GAS ? 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + v + '/pdf.worker.min.js' : 'vendor/pdf.worker.min.js';
      fetch(url).then(function (r) { return r.text(); }).then(function (t) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: 'text/javascript' })); ok();
      }).catch(no);
    });
    return pdfjsListo;
  }
  var tokenPrevia = 0;
  function pintarPrevia() {
    var cont = $('#prev'); if (!cont) return;
    if (!S.res.completo) {
      var motivo = S.res.avisosNombre ? 'Hay nombres con puntos suspensivos por completar.' : 'Faltan asignaturas por completar.';
      cont.innerHTML = '<div class="card vacío" style="height:100%;display:flex;align-items:center;justify-content:center">La vista previa del PDF aparece cuando el balance está completo.<br>' + motivo + '</div>'; return;
    }
    var mio = ++tokenPrevia;
    cont.innerHTML = '<div class="card vacío" style="height:100%;display:flex;align-items:center;justify-content:center">Armando vista previa…</div>';
    try {
      var buf = construirPDF().output('arraybuffer');
      prepararPdfjs().then(function () { return pdfjsLib.getDocument({ data: buf }).promise; }).then(function (pdf) { return pdf.getPage(1); }).then(function (page) {
        if (mio !== tokenPrevia || !$('#prev')) return;
        var ancho = Math.max(300, Math.min(900, $('#prev').clientWidth - 24)), vp0 = page.getViewport({ scale: 1 });
        var esc = ancho / vp0.width * (window.devicePixelRatio || 1), vp = page.getViewport({ scale: esc });
        var cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; cv.style.width = ancho + 'px'; cv.style.height = (ancho * vp0.height / vp0.width) + 'px';
        cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', 'Vista previa del Balance Académico');
        return page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise.then(function () {
          var c = $('#prev'); if (!c || mio !== tokenPrevia) return;
          c.innerHTML = '<div class="prevbox"></div>'; c.firstChild.appendChild(cv);
        });
      }).catch(function (err) { var c = $('#prev'); if (c) c.innerHTML = '<div class="alert warn">No se pudo mostrar la vista previa (' + h(err.message) + '). Puede descargar el PDF igualmente.</div>'; });
    } catch (err) { cont.innerHTML = '<div class="alert bad">No se pudo armar el PDF: ' + h(err.message) + '</div>'; }
  }

  /* ───── modal de selección de asignatura del SMA ───── */
  function vModal() {
    var m = S.modal, r = S.res, q = M.normTexto(m.q || '');
    var lista = r.sinUsar.filter(function (x) { return !q || M.normTexto(x.cod + ' ' + x.nombre).indexOf(q) >= 0; });
    if (m.tipo === 'optativa') lista.sort(function (a, b) { return (S.prog.catalogo[M.normCode(b.cod)] ? 1 : 0) - (S.prog.catalogo[M.normCode(a.cod)] ? 1 : 0); });
    var tit = m.tipo === 'optativa' ? 'Agregar optativa a ' + m.bloque.label : 'Aplicar equivalencia a ' + m.fila.nombreVig;
    var sub = m.tipo === 'optativa' ? 'Asignaturas del SMA que no se usaron en el pénsum. Las del catálogo del programa van primero.' : 'Elija la asignatura cursada que equivale a ' + (m.fila.codVig ? m.fila.codVig + ' · ' : '') + m.fila.nombreVig + '. Queda registrado en el balance.';
    return '<div class="modal" data-act="cerrar-modal"><div class="box" role="dialog" aria-modal="true"><div class="hd"><div><b>' + h(tit) + '</b><div style="color:var(--mute);font-size:12px">' + h(sub) + '</div></div><button class="btn sm" data-act="cerrar-modal" style="margin-left:auto">Cerrar</button></div>' +
      '<input class="q" id="modal-q" placeholder="Buscar por código o nombre" value="' + h(m.q || '') + '"><div class="bd">' +
      (lista.length ? lista.map(function (x) {
        var cat = S.prog.catalogo[M.normCode(x.cod)];
        var nombre = cat && cat.nombre ? cat.nombre : x.nombre;
        var aprobada = x.def >= r.minimo || x.hab >= r.minimo;
        return '<div class="pick"><div class="t"><b class="mono">' + h(x.cod) + '</b> ' + h(nombre) + (cat ? ' <span class="chip ok" style="display:inline-flex">en catálogo</span>' : '') + '<span>' + h(x.periodo) + ' · ' + x.crd + ' créd. · nota ' + M.fmtNota(x.def) + (x.hab > 0 ? ' · hab. ' + M.fmtNota(x.hab) : '') + '</span></div>' +
          '<span class="chip ' + (aprobada ? 'ok' : 'bad') + '">' + (aprobada ? 'Aprobada' : 'No aprobada') + '</span><button class="btn sm pri" data-act="elegir" data-k="' + h(x.key) + '">Elegir</button></div>';
      }).join('') : '<div class="vacío">No hay asignaturas del SMA disponibles' + (q ? ' con esa búsqueda' : '') + '.</div>') + '</div></div></div>';
  }

  /* ───── eventos ───── */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-vista],[data-act],[data-filtro]');
    if (!t) return;
    if (t.hasAttribute('data-vista')) { if (!t.disabled) { S.vista = t.getAttribute('data-vista'); S.msg = null; render(); } return; }
    if (t.hasAttribute('data-filtro')) { S.filtro = t.getAttribute('data-filtro'); render(); return; }
    var act = t.getAttribute('data-act');
    if (act === 'cerrar-modal') { if (ev.target === t || t.tagName === 'BUTTON') { S.modal = null; render(); } return; }
    if (act === 'crear') crear();
    else if (act === 'abrir-g') {
      var g = S.guardados[+t.getAttribute('data-i')]; if (!g) return;
      S.cargando = true; render();
      Backend.cargar(g.key).then(function (e) {
        S.imgs = { jefe: null, decano: null }; S.dims = { jefe: null, decano: null };
        return abrir(e, 'revision');
      }).catch(function (err) { S.cargando = false; S.formErr = ['No se pudo abrir el balance: ' + err.message]; render(); });
    }
    else if (act === 'borrar-g') {
      var g2 = S.guardados[+t.getAttribute('data-i')]; if (!g2) return;
      pregunta('Eliminar balance', 'Se eliminará el balance de ' + M.titulo(g2.estudiante.nombres + ' ' + g2.estudiante.apellidos) + '. No se puede deshacer.', 'Eliminar').then(function (si) {
        if (si) Backend.borrar(g2.key).then(refrescarGuardados).then(render).catch(function (err) { aviso('No se pudo eliminar', err.message); });
      });
    }
    else if (act === 'dialogo-si' || act === 'dialogo-no') {
      if (act === 'dialogo-no' && ev.target !== t) return;
      var d = S.dialogo; S.dialogo = null; render(); if (d) d.res(act === 'dialogo-si');
    }
    else if (act === 'equiv') { var fila = S.res.lineas.filter(function (l) { return l.id === t.getAttribute('data-id'); })[0]; S.modal = { tipo: 'equiv', fila: fila, q: '' }; render(); }
    else if (act === 'optativa') { var bl = S.res.bloques.filter(function (b) { return b.id === t.getAttribute('data-b'); })[0]; S.modal = { tipo: 'optativa', bloque: bl, q: '' }; render(); }
    else if (act === 'elegir') {
      var reg = S.res.registros.filter(function (x) { return x.key === t.getAttribute('data-k'); })[0], m = S.modal;
      S.modal = null;
      if (reg) aplicarCambio(function () { if (m.tipo === 'optativa') M.agregarOptativa(S.est, m.bloque, reg, quien()); else M.aplicarEquivalencia(S.est, m.fila, reg, quien()); });
    }
    else if (act === 'quitar-eq') { var f2 = S.res.lineas.filter(function (l) { return l.id === t.getAttribute('data-id'); })[0]; aplicarCambio(function () { M.quitarEquivalencia(S.est, f2, quien()); }); }
    else if (act === 'quitar-opt') { var k = t.getAttribute('data-id'), lo = S.res.lineas.filter(function (l) { return l.regKey === k; })[0]; aplicarCambio(function () { M.quitarOptativa(S.est, k, quien(), lo ? lo.cod + ' ' + lo.nombre : ''); }); }
    else if (act === 'mas-notas') {
      var ta = $('#mas-notas'); if (!ta || !ta.value.trim()) return;
      aplicarCambio(function () {
        var prev = M.unirSMA(S.est.textos);
        var r = M.agregarNotas(S.est, ta.value, quien());
        var ver = M.verificarEstudiante(M.unirSMA(S.est.textos), S.est.estudiante);
        if (!ver.ok) { S.est.textos.pop(); S.est.bitacora.pop(); S.msg = null; aviso('No se agregaron las notas', ver.errores.join('\n')); return; }
        if (!r.agregados) aviso('Sin cambios', 'Esas notas ya estaban en el balance o no se reconocieron.');
      });
    }
    else if (act === 'firmar') firmar();
    else if (act === 'pdf') descargarPDF();
    else if (act === 'exportar') exportarArchivo();
    else if (act === 'reabrir') reabrir();
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'rol') { S.rol = t.value; S.msg = null; render(); return; }
    if (t.id && t.id.indexOf('f-') === 0) {
      var k = t.id.slice(2); S.form[k] = t.value;
      if (k === 'programaId') { var p = PR.porId(t.value); if (p) S.form.nivel = p.nivel; render(); }
      return;
    }
    if (t.id === 'abrir-archivo') { importarArchivo(t.files[0]); return; }
    if (t.id === 'firma-img') { cargarFirma(t.files[0]); return; }
    if (t.id === 'firma-img-jefe') { cargarFirma(t.files[0], 'jefe'); return; }
    if (t.id && t.id.indexOf('fi-') === 0) {
      var c = t.id.slice(3), f = S.firmaForm[S.rol] || (S.firmaForm[S.rol] = {}); f[c] = t.value; return;
    }
    if (t.hasAttribute && t.hasAttribute('data-edit')) {
      var campo = t.getAttribute('data-edit'), id = t.getAttribute('data-id'), esOpt = t.getAttribute('data-opt') === '1';
      var l = S.res.lineas.filter(function (x) { return (esOpt ? x.regKey : x.id) === id; })[0];
      if (!l) return;
      aplicarCambio(function () {
        if (esOpt) M.editarOptativa(S.est, id, campo, t.value, quien(), campo === 'cod' ? l.cod : l.nombre);
        else M.editarCursado(S.est, l, campo, t.value, quien());
      });
    }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'modal-q') { S.modal.q = t.value; var pos = t.selectionStart; render(); var q = $('#modal-q'); q.focus(); q.setSelectionRange(pos, pos); }
    if (t.id === 'f-notas') S.form.notas = t.value;
    if (t.id && t.id.indexOf('f-') === 0 && t.id !== 'f-notas' && t.tagName === 'INPUT') S.form[t.id.slice(2)] = t.value;
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.modal) { S.modal = null; render(); } });

  /* ───── arranque ───── */
  function precargar() {
    var q = new URLSearchParams(window.__PARAMS ? new URLSearchParams(window.__PARAMS).toString() : location.search), f = S.form;
    var p = PR.porId(q.get('programa')) || PR.porNombre(q.get('programa'));
    if (p) { f.programaId = p.id; f.nivel = p.nivel; }
    if (q.get('tipoDoc')) f.tipoDoc = q.get('tipoDoc').toUpperCase().slice(0, 2);
    if (q.get('documento')) f.documento = q.get('documento');
    if (q.get('nombres')) f.nombres = q.get('nombres');
    if (q.get('apellidos')) f.apellidos = q.get('apellidos');
    if (/pos/i.test(q.get('nivel') || '')) f.nivel = 'posgrado'; else if (/pre/i.test(q.get('nivel') || '')) f.nivel = 'pregrado';
    var manual = q.get('programa') && !p && PR.esManual(q.get('programa'));
    if (manual) S.formErr = ['Este programa no genera balance aquí: se sigue cargando el archivo a mano en la solicitud.'];
  }
  render();
  Promise.all([leerSesion(), refrescarGuardados(), cargarAssets()]).then(function () {
    S.arranque = false; precargar(); render();
  }).catch(function (err) { S.arranque = false; S.errorArranque = err.message; render(); });
  window.BalanceApp = { estado: S }; // útil para pruebas
})();
</script>
</body>
</html>
