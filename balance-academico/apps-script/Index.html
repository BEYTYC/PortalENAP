<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance Académico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--navy:#12294A;--navy2:#1F3D6B;--gold:#B8892B;--bg:#F3F5F9;--line:#D4DBE7;--line2:#E5E9F1;--ink:#16233A;--mute:#4A5A78;
  --ok-bg:#DFF2E7;--ok:#115C37;--warn-bg:#FFEFCF;--warn:#6E4300;--bad-bg:#FADFDC;--bad:#8E1A12;--mute-bg:#E5E9F1;--mute2:#33425C}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Aptos Display','Aptos','Segoe UI Variable Text','Segoe UI','Libre Franklin',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 24px;height:52px;border-bottom:3px solid var(--gold);flex-shrink:0}
.top b{font-size:16px}.top .sep{opacity:.5}
.top .quien{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.top select{background:var(--navy2);color:#fff;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.top .prueba{font-size:11px;opacity:.7}
.tabs{display:flex;gap:4px;padding:10px 24px 0;border-bottom:1px solid var(--line);background:#fff;flex-shrink:0;align-items:flex-end}
.tab{border:0;background:none;padding:9px 16px;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tab[aria-selected=true]{color:var(--navy);border-bottom-color:var(--gold)}
.tab:disabled{opacity:.45;cursor:not-allowed}
.tab .n{width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.tabs .cred{margin-left:auto;align-self:center;padding:0 0 6px 18px;font-size:12px;color:var(--mute);white-space:nowrap;font-weight:500}
.tabs .est + .cred{margin-left:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #cfd7e6;border-top-color:var(--navy,#12284C);border-radius:50%;animation:giro .7s linear infinite;vertical-align:-2px;flex-shrink:0}
@keyframes giro{to{transform:rotate(360deg)}}
#ocupado{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(18,41,74,.45)}
#ocupado.on{display:flex}
#ocupado .box{background:#fff;border-radius:12px;width:min(380px,92vw);border-top:4px solid var(--gold)}
#ocupado .hd{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;color:var(--navy,#12284C)}
#ocupado .bd{padding:22px 18px;display:flex;align-items:center;gap:14px;font-size:14px}
#ocupado .spin{width:26px;height:26px;border-width:3px}
.gd.borrando{opacity:.55;pointer-events:none}
.tabs{position:relative;overflow:hidden;align-items:center;gap:14px;padding:14px 24px;color:#fff;border-bottom:5px solid #D3A62A;background:radial-gradient(120% 220% at 50% 45%,#123A73 0%,#0B2A5B 32%,#071142 62%,#04142E 100%)}
.tabs>*{position:relative;z-index:1}
.tabs .deco{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.tabs .deco svg{width:100%;height:100%}
.tabs .titulo{font-size:17px;font-weight:600;white-space:nowrap}
.tabs .navbtns{display:flex;gap:10px;margin-left:auto}
.tabs .chip.mute{background:rgba(255,255,255,.12);color:#fff}
.tabs .btn.nav{background:#fff;color:#0B2A5B;border:1px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.tabs .btn.nav:hover:not(:disabled){background:#E3EAF4}
.tabs .btn.nav.dorado{background:#D3A62A;border-color:#D3A62A;color:#071142}
.tabs .btn.nav.dorado:hover:not(:disabled){background:#E8C662}
.tabs .btn.nav:disabled{background:#95AECF;border-color:#95AECF;color:#4C6386;box-shadow:none;cursor:default}
.btn.nav{display:inline-flex;align-items:center;gap:8px;font-size:15px;padding:10px 18px;font-weight:600}
.tabs .est{margin-left:4px;padding-bottom:0;display:flex;gap:8px;align-items:center;font-weight:600}
main{flex:1;min-height:0;padding:16px 24px;overflow:hidden}
.card{background:#fff;border:1px solid var(--line);border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.mute{background:var(--mute-bg);color:var(--mute2)}
.btn{font-weight:600;border-radius:8px;padding:7px 14px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.btn:hover:not(:disabled){background:#EEF2F9}
.btn.pri{background:var(--navy);color:#fff}.btn.pri:hover:not(:disabled){background:var(--navy2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1400}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
label.f{min-width:0;display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
label.f input,label.f select,label.f textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;font-weight:400;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
label.f input:focus,label.f select:focus,label.f textarea:focus,.cell:focus{outline:2px solid var(--gold);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.alert{border-radius:8px;padding:9px 12px;font-size:13px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.ok{background:var(--ok-bg);color:var(--ok)}.alert.mute{background:var(--mute-bg);color:var(--mute2)}

/* inicio */
.inicio{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.inicio .col{display:flex;flex-direction:column;gap:12px;min-height:0}
.inicio textarea{flex:1;min-height:120px;resize:none;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.guardados{overflow:auto;display:flex;flex-direction:column}
.gd{display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line2)}
.gd:last-child{border-bottom:0}
.gd .t{flex:1;min-width:0}.gd .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gd .t span{color:var(--mute);font-size:12px}
.gd .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}

/* revisión */
.rev{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
.tablewrap{display:flex;flex-direction:column;min-height:0}
.tbar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.tbar .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.tbar .seg button{border:0;background:#fff;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--mute)}
.tbar .seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.scroll{overflow:auto;flex:1;min-height:0}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:#F7F9FC;text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:7px 8px;border-bottom:1px solid var(--line);z-index:1;white-space:nowrap}
td{padding:3px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.area td{background:#FBF6EA;color:#6B4E10;font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;border-left:3px solid var(--gold);padding:5px 8px}
tr.area td .chip{margin-left:8px;text-transform:none;letter-spacing:0}
tr.falta td{background:#FFFBF1}
tr.perdida td{background:#FEF3F1}
.cell{width:100%;border:1px solid transparent;border-radius:6px;padding:3px 6px;background:transparent}
.cell:hover:not(:disabled){border-color:var(--line);background:#fff}
.cell:disabled{color:var(--ink)}
.cell.edit{background:#FFF8E8}
.cell.falta-nombre{border-color:var(--bad);background:#FEF3F1}
table{font-size:13px}
td:nth-child(2){min-width:230px}
.tablewrap th:nth-child(1),.tablewrap th:nth-child(3),.tablewrap th:nth-child(5),.tablewrap th:nth-child(6),.tablewrap th:nth-child(7),.tablewrap th:nth-child(8),
.tablewrap td:nth-child(1),.tablewrap td:nth-child(3),.tablewrap td:nth-child(5),.tablewrap td:nth-child(6),.tablewrap td:nth-child(7),.tablewrap td:nth-child(8){text-align:center}
.tablewrap td:nth-child(3) input,.tablewrap td:nth-child(1) input,.tablewrap td:nth-child(5) input{text-align:center}td:nth-child(4){min-width:250px}
td.num{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.kpi b{display:block;font-size:22px;color:var(--navy);line-height:1.15}.kpi span{font-size:12px;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden;margin:0 14px 14px}.bar i{display:block;height:100%;background:var(--gold)}
.log{max-height:230px;overflow:auto;font-size:12px}
.log div{padding:6px 14px;border-bottom:1px solid var(--line2)}
.log time{color:var(--mute);display:block;font-size:11px}

/* firma */
.firma{height:100%;display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px}
.firma .panel{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0;padding-right:2px}
.prevbox{height:100%;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#E9EDF4;padding:12px;display:flex;justify-content:center;align-items:flex-start}
.prevbox canvas{box-shadow:0 2px 12px rgba(18,41,74,.25);background:#fff;display:block}
.pgwrap{position:relative;flex:none}
 #f-notas{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:ui-monospace,Consolas,monospace;font-size:12px;resize:none;width:100%;background:#fff}
.chk{width:17px;height:17px;accent-color:var(--navy);cursor:pointer;flex:none}
.grupo{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:#FAFBFD}
.sigmini{border:1px dashed var(--line);border-radius:8px;height:56px;display:flex;align-items:center;justify-content:center;color:var(--mute);background:#fff;overflow:hidden;font-size:12px}
.sigmini img{max-height:52px;max-width:100%}
.sigdrag{position:absolute;cursor:move;outline:1.5px dashed var(--gold);outline-offset:0;touch-action:none;background:rgba(184,137,43,.07);user-select:none}
.sigdrag:focus-visible{outline:2px solid var(--navy)}
.sigdrag img{width:100%;height:100%;display:block;pointer-events:none}
.sigdrag .hd{position:absolute;width:11px;height:11px;background:#fff;border:2px solid var(--gold);border-radius:2px}
.sigdrag .nw{left:-6px;top:-6px;cursor:nwse-resize}.sigdrag .se{right:-6px;bottom:-6px;cursor:nwse-resize}
.sigdrag .ne{right:-6px;top:-6px;cursor:nesw-resize}.sigdrag .sw{left:-6px;bottom:-6px;cursor:nesw-resize}
.sigprev{border:1px dashed var(--line);border-radius:8px;height:70px;display:flex;align-items:center;justify-content:center;color:var(--mute);background:#fff;overflow:hidden}
.sigprev img{max-height:66px;max-width:100%}
.steps{display:flex;flex-direction:column;gap:8px}
.steps .s{display:flex;gap:10px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--mute2);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dot.ok{background:var(--ok);color:#fff}

/* modal */
.modal{position:fixed;inset:0;background:rgba(18,41,74,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:#fff;border-radius:12px;width:min(760px,94vw);max-height:84vh;display:flex;flex-direction:column;border-top:4px solid var(--gold)}
.modal .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal .bd{overflow:auto}
.modal input.q{margin:10px 18px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:calc(100% - 36px)}
.pick{display:flex;gap:10px;align-items:center;padding:7px 18px;border-top:1px solid var(--line2)}
.pick .t{flex:1;min-width:0}.pick .t span{display:block;color:var(--mute);font-size:12px}
.vacío{padding:30px;text-align:center;color:var(--mute)}
@media (max-width:1100px){.rev{grid-template-columns:1fr}.inicio,.firma{grid-template-columns:1fr}main{overflow:auto}}
</style>
</head>

<div id="app"></div>

     `extra` (opcional): nombres ya bien escritos (p. ej. los del pénsum) de los que se aprenden más palabras. */
  function tildar(texto, extra) {
    var mapa = mapaTilde();
    if (extra && extra.length) {
      mapa = Object.assign({}, mapa);
      extra.forEach(function (t) { String(t || '').split(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+/).forEach(function (w) { if (w && quitarTildes(w) !== w) mapa[quitarTildes(w).toLowerCase()] = w.toLowerCase(); }); });
    }
    return String(texto == null ? '' : texto).replace(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+/g, function (w) {
      var b = mapa[quitarTildes(w).toLowerCase()];
      if (!b || quitarTildes(w) !== w && w.toLowerCase() === b) return w;
      if (w === w.toUpperCase() && w.length > 1) return b.toUpperCase();
      if (w.charAt(0) === w.charAt(0).toUpperCase() && w.charAt(0) !== w.charAt(0).toLowerCase()) return b.charAt(0).toUpperCase() + b.slice(1);
      return b;
    });
  }
  function soloDigitos(s) { return String(s == null ? '' : s).replace(/\D+/g, ''); }
  function titulo(s) {
    return String(s || '').toLowerCase().replace(/(^|[\s\-'(])([a-záéíóúüñ])/g, function (m, a, b) { return a + b.toUpperCase(); })
      .replace(/\b(De|Del|La|Las|Los|Y|E)\b/g, function (m, w, i) { return i === 0 ? w : w.toLowerCase(); }).replace(/\b(Ii|Iii|Iv|Vi|Vii|Viii|Ix)\b/g, function (m) { return m.toUpperCase(); });
  }
  /* Notas: siempre 3 decimales y coma (7,950 · 10,000). */
  function fmtNota(n) {
    if (n == null || n === '' || isNaN(n)) return '';
    return (Math.round(Number(n) * 1000) / 1000).toFixed(3).replace('.', ',');
  }
  function fmtFecha(d) { d = d || new Date(); return d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear(); }
  function numero(s) {
    if (typeof s === 'number') return s;
    var t = String(s == null ? '' : s).trim().replace(',', '.');
    var n = parseFloat(t);
    return isNaN(n) ? 0 : n;
  }
  function hash(str) { // FNV-1a, suficiente para detectar cambios
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
    return ('00000000' + h.toString(16)).slice(-8);

  /* ───────── lector del SMA ───────── */
  var RE_PERIODO = /^\s*(\d{4})\s*-\s*(\d)\b/;

  function parseSMA(texto) {
    var lineas = String(texto || '').replace(/\r/g, '').split('\n');
    var ident = { codigo: '', documento: '', sexo: '', apellidos: '', nombres: '', programa: '', semestre: '' };
    var registros = [], periodos = [], periodoActual = null, avisos = [];
    var cont = {};
    lineas.forEach(function (ln) {
      var celdas = ln.split('\t').map(function (c) { return c.trim(); });
      var c0 = celdas[0] || '';
      var m;
      if (/^c[oó]digo$/i.test(c0) && celdas[1] && /ident/i.test(celdas[1])) {
        ident.codigo = (celdas[1].match(/^(\S+)/) || [])[1] || '';
        m = celdas[1].match(/Ident\.?\s+(\S+)/i); if (m) ident.documento = m[1];
        m = celdas[1].match(/Sexo\s+(\S+)/i); if (m) ident.sexo = m[1];
        return;
      }
      if (/^apellidos$/i.test(c0)) { ident.apellidos = celdas[1] || ''; return; }
      if (/^nombres?$/i.test(c0)) { ident.nombres = celdas[1] || ''; return; }
      if (/^programa$/i.test(c0)) {
        var p = celdas[1] || '';
        m = p.match(/Sem:\s*(\d+)/i); if (m) ident.semestre = m[1];
        ident.programa = p.replace(/\s*Sem:.*$/i, '').trim();
        return;
      }
      m = ln.match(RE_PERIODO);
      if (m && celdas.length === 1) {
        periodoActual = m[1] + ' - ' + m[2];
        if (periodos.indexOf(periodoActual) < 0) periodos.push(periodoActual);
        return;
      }
      // fila de materia: Item, Código, Materia, Crd, 1P..4P, Def, Hab, Final
      if (/^\d+$/.test(c0) && celdas.length >= 10 && periodoActual) {
        var cod = celdas[1];
        var k = periodoActual + '|' + normCode(cod);
        cont[k] = (cont[k] || 0) + 1;
        registros.push({
          key: k + '|' + cont[k], periodo: periodoActual, item: +c0,
          cod: cod, nombre: celdas[2], crd: numero(celdas[3]),
          p: [numero(celdas[4]), numero(celdas[5]), numero(celdas[6]), numero(celdas[7])],
          def: numero(celdas[8]), hab: numero(celdas[9]), final: numero(celdas[10])
        });
      }
    });
    return { identidad: ident, periodos: periodos, registros: registros, avisos: avisos };
  }

  function firmaRegistro(r) { return [r.periodo, normCode(r.cod), r.def, r.hab, r.p.join(',')].join('|'); }

  /* Une varios pegados; los grupos repetidos (mismo periodo, código y notas) se cuentan una vez. */
  function unirSMA(textos) {
    var vistos = {}, registros = [], periodos = [], ids = [], cont = {};
    (textos || []).forEach(function (t, idx) {
      var s = parseSMA(t);
      var estaVez = {};
      s.registros.forEach(function (r) {
        var f = firmaRegistro(r);
        if (vistos[f] != null && vistos[f] !== idx) return;      // repetido de un pegado anterior
        vistos[f] = idx; estaVez[f] = (estaVez[f] || 0) + 1;
        var base = r.periodo + '|' + normCode(r.cod);
        cont[base] = (cont[base] || 0) + 1;
        r.key = base + '|' + cont[base];
        registros.push(r);
      });
      s.periodos.forEach(function (p) { if (periodos.indexOf(p) < 0) periodos.push(p); });
      if (s.identidad.documento || s.identidad.nombres || s.identidad.apellidos) ids.push(s.identidad);
    });
    periodos.sort(compararPeriodo);
    return { identidades: ids, periodos: periodos, registros: registros };
  }

  function compararPeriodo(a, b) {
    var x = String(a).split(/\s*-\s*/), y = String(b).split(/\s*-\s*/);
    return (+x[0] - +y[0]) || (+x[1] - +y[1]);
  }

  /* Periodo de terminación: el último con notas. Como en la plantilla, 3 o más cuenta como 2. */
  function periodoTerminacion(registros) {
    var ult = null;
    registros.forEach(function (r) {
      if (!(r.def > 0 || r.hab > 0 || r.final > 0)) return;
      if (!ult || compararPeriodo(r.periodo, ult) > 0) ult = r.periodo;
    });
    if (!ult) return '';
    var p = ult.split(/\s*-\s*/);
    return p[0] + ' - ' + (+p[1] > 2 ? 2 : p[1]);
  }

  /* ───────── verificación de identidad ───────── */
  function fichaNombre(s) { return normTexto(s).split(' ').filter(Boolean).sort().join(' '); }

  /* est: {nombres, apellidos, tipoDoc: 'CC'|'PA'|'CE'..., documento}.
     Devuelve {ok, errores[], avisos[]}; los errores bloquean la creación. */
  /* Un pegado puede traer varios estudiantes: cada historial empieza con “Historia Academica”
     (o, si falta, con “Periodo Actual”). */
  function separarHistorias(texto) {
    var lineas = String(texto || '').replace(/\r/g, '').split('\n'), marca = [];
    lineas.forEach(function (l, i) { if (/^\s*Historia\s+Acad[eé]mica\s*$/i.test(l)) marca.push(i); });
    if (marca.length < 1) lineas.forEach(function (l, i) { if (/^\s*Periodo\s+Actual\b/i.test(l)) marca.push(i); });
    if (marca.length < 2) return String(texto || '').trim() ? [String(texto).trim()] : [];
    var out = [];
    marca.forEach(function (ini, k) { var t = lineas.slice(ini, k + 1 < marca.length ? marca[k + 1] : lineas.length).join('\n').trim(); if (t) out.push(t); });
    return out;
  }
  /* Los datos del estudiante salen del propio SMA. */
  function estudianteDeSMA(texto) {
    var id = parseSMA(texto).identidad;
    return { documento: id.documento || '', nombres: tildar(id.nombres || ''), apellidos: tildar(id.apellidos || ''), programaSMA: id.programa || '', tipoDoc: 'CC' };
  }

  function verificarEstudiante(smaUnido, est) {
    var errores = [], avisos = [];
    var ids = smaUnido.identidades || [];
    if (!ids.length) {
      errores.push('No se encontró el encabezado del estudiante en lo pegado. Copie el historial completo desde el SMA, con “Código … N° Ident.”, apellidos y nombre.');
      return { ok: false, errores: errores, avisos: avisos };
    }
    var docs = {};
    ids.forEach(function (i) { if (i.documento) docs[soloDigitos(i.documento)] = 1; });
    if (Object.keys(docs).length > 1) errores.push('Lo pegado trae más de un número de identificación. Pegue solo las notas de este estudiante.');
    var esCedula = /^(cc|c\.c|cedula|cédula|cedula de ciudadania)/i.test(String(est.tipoDoc || 'CC').trim());
    var nombreSolicitud = fichaNombre((est.nombres || '') + ' ' + (est.apellidos || ''));
    var nombresSMA = ids.map(function (i) { return fichaNombre((i.nombres || '') + ' ' + (i.apellidos || '')); });
    var coincideNombre = nombresSMA.every(function (n) { return n === nombreSolicitud; });
    if (esCedula) {
      var docSol = soloDigitos(est.documento);
      var iguales = Object.keys(docs).every(function (d) { return d === docSol; });
      if (!iguales) errores.push('La cédula del SMA no es la de la solicitud. Revise la cédula en la solicitud o en el SMA.');
      else if (!coincideNombre) avisos.push('La cédula coincide, pero el nombre del SMA es distinto al de la solicitud. Verifique que sea el mismo estudiante.');
    } else {
      if (!coincideNombre) errores.push('Los nombres del SMA no coinciden con los de la solicitud. Con pasaporte o cédula de extranjería solo se comparan los nombres.');
    }

  }

  /* ───────── estado del balance ───────── */
  function nuevoEstado(programaId, estudiante, quien) {
    var e = {
      v: 1, programaId: programaId,
      estudiante: {
        nombres: estudiante.nombres || '', apellidos: estudiante.apellidos || '',
        tipoDoc: estudiante.tipoDoc || 'CC', documento: estudiante.documento || '', nivel: estudiante.nivel || ''
      },
      textos: [],          // notas pegadas tal cual salen del SMA
      ediciones: {},       // idFila -> {cod, nombre}  (solo código y nombre cursado, nunca notas)
      vinculos: {},        // idFila -> key de registro SMA (equivalencia aplicada por el jefe)
      optativas: [],       // [{bloque, reg, cod?, nombre?}]
      requisitos: { pago: false, cumple: false },   // el jefe confirma: pagó el balance previo / cumplió los requisitos del pénsum para graduarse
      observaciones: '',   // texto libre del jefe que sale en el recuadro OBSERVACIONES del PDF
      creado: new Date().toISOString(),
      firmas: { jefe: null },
      bitacora: []
    };
    registrar(e, quien, 'creó el balance');
    return e;
  }

  function registrar(e, quien, accion, detalle) {
    e.bitacora.push({ t: new Date().toISOString(), quien: quien || '', accion: accion, detalle: detalle || '' });
  }

  /* Lo que firman: si esto cambia, la firma deja de valer. */
  function huella(e) {
    return hash(JSON.stringify({
      p: e.programaId, s: e.estudiante, t: e.textos.map(function (x) { return hash(x); }),
      d: e.ediciones, v: e.vinculos, o: e.optativas,
      q: (e.requisitos && (e.requisitos.pago || e.requisitos.cumple)) ? e.requisitos : undefined,
      b: e.observaciones || undefined      // vacío no cambia la huella: los balances anteriores siguen válidos
    }));
  }

  var ETQ_REQ = { pago: 'el pago del balance previo', cumple: 'el cumplimiento de los requisitos del pénsum para la graduación' };
  function editarRequisito(e, campo, valor, quien) {
    e.requisitos = e.requisitos || { pago: false, cumple: false };
    valor = !!valor;
    if (!!e.requisitos[campo] === valor) return false;
    e.requisitos[campo] = valor;
    registrar(e, quien, (valor ? 'confirmó ' : 'quitó la confirmación de ') + ETQ_REQ[campo]);
    return true;
  }

  var MAX_OBSERVACIONES = 400;
  function editarObservaciones(e, texto, quien) {
    var t = String(texto == null ? '' : texto).replace(/\s+/g, ' ').trim().slice(0, MAX_OBSERVACIONES);
    if (t === (e.observaciones || '')) return false;
    e.observaciones = t;
    registrar(e, quien, t ? 'editó las observaciones' : 'borró las observaciones', t ? t.slice(0, 80) + (t.length > 80 ? '…' : '') : '');
    return true;
  }

  function estadoFirmas(e) {
    var h = huella(e);
    function vig(f) { return !!(f && f.huella === h); }
    var j = vig(e.firmas.jefe), d = vig(e.firmas.decano);
    return { jefe: j, decano: d, huella: h,

      fase: j ? 'firmado' : 'borrador' };      // solo firma el Jefe de Programa
  }

  function agregarNotas(e, texto, quien) {
    var t = String(texto || '').trim();

    var antes = unirSMA(e.textos).registros.length;
    e.textos.push(t);
    var despues = unirSMA(e.textos).registros.length;
    var n = despues - antes;
    if (n <= 0) { e.textos.pop(); return { agregados: 0 }; }
    registrar(e, quien, 'pegó notas del SMA', n + ' asignaturas nuevas');
    return { agregados: n };
  }

  var ETQ_CAMPO = { cod: 'código cursado', nombre: 'nombre cursado', codVig: 'código del pénsum vigente', nombreVig: 'nombre del pénsum vigente', cred: 'créditos' };
  /* El jefe puede cambiar códigos, nombres y créditos de cada materia (nunca las notas); un valor vacío devuelve el original. */
  function editarCursado(e, fila, campo, valor, quien, etiqueta) {
    var ed = e.ediciones[fila.id] || (e.ediciones[fila.id] = {});
    var actual = campo === 'cod' ? fila.cod : campo === 'nombre' ? fila.nombre : campo === 'codVig' ? fila.codVig : campo === 'nombreVig' ? fila.nombreVig : fila.cred;

  }

  function keyCod(k) { return String(k || '').split('|')[1] || ''; }
  function codigoTomado(e, reg, exceptoFila) {   // ¿esa materia ya fue elegida en otra fila u optativa?
    var c = normCode(reg.cod), tomado = false;
    Object.keys(e.vinculos).forEach(function (id) {
      if (id === exceptoFila) return;
      if (keyCod(e.vinculos[id]) === c) tomado = true;
    });
    e.optativas.forEach(function (o) { if (keyCod(o.reg) === c) tomado = true; });
    return tomado;
  }
  function aplicarEquivalencia(e, fila, reg, quien) {
    if (codigoTomado(e, reg, fila.id)) return false;
    e.vinculos[fila.id] = reg.key;
    registrar(e, quien, 'aplicó equivalencia a ' + fila.nombreVig,
      reg.cod + ' ' + reg.nombre + ' (' + reg.periodo + ') → ' + (fila.codVig || 'espacio de electiva'));
    return true;
  }
  function quitarEquivalencia(e, fila, quien) {

  }
  function agregarOptativa(e, bloque, reg, quien) {
    if (codigoTomado(e, reg, null)) return false;
    e.optativas.push({ bloque: bloque.id, reg: reg.key });
    registrar(e, quien, 'agregó optativa a ' + bloque.label, reg.cod + ' ' + reg.nombre);
    return true;
  }
  function quitarOptativa(e, regKey, quien, nombre) {

    registrar(e, quien, 'quitó una optativa', nombre || regKey);

  function editarOptativa(e, regKey, campo, valor, quien, antes) {

    if (!o) return false;
    valor = String(valor || '').trim();
    if (valor === String(antes || '')) return false;
    o[campo] = valor;
    registrar(e, quien, 'cambió el ' + (campo === 'cod' ? 'código' : 'nombre') + ' de una optativa', '“' + (antes || '—') + '” → “' + valor + '”');
    return true;
  }

  /* ───────── cruce con el pénsum ───────── */
  function aprobada(reg, minimo) { return reg.def >= minimo || reg.hab >= minimo; }
  function conNota(reg) { return reg.def > 0 || reg.hab > 0 || reg.final > 0; }

  function truncado(n) { return /\.\.\.|…/.test(String(n || '')); }
  function esMayusculas(n) { n = String(n || ''); return n === n.toUpperCase() && n !== n.toLowerCase(); }

  /* Índice de nombres completos del programa: pénsum, equivalencias (todas las columnas), optativas y electivas. */
  function indiceNombres(prog) {
    if (prog._indiceNombres) return prog._indiceNombres;
    var vistos = {}, lista = [];
    function add(cod, nombre) {
      nombre = String(nombre || '').trim();
      if (!nombre || truncado(nombre)) return;
      var k = normTexto(nombre) + '|' + normCode(cod);
      if (vistos[k]) return; vistos[k] = 1;
      lista.push({ cod: normCode(cod), nombre: nombre, tokens: normTexto(nombre).split(' ') });
    }
    Object.keys(prog.catalogo).forEach(function (k) { add(k, prog.catalogo[k].nombre); });
    Object.keys(prog.equivalencias).forEach(function (k) {
      var e = prog.equivalencias[k]; add(k, e.nombre);
      e.alts.forEach(function (a) { add(a.cod, a.nombre); });
    });
    prog._indiceNombres = lista;
    return lista;
  }
  /* “FUNDAMENTOS DE ...” o “PROCED. DISCIPL...” → el nombre completo si hay uno solo posible. */
  function completarTruncado(prog, cod, nombreSMA) {
    var base = String(nombreSMA || '').replace(/(\.\.\.|…).*$/, '');
    var pt = normTexto(base).split(' ').filter(Boolean);
    if (!pt.length) return null;
    var c = normCode(cod);
    var cand = indiceNombres(prog).filter(function (x) {
      if (x.tokens.length < pt.length) return false;
      for (var i = 0; i < pt.length; i++) if (x.tokens[i].indexOf(pt[i]) !== 0) return false;
      return true;
    });
    if (!cand.length) return null;
    var mismo = cand.filter(function (x) { return x.cod === c; });
    var pool = mismo.length ? mismo : cand;
    var nombres = {}; pool.forEach(function (x) { nombres[normTexto(x.nombre)] = x.nombre; });
    var ks = Object.keys(nombres);
    return ks.length === 1 ? nombres[ks[0]] : null;

  /* Nombre completo con el que sale en el balance: Excel del programa primero; el SMA solo si no hay otro. */
  function extraTilde(prog) {   // nombres del pénsum (ya con tildes): de ahí se aprenden más palabras
    if (prog._extraTilde) return prog._extraTilde;
    var l = [];
    Object.keys(prog.catalogo || {}).forEach(function (k) { l.push(prog.catalogo[k].nombre); });
    (prog.items || []).forEach(function (it) { l.push(it.nombre); l.push(it.label); });
    return (prog._extraTilde = l);

  function nombreCompleto(prog, cod, nombreSMA) {
    var c = prog.catalogo[normCode(cod)];

    if (truncado(nombreSMA)) return tildar(completarTruncado(prog, cod, nombreSMA) || nombreSMA, extraTilde(prog));
    return tildar(esMayusculas(nombreSMA) ? titulo(nombreSMA) : nombreSMA, extraTilde(prog));
  }

  function minimoAprobacion(prog, est) {
    var nivel = (est && est.nivel) || prog.nivel || 'pregrado';
    return /pos/i.test(nivel) ? 7 : 6;
  }

  /* prog: resultado de LectorExcel.parsePrograma · e: estado del balance */
  function calcular(prog, e) {
    var sma = unirSMA(e.textos);
    var registros = sma.registros;
    var minimo = minimoAprobacion(prog, e.estudiante);
    var porClave = {}, porCodigo = {};
    registros.forEach(function (r) {
      porClave[r.key] = r;
      var c = normCode(r.cod);
      (porCodigo[c] = porCodigo[c] || []).push(r);
    });
    function ultimo(lista) {  // la nota vale del último periodo cursado (repetición)
      var mejor = null;
      lista.forEach(function (r) {
        if (!mejor || compararPeriodo(r.periodo, mejor.periodo) > 0 || (r.periodo === mejor.periodo && r.item > mejor.item)) mejor = r;
      });
      return mejor;
    }

    var reservados = {};        // materias elegidas a mano (electivas/equivalencias/optativas): ninguna otra fila puede tomarlas
    Object.keys(e.vinculos).forEach(function (id) { var c = keyCod(e.vinculos[id]); if (c) reservados[c] = (reservados[c] || 0) + 1; });
    e.optativas.forEach(function (o) { var c = keyCod(o.reg); if (c) reservados[c] = (reservados[c] || 0) + 1; });
    var usados = {};            // códigos del SMA que ya sirvieron a una fila
    var regsUsados = {};
    var lineas = [], bloques = [], faltantes = [];
    var optPorBloque = {};
    e.optativas.forEach(function (o) { (optPorBloque[o.bloque] = optPorBloque[o.bloque] || []).push(o); });

    prog.items.forEach(function (it) {
      if (it.kind === 'mat' || it.kind === 'slot') {

    }
    var eqRows = filas(XLSX, wb, 'Equivalencia');
    for (var q = 1; q < eqRows.length; q++) {
      var er = eqRows[q];
      var v = nCod(er[0]);
      if (!v) continue;
      aCat(er[0], er[1], er[2]);
      var alts = [];
      [[4, 5], [7, 8]].forEach(function (p) {
        if (nCod(er[p[0]])) { alts.push({ cod: txt(er[p[0]]), nombre: fn(er[p[1]]) }); aCat(er[p[0]], er[p[1]]); }
      });
      var cur = eq[v] || (eq[v] = { nombre: fn(er[1]), alts: [] });
      alts.forEach(function (a) { if (!cur.alts.some(function (x) { return nCod(x.cod) === nCod(a.cod); })) cur.alts.push(a); });
    }
    ['Optativas', 'Electivas'].forEach(function (hoja) {
      filas(XLSX, wb, hoja).forEach(function (fr) {
        for (var j = 0; j < fr.length - 1; j++) {
          if (pareceCodigo(fr[j]) && txt(fr[j + 1]) && !pareceCodigo(fr[j + 1])) aCat(fr[j], fr[j + 1], fr[j + 2]);
        }
      });
    });
    // el pénsum vigente manda sobre cualquier otro nombre
    items.forEach(function (it) { if (it.kind === 'mat') { var k = nCod(it.cod); catalogo[k] = { cod: it.cod, nombre: it.nombre, cred: it.cred || (catalogo[k] && catalogo[k].cred) || 0 }; } });

    return {
      meta: meta, id: meta.id, nombre: meta.nombre, nivel: meta.nivel,
      encabezado: encabezado, items: items, equivalencias: eq, catalogo: catalogo,
      firmantes: { jefe: jefe || 'Jefe de Programa', decano: decano || 'Decano de Facultad' }
    };
  }

  /* Navegador: obtiene el Excel y lo lee con SheetJS.
     `proveedor(meta)` devuelve una promesa con un ArrayBuffer (Apps Script lo trae de Drive);
     sin proveedor se descarga de ../balances/ (misma carpeta que usa el portal). */
  var cache = {};
  function cargarPrograma(meta, base, proveedor) {
    if (cache[meta.id]) return Promise.resolve(cache[meta.id]);
    var obtener = proveedor ? proveedor(meta) : fetch((base || '../balances/') + encodeURIComponent(meta.archivo)).then(function (r) {
      if (!r.ok) throw new Error('No se pudo abrir ' + meta.archivo + ' (' + r.status + ').');
      return r.arrayBuffer();
    });
    return Promise.resolve(obtener).then(function (buf) {
      var wb = XLSX.read(buf, { type: 'array' });
      var p = parsePrograma(XLSX, wb, meta);
      cache[meta.id] = p;
      return p;
    });
  }

  return { parsePrograma: parsePrograma, cargarPrograma: cargarPrograma, pareceCodigo: pareceCodigo };
});

    var i = t.indexOf('(');
    if (i > 0) return [t.slice(0, i).trim(), t.slice(i)];

    gris(37.0, 83.9 + G + E1, 453.9, 84.6 + G + E1); gris(454.7, 83.9 + G + E1, 574.2, 84.6 + G + E1);

    // “Proceso: Educación” y “Código: …” con la etiqueta en negrilla

    etiquetaValor(h.codigo || 'Código: EDUCA-FT-009-JINEN', 267.2, 69.8, 6.1);

    lineas.forEach(function (l, i) {

    texto('TOTAL CRÉDITOS APROBADOS', 443.4, T + HB / 4 + 2.6, 6.1, true, 'right');

    texto('PROMEDIO PONDERADO ACUMULADO', 443.4, T + 3 * HB / 4 + 2.6, 6.1, true, 'right');
    texto(fmt(res.promedio), 514.85, T + 3 * HB / 4 + 2.8, 6.8, true, 'center');
    negro(37.0, TS + 47.9, 574.9, TS + 48.6);
    negro(36.2, TS + 19.7, 37.0, TS + 48.6); negro(574.2, TS + 19.7, 574.9, TS + 48.6);
    texto('OBSERVACIONES:', 47.3, TS + 27.1, 6.1, true);
    (function () {                             // texto libre del jefe: hasta 3 renglones alineados después de la etiqueta
      var obs = String(e.observaciones || '').replace(/\s+/g, ' ').trim();
      if (!obs) return;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(6.1);
      var x0 = 47.3 + doc.getTextWidth('OBSERVACIONES:') + 4, ancho = 570.5 - x0;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(6.1);
      var ls = doc.splitTextToSize(obs, ancho);
      if (ls.length > 3) { ls = ls.slice(0, 3); var u = ls[2]; while (u.length > 1 && doc.getTextWidth(u + '…') > ancho) u = u.slice(0, -1); ls[2] = u.replace(/\s+$/, '') + '…'; }
      ls.forEach(function (l, i) { texto(l, x0, TS + 27.1 + i * 7.4, 6.1, false); });
    })();

    /* firmas */
    var f = o.firmas || {};
    function bloqueFirma(rol, f1, cx, x0, x1) {
      if (f1 && f1.img) {
        if (!f1.oculta) {                       // “oculta”: la vista previa la dibuja el usuario encima, con el mouse
          var g = geometriaFirma(rol, f1.w, f1.h, f1.pos);
          try { doc.addImage(f1.img, f1.tipo || 'PNG', g.cx - g.w / 2, TS + g.top, g.w, g.h, undefined, 'FAST'); } catch (err) {}
        }
      }
      else if (!(f1 && f1.soloLinea)) {           // soloLinea: el Decano firma aparte, solo queda su línea y su cargo
        doc.setFont('helvetica', 'italic'); doc.setFontSize(7.6); doc.setTextColor(150, 150, 150);
        doc.text('Pendiente de firma', cx, TS + 87.8, { align: 'center' }); doc.setTextColor(0, 0, 0);
      }
      negro(x0, TS + 96.2, x1, TS + 96.9);
      texto(((f1 && f1.nombre) || '').toUpperCase(), cx, TS + 106.5, 7.6, true, 'center', x1 - x0 + 20);
      texto((f1 && f1.cargo) || '', cx, TS + 115.7, 7.6, false, 'center', x1 - x0 + 40);
      if (f1 && f1.img && f1.sello) {            // constancia de firma digital (solo el firmante que firma en el sistema)
        doc.setFont('helvetica', 'normal'); doc.setFontSize(6.1); doc.setTextColor(150, 150, 150);   // igual que “Pendiente de firma”
        doc.text('Balance generado y firmado digitalmente', cx, TS + 127.6, { align: 'center' });
        doc.text(f1.sello, cx, TS + 135.2, { align: 'center' });

      }
    }
    bloqueFirma('jefe', f.jefe, 181.6, 80.9, 282.3);
    bloqueFirma('decano', f.decano, 442.1, 349.6, 534.6);
    doc.balanceT = TS;                           // la pantalla lo necesita para ubicar la firma sobre la vista previa
    return doc;
  }

  /* Lugar de la firma: centro horizontal (cx), borde superior (top, desde el inicio del cuadro de firmas) y ancho (w), en puntos.
     Sin posición guardada va donde la plantilla la pone: abajo y centrada sobre la línea de firma. */
  var FIRMA_BASE = { jefe: { cx: 181.6, bw: 137.1 }, decano: { cx: 442.1, bw: 41.0 } }, FIRMA_ALTO = 40, FIRMA_ARRIBA = 65.8;   // la cola de la “g” baja hasta el nombre
  function geometriaFirma(rol, w0, h0, pos) {
    var b = FIRMA_BASE[rol], ratio = w0 && h0 ? h0 / w0 : null, w, h;
    if (ratio) { var k = Math.min(b.bw / w0, FIRMA_ALTO / h0); w = w0 * k; h = h0 * k; } else { w = b.bw; h = FIRMA_ALTO; ratio = h / w; }
    var g = { cx: b.cx, top: FIRMA_ARRIBA + (FIRMA_ALTO - h), w: w, h: h, ratio: ratio };
    if (pos && pos.w > 0) { g.cx = pos.cx; g.top = pos.top; g.w = pos.w; g.h = pos.w * ratio; }
    return g;
  }

  return { generar: generar, geometriaFirma: geometriaFirma };
});

<script>

  function avanzar(a, hecho, actual, linea) { a.hecho = hecho; a.actual = actual; if (linea) a.lineas.push(linea); render(); return new Promise(function (ok) { setTimeout(ok, 40); }); }

  /* ───── flujo ───── */
  /* Balance vencido: el estudiante terminó hace más de 3 años (el periodo 1 termina el 30 de junio; el 2, el 31 de diciembre). */
  function vigencia(periodo) {
    var m = /(\d{4})\D+([12])/.exec(periodo || '');
    if (!m) return { ok: true };
    var y = +m[1], fin = m[2] === '1' ? new Date(y, 5, 30) : new Date(y, 11, 31), lim = new Date(fin.getFullYear() + 3, fin.getMonth(), fin.getDate(), 23, 59, 59);
    return { ok: new Date() <= lim, periodo: y + '-' + m[2], vence: lim };
  }
  function bloqueos(est, res) {
    var b = [], r = est.requisitos || {};
    // un balance final vencido ya no impide firmar: la persona lo validó al crearlo y el certificado lo dice así
    // pago y requisitos solo se piden cuando el balance está vencido
    if (vigencia(res && res.periodoTerm).ok) return b;
    if (!r.pago) b.push('Falta confirmar que el estudiante pagó el balance previo.');
    if (!r.cumple) b.push('Falta confirmar que el estudiante cumplió los requisitos del pénsum para su graduación.');
    return b;
  }
  function recalcular() {
    S.res = M.calcular(S.prog, S.est);
    S.ver = M.verificarEstudiante(S.res.sma, S.est.estudiante);
    S.fs = M.estadoFirmas(S.est);
    var bl = bloqueos(S.est, S.res);
    S.est.info = { completo: !!(S.res.completo && S.ver.ok && !bl.length), pendientes: S.res.faltantes.length + (S.res.avisosNombre || 0) + bl.length };
  }
  function fase() { return S.fs ? S.fs.fase : 'borrador'; }
  function bloqueado() { return fase() !== 'borrador'; }
  function puedeEmitir() { return S.res && S.res.completo && S.ver && S.ver.ok && !bloqueos(S.est, S.res).length; }

  /* Lee el pénsum del programa y calcula el balance de cualquier estado (abierto o no). */
  function evaluar(est) {
    var meta = PR.porId(est.programaId);
    if (!meta) return Promise.reject(new Error('El programa de este balance ya no tiene plantilla.'));
    return LE.cargarPrograma(meta, null, GAS ? Backend.excel : null).then(function (prog) {
      var res = M.calcular(prog, est), ver = M.verificarEstudiante(res.sma, est.estudiante), fs = M.estadoFirmas(est);
      var bl = bloqueos(est, res);
      est.info = { completo: !!(res.completo && ver.ok && !bl.length), pendientes: res.faltantes.length + (res.avisosNombre || 0) + bl.length };
      return { est: est, prog: prog, res: res, ver: ver, fs: fs, ok: !!(res.completo && ver.ok && !bl.length) };
    });
  }

  function razonIncompleto(est, x) {   // por qué no está listo: se dice en el aviso, para no tener que adivinar
    var bl = bloqueos(est, x.res);
    if (!x.res.completo) {
      var nom = x.res.faltantes.slice(0, 3).map(function (f) { return f.nombreVig; }).join(', ');
      return 'faltan ' + x.res.faltantes.length + ' (' + nom + (x.res.faltantes.length > 3 ? '…' : '') + ')';
    }
    if (!x.ver.ok) return (x.ver.errores && x.ver.errores[0]) || 'los datos del estudiante no coinciden con el SMA';
    return bl.length ? bl[0].replace(/\.$/, '') : 'incompleto';
  }

  function abrir(estado, irA) {
    var meta = PR.porId(estado.programaId);
    if (!meta) { aviso('Programa no disponible', 'El programa de este balance ya no tiene plantilla.'); return Promise.resolve(); }
    S.cargando = true; render();
    return LE.cargarPrograma(meta, null, GAS ? Backend.excel : null).then(function (prog) {
      S.prog = prog; S.est = estado; S.cargando = false;
      if (estado.firmas && estado.firmas.jefe) S.firmaForm.jefe = { grado: estado.firmas.jefe.grado, nombre: estado.firmas.jefe.nombre, cargo: estado.firmas.jefe.cargo };
      recalcular(); S.vista = irA || 'revision'; S.msg = null; render();
    }).catch(function (err) { S.cargando = false; S.formErr = [String(err.message || err)]; S.vista = 'inicio'; render(); });
  }

  /* Del SMA salen el programa, la cédula, los apellidos, los nombres y las notas. Se pueden pegar varios estudiantes seguidos. */
  function crear() {
    var texto = S.form.notas;
    if (!S.form.programaId || !PR.porId(S.form.programaId)) { S.formErr = ['Elija el programa del que se gradúa el estudiante.']; S.formAv = null; render(); return; }
    if (!texto.trim()) { S.formErr = ['Pegue el historial del SMA.']; S.formAv = null; render(); return; }
    var meta = PR.porId(S.form.programaId);                   // el programa lo elige el jefe: hay estudiantes homologados y el SMA no sirve para saberlo
    var bloques = M.separarHistorias(texto), nuevos = [], errores = [];
    bloques.forEach(function (b, i) {
      var d = M.estudianteDeSMA(b);
      var etq = 'Historial ' + (i + 1) + (d.apellidos || d.nombres ? ' (' + M.titulo((d.nombres + ' ' + d.apellidos).trim()) + ')' : '');
      if (!d.documento || !(d.nombres || d.apellidos)) { errores.push(etq + ': no se encontró el encabezado del estudiante (Código, N° Ident., Apellidos y Nombre). Copie el historial completo desde el SMA.'); return; }
      var est = M.nuevoEstado(meta.id, { nombres: d.nombres, apellidos: d.apellidos, tipoDoc: 'CC', documento: d.documento, nivel: meta.nivel }, quien());
      var dup = nuevos.filter(function (x) { return claveEstado(x) === claveEstado(est); })[0];
      var r = M.agregarNotas(dup || est, b, quien());
      if (!r.agregados && !dup) { errores.push(etq + ': no se encontraron asignaturas con nota.'); return; }
      if (!dup) nuevos.push(est);
    });
    if (!nuevos.length) { S.formErr = errores.length ? errores : ['No se encontró ningún historial en lo pegado.']; S.formAv = null; render(); return; }
    var existentes = nuevos.filter(function (e) { return S.guardados.some(function (g) { return g.key === claveEstado(e); }); });
    var seguir = existentes.length
      ? pregunta('Ya existen balances', 'Ya hay balances guardados de: ' + existentes.map(function (e) { return M.titulo(e.estudiante.nombres + ' ' + e.estudiante.apellidos); }).join(', ') + '.\n¿Reemplazarlos con los nuevos? Se pierde el registro de cambios de los anteriores.', 'Reemplazar')
      : Promise.resolve(true);
    seguir.then(function (si) {
      if (!si) return;
      S.formErr = null; S.formAv = null; S.creando = true;
      var vencidos = [];
      var av = S.avance = { titulo: nuevos.length === 1 ? 'Creando balance' : 'Creando balances', hecho: 0, total: nuevos.length, actual: '', lineas: [], fin: false };
      return avanzar(av, 0, 'Leyendo el pénsum…').then(function () {
        return nuevos.reduce(function (p, est, n) {
          var nom = M.titulo(est.estudiante.nombres + ' ' + est.estudiante.apellidos);
          return p.then(function () { return avanzar(av, n, nom); }).then(function () { return evaluar(est); })
            .then(function (x) { var v = vigencia(x.res.periodoTerm); if (!v.ok) vencidos.push({ est: est, nom: nom, periodo: v.periodo }); })
            .then(function () { return Backend.guardar(est); })
            .then(function () { return avanzar(av, n + 1, '', { ok: true, t: nom + ': balance creado' }); });
        }, Promise.resolve());
      }).then(refrescarGuardados).then(function () {
        S.creando = false;
        if (!vencidos.length) return;
        S.avance = null; render();                // balance final vencido: la persona debe validarlo antes de seguir
        var hayMae = vencidos.some(function (v) { return /^mae-/.test(v.est.programaId); });
        return pregunta('Balance final vencido',
          vencidos.map(function (v) { return v.nom + ': último periodo cursado ' + v.periodo + ' (hace más de 3 años).'; }).join('\n') +
          '\n\nEl balance final está vencido. El estudiante debe cumplir con todas las materias del pénsum inicial' + (hayMae ? ', incluyendo un nuevo trabajo de grado' : '') + '.\nValide esta información antes de continuar.',
          'Validado, continuar', 'Eliminar estos balances', true).then(function (ok) {
            if (ok) return;
            return Promise.all(vencidos.map(function (v) { return Backend.borrar(claveEstado(v.est)); })).then(refrescarGuardados).then(function () {
              nuevos = nuevos.filter(function (e) { return !vencidos.some(function (v) { return v.est === e; }); });
              errores.push('Se eliminaron los balances vencidos: ' + vencidos.map(function (v) { return v.nom; }).join(', ') + '.');
            });
          });
      }).then(function () {
        if (!nuevos.length) { S.avance = null; S.formAv = errores; render(); return; }
        if (nuevos.length === 1 && !errores.length) { S.form.notas = ''; return abrir(nuevos[0], 'revision').then(function () { S.avance = null; render(); }); }
        S.avance = null;
        S.sel = {}; nuevos.forEach(function (e) { S.sel[claveEstado(e)] = true; });
        S.form.notas = ''; S.formAv = errores.length ? ['No se crearon:'].concat(errores) : null;
        S.grupo.msg = null;
        render();
      });
    }).catch(function (err) { S.creando = false; S.avance = null; S.formErr = ['No se pudieron crear los balances: ' + err.message]; render(); });
  }

  /* Guarda el balance abierto y vuelve al visor para cargar otro; queda seleccionado en la lista. */
  /* Atrás siempre vuelve al cuadro donde se pegan las notas; el balance abierto queda guardado tal como estaba. */
  function atras() {
    if (!S.est) return;

    Promise.resolve(guardar()).then(refrescarGuardados).then(function () {
      S.guardandoBal = false;
      S.est = null; S.prog = null; S.res = null; S.fs = null; S.ver = null; S.msg = null; S.formErr = null; S.formAv = null; S.filtro = 'todas';

  }
  /* Vuelve al principio con el formulario vacío; el balance abierto queda guardado tal como estaba. */
  function reiniciar() {

      if (!si) return;
      Promise.resolve(hay ? guardar() : null).then(refrescarGuardados).then(function () {
        S.est = null; S.prog = null; S.res = null; S.fs = null; S.ver = null; S.msg = null; S.formErr = null; S.formAv = null; S.filtro = 'todas';
        S.form.notas = ''; S.sel = {}; S.grupo.msg = null; S.editDecano = false; S.vista = 'inicio'; render();
      });
    });
  }
  function guardarVolver() {
    if (!S.est) return;
    var k = claveEstado(S.est), nom = M.titulo(S.est.estudiante.nombres + ' ' + S.est.estudiante.apellidos);
    S.guardandoBal = true; render();
    Promise.resolve(guardar()).then(refrescarGuardados).then(function () {
      S.guardandoBal = false;
      S.sel[k] = true; S.est = null; S.prog = null; S.res = null; S.fs = null; S.ver = null; S.msg = null; S.formErr = null; S.formAv = null;
      S.grupo.msg = null;
      S.vista = 'inicio'; render();
    }).catch(function (err) { S.guardandoBal = false; S.msg = { t: 'bad', x: 'No se pudo guardar: ' + err.message }; render(); });
  }
  function seleccionarTodos() { S.sel = {}; S.guardados.forEach(function (g) { S.sel[g.key] = true; }); }
  function firmarTodos() { if (!S.guardados.length) return; seleccionarTodos(); firmarGrupo(); }
  function aplicarCambio(fn) {
    if (bloqueado()) return;
    fn(); recalcular(); guardar(); render();
  }

  /* ───── firma digital (solo el Jefe de Programa) ───── */
  /* El firmante es siempre el mismo; el Decano se puede editar (se recuerda en este navegador). */
  var FIRMANTE = { grado: 'DO', nombre: 'OLGA LISSET MACÍAS MORALES', cargo: 'Jefe de Programa' };
  var DECANO_BASE = 'CN MARÍA PAOLA PIZANO CORSO';
  function cargarFormFirma() { try { var x = localStorage.getItem('balance.decano'); if (x && x.trim()) S.decano = x.trim(); } catch (e) {} }
  function guardarFormFirma() {}
  function datosFirmante() { return { grado: FIRMANTE.grado, nombre: FIRMANTE.nombre, cargo: FIRMANTE.cargo }; }
  function decanoNombre() { return S.decano || DECANO_BASE; }
  function bloqueFirmantes(firmado) {
    var d = datosFirmante(), cargoDec = S.prog ? S.prog.firmantes.decano : 'Decano de Facultad';
    function col(rol, nombre, cargo, extra) {

    }

      : col('Decano de Facultad', h(decanoNombre()), h(cargoDec), '<span><button class="btn sm" data-act="dec-editar" style="margin-top:4px">Editar</button></span>');

  }
  function firmaLista() { return !!S.imgs.jefe; }
  function sellar(est, fs) {   // pone la firma del Jefe en un estado
    var d = datosFirmante();
    est.firmas.jefe = { grado: d.grado.trim(), nombre: d.nombre.trim(), cargo: d.cargo.trim(), fecha: new Date().toISOString(), huella: fs.huella };

  }
  function reabrir() {
    pregunta('Reabrir el balance', 'Reabrir borra la firma; tendrá que firmar de nuevo. ¿Continuar?', 'Reabrir').then(function (si) {
      if (!si) return;
      S.est.firmas = { jefe: null };
      M.registrar(S.est, quien(), 'reabrió el balance', 'la firma se anuló');

  function cargarFirma(file) {
    if (!file) return;

    fr.onload = function () {
      if (!/^data:image\/(png|jpeg|jpg)/i.test(fr.result)) { S.msg = { t: 'bad', x: 'La firma debe ser una imagen PNG o JPG.' }; S.grupo.msg = S.msg; render(); return; }
      S.imgs.jefe = fr.result; S.msg = null; S.grupo.msg = null;
      var im = new Image(); im.onload = function () { S.dims.jefe = { w: im.naturalWidth, h: im.naturalHeight }; render(); }; im.onerror = function () { render(); }; im.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  /* La firma se puede mover y cambiar de tamaño mientras el balance no esté firmado. */
  function firmaEditable() { return false; }     // la firma va siempre en su sitio, sobre la línea del Jefe de Programa
  function posJefe(est) { return null; }
  function selloFirma(iso) {                      // 08/10/2026 05:55 p. m. (hora de Colombia)
    var d = new Date(iso); if (isNaN(d)) return null;
    var p = new Intl.DateTimeFormat('es-CO', { timeZone: 'America/Bogota', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }).format(d);
    return p.replace(/\s+/g, ' ').replace(/([ap])\.?\s?m\.?/i, function (m, x) { return x.toLowerCase() + '. m.'; }).replace(',', '');
  }
  function pdfDe(est, prog, res, fs, vista) {
    var f = est.firmas.jefe, firmado = !!(f && fs.jefe), d = datosFirmante(), usar = firmado ? f : d, img = S.imgs.jefe, dm = S.dims.jefe || {};
    var firmas = {
      jefe: { img: firmado ? img : null, w: dm.w, h: dm.h, tipo: img && /image\/jpe?g/i.test(img) ? 'JPEG' : 'PNG',
              nombre: ((usar.grado ? usar.grado + ' ' : '') + (usar.nombre || '')).trim(), cargo: usar.cargo || prog.firmantes.jefe, pos: posJefe(est), sello: firmado ? selloFirma(f.fecha) : null },
      decano: { nombre: decanoNombre(), cargo: prog.firmantes.decano, soloLinea: true }       // el Decano firma aparte: solo queda su línea

  /* vista previa con pdf.js (funciona también dentro del recuadro protegido de Apps Script) */
  var pdfjsListo = null;
  function prepararPdfjs() {
    if (pdfjsListo) return pdfjsListo;
    pdfjsListo = new Promise(function (ok, no) {
      if (!window.pdfjsLib) return no(new Error('pdf.js no cargó'));
      var v = pdfjsLib.version, url = GAS ? 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + v + '/pdf.worker.min.js' : 'vendor/pdf.worker.min.js';
      fetch(url).then(function (r) { return r.text(); }).then(function (t) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: 'text/javascript' })); ok();
      }).catch(no);
    });
    return pdfjsListo;
  }
  var tokenPrevia = 0;
  /* ───── firma movible sobre la vista previa ───── */
  function montarFirmaMovible(pw, k, T, PW, PH) {
    var rol = 'jefe', dim = S.dims[rol] || {};
    var g = PDF.geometriaFirma(rol, dim.w, dim.h, posJefe(S.est));
    var cx = g.cx, top = g.top, w = g.w;                                  // top es relativo al cuadro de firmas (T)
    var el = document.createElement('div'); el.className = 'sigdrag'; el.tabIndex = 0;
    el.title = 'Arrastre para mover · esquinas para cambiar el tamaño · flechas para ajustar';
    el.innerHTML = '<img alt="Firma" draggable="false" src="' + S.imgs[rol] + '">' + ['nw', 'ne', 'sw', 'se'].map(function (c) { return '<i class="hd ' + c + '" data-h="' + c + '"></i>'; }).join('');
    pw.appendChild(el);
    function alto() { return w * g.ratio; }
    function limitar() {
      w = Math.max(18, Math.min(w, PW)); var h = alto();
      cx = Math.max(w / 2, Math.min(cx, PW - w / 2));
      top = Math.max(-T, Math.min(top, PH - T - h));
    }
    function pintar() {
      limitar(); el.style.left = ((cx - w / 2) * k) + 'px'; el.style.top = ((T + top) * k) + 'px'; el.style.width = (w * k) + 'px'; el.style.height = (alto() * k) + 'px';
    }
    function guardarPos() {
      S.est.firmasPos = S.est.firmasPos || {}; S.est.firmasPos[rol] = { cx: +cx.toFixed(2), top: +top.toFixed(2), w: +w.toFixed(2) };
      S.posPref = S.est.firmasPos[rol];            // la última posición se usa en los demás balances
      guardar();
    }
    var drag = null;
    el.addEventListener('pointerdown', function (ev) {
      if (ev.button !== undefined && ev.button !== 0) return;
      ev.preventDefault(); el.focus(); el.setPointerCapture(ev.pointerId);
      var h = ev.target.getAttribute && ev.target.getAttribute('data-h'), r = pw.getBoundingClientRect(), hh = alto();
      drag = { h: h, x: ev.clientX, y: ev.clientY, cx: cx, top: top, w: w, r: r,
               ax: (h === 'nw' || h === 'sw') ? cx + w / 2 : cx - w / 2,            // esquina contraria: queda fija al cambiar el tamaño
               ay: (h === 'nw' || h === 'ne') ? top + hh : top };
    });
    el.addEventListener('pointermove', function (ev) {
      if (!drag) return;
      if (!drag.h) { cx = drag.cx + (ev.clientX - drag.x) / k; top = drag.top + (ev.clientY - drag.y) / k; pintar(); return; }
      var px = (ev.clientX - drag.r.left) / k, nw = drag.h === 'nw' || drag.h === 'sw' ? drag.ax - px : px - drag.ax;
      w = Math.max(18, nw); var hh = alto();
      cx = (drag.h === 'nw' || drag.h === 'sw') ? drag.ax - w / 2 : drag.ax + w / 2;
      top = (drag.h === 'nw' || drag.h === 'ne') ? drag.ay - hh : drag.ay;
      pintar();
    });
    function soltar() { if (!drag) return; drag = null; limitar(); pintar(); guardarPos(); }
    el.addEventListener('pointerup', soltar); el.addEventListener('pointercancel', soltar);
    el.addEventListener('keydown', function (ev) {
      var d = ev.shiftKey ? 5 : 1, m = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, -d], ArrowDown: [0, d] }[ev.key];
      if (!m) return; ev.preventDefault(); cx += m[0]; top += m[1]; pintar(); guardarPos();
    });
    pintar();
  }

  function pintarPrevia() {
    var cont = $('#prev'); if (!cont) return;
    if (!S.res.completo) {
      var motivo = S.res.avisosNombre ? 'Hay nombres con puntos suspensivos por completar.' : 'Faltan asignaturas por completar.';
      cont.innerHTML = '<div class="card vacío" style="height:100%;display:flex;align-items:center;justify-content:center">La vista previa del PDF aparece cuando el balance está completo.<br>' + motivo + '</div>'; return;
    }
    var mio = ++tokenPrevia;
    cont.innerHTML = '<div class="card vacío" style="height:100%;display:flex;align-items:center;justify-content:center">Armando vista previa…</div>';
    function armar() { try {
      var docPrev = construirPDF(true), buf = docPrev.output('arraybuffer');
      return prepararPdfjs().then(function () { return pdfjsLib.getDocument({ data: buf }).promise; }).then(function (pdf) { return pdf.getPage(1); }).then(function (page) {
        if (mio !== tokenPrevia || !$('#prev')) return;
        var ancho = Math.max(300, Math.min(900, $('#prev').clientWidth - 24)), vp0 = page.getViewport({ scale: 1 });
        var esc = ancho / vp0.width * (window.devicePixelRatio || 1), vp = page.getViewport({ scale: esc });
        var cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; cv.style.width = ancho + 'px'; cv.style.height = (ancho * vp0.height / vp0.width) + 'px';
        cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', 'Vista previa del Balance Académico');
        return page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise.then(function () {
          var c = $('#prev'); if (!c || mio !== tokenPrevia) return;
          c.innerHTML = '<div class="prevbox"><div class="pgwrap"></div></div>'; var pw = c.firstChild.firstChild; pw.style.width = ancho + 'px'; pw.appendChild(cv);
          if (firmaEditable()) montarFirmaMovible(pw, ancho / vp0.width, docPrev.balanceT, vp0.width, vp0.height);
        });
      }).catch(function (err) { var c = $('#prev'); if (c) c.innerHTML = '<div class="alert warn">No se pudo mostrar la vista previa (' + h(err.message) + '). Puede descargar el PDF igualmente.</div>'; });
    } catch (err) { cont.innerHTML = '<div class="alert bad">No se pudo armar el PDF: ' + h(err.message) + '</div>'; return Promise.resolve(); } }
    ocupar('Generando documento', new Promise(function (ok) { setTimeout(function () { armar().then(ok, ok); }, 60); }));
  }

  /* ───── modal de selección de asignatura del SMA ───── */

    return '<div class="modal" data-act="cerrar-modal"><div class="box" role="dialog" aria-modal="true"><div class="hd"><div><b>' + h(tit) + '</b><div style="color:var(--mute);font-size:12px">' + h(sub) + '</div></div><button class="btn sm" data-act="cerrar-modal" style="margin-left:auto">Cerrar</button></div>' +

      }).join('') : '<div class="vacío">No hay asignaturas del SMA disponibles' + (q ? ' con esa búsqueda' : '') + '.</div>') + '</div></div></div>';

  /* ───── eventos ───── */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-vista],[data-act],[data-filtro]');
    if (!t) return;
    if (t.hasAttribute('data-vista')) { if (!t.disabled) { S.vista = t.getAttribute('data-vista'); S.msg = null; render(); } return; }
    if (t.hasAttribute('data-filtro')) { S.filtro = t.getAttribute('data-filtro'); render(); return; }
    var act = t.getAttribute('data-act');
    if (act === 'cerrar-modal') { if (ev.target === t || t.tagName === 'BUTTON') { S.modal = null; render(); } return; }
    if (act === 'crear') crear();
    else if (act === 'guardar-volver') { if (puedeEmitir()) guardarVolver(); }
    else if (act === 'atras') atras();
    else if (act === 'reiniciar') reiniciar();
    else if (act === 'firmar-todos') firmarTodos();
    else if (act === 'abrir-g') {
      var g = S.guardados[+t.getAttribute('data-i')]; if (!g) return;
      S.cargando = true; render();
      Backend.cargar(g.key).then(function (e) {
        return abrir(e, t.getAttribute('data-vista-a') || 'firma');   // Abrir muestra el PDF; Editar, la revisión
      }).catch(function (err) { S.cargando = false; S.formErr = ['No se pudo abrir el balance: ' + err.message]; render(); });
    }
    else if (act === 'borrar-g') {
      var g2 = S.guardados[+t.getAttribute('data-i')]; if (!g2) return;
      pregunta('Eliminar balance', 'Se eliminará el balance de ' + M.titulo(g2.estudiante.nombres + ' ' + g2.estudiante.apellidos) + '. No se puede deshacer.', 'Eliminar').then(function (si) {
        if (!si) return;
        S.borrando = S.borrando || {}; S.borrando[g2.key] = true; delete S.sel[g2.key]; render();
        Backend.borrar(g2.key).then(refrescarGuardados).then(function () { delete S.borrando[g2.key]; render(); })
          .catch(function (err) { delete S.borrando[g2.key]; render(); aviso('No se pudo eliminar', err.message); });
      });
    }
    else if (act === 'dialogo-si' || act === 'dialogo-no') {
      if (act === 'dialogo-no' && ev.target !== t) return;
      var d = S.dialogo; S.dialogo = null; render(); if (d) d.res(act === 'dialogo-si');

      S.modal = null;
      if (reg) aplicarCambio(function () { if (m.tipo === 'optativa') M.agregarOptativa(S.est, m.bloque, reg, quien()); else M.aplicarEquivalencia(S.est, m.fila, reg, quien()); });
    }
    else if (act === 'quitar-eq') { var f2 = S.res.lineas.filter(function (l) { return l.id === t.getAttribute('data-id'); })[0]; aplicarCambio(function () { M.quitarEquivalencia(S.est, f2, quien()); }); }
    else if (act === 'quitar-opt') { var k = t.getAttribute('data-id'), lo = S.res.lineas.filter(function (l) { return l.regKey === k; })[0]; aplicarCambio(function () { M.quitarOptativa(S.est, k, quien(), lo ? lo.cod + ' ' + lo.nombre : ''); }); }
    else if (act === 'mas-notas') {
      var ta = $('#mas-notas'); if (!ta || !ta.value.trim()) return;
      aplicarCambio(function () {
        var prev = M.unirSMA(S.est.textos);
        var r = M.agregarNotas(S.est, ta.value, quien());
        var ver = M.verificarEstudiante(M.unirSMA(S.est.textos), S.est.estudiante);
        if (!ver.ok) { S.est.textos.pop(); S.est.bitacora.pop(); S.msg = null; aviso('No se agregaron las notas', ver.errores.join('\n')); return; }
        if (!r.agregados) aviso('Sin cambios', 'Esas notas ya estaban en el balance o no se reconocieron.');
      });
    }
    else if (act === 'firmar') firmar();
    else if (act === 'avance-cerrar') { S.avance = null; render(); }
    else if (act === 'firmar-grupo') firmarGrupo();
    else if (act === 'descargar-grupo') descargarGrupo();
    else if (act === 'certificado') descargarCertificado();
    else if (act === 'pdf') descargarPDF();
    else if (act === 'dec-editar') { S.editDecano = true; render(); var i = $('#dec-nombre'); if (i) { i.focus(); i.select(); } }
    else if (act === 'dec-cancelar') { S.editDecano = false; render(); }
    else if (act === 'dec-guardar') {
      var v = ($('#dec-nombre').value || '').replace(/\s+/g, ' ').trim();
      S.decano = v || DECANO_BASE; S.editDecano = false;
      S.guardandoBal = false; render();
      Backend.guardarDecano(S.decano).catch(function (err) { S.msg = { t: 'bad', x: 'No se pudo guardar el nombre del Decano: ' + err.message }; render(); });
    }
    else if (act === 'firma-reset') { if (S.est.firmasPos) delete S.est.firmasPos.jefe; S.posPref = null; guardar(); render(); }
    else if (act === 'reabrir') reabrir();
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'sel-todos') { S.sel = {}; if (t.checked) S.guardados.forEach(function (g) { S.sel[g.key] = true; }); render(); return; }
    if (t.hasAttribute && t.hasAttribute('data-sel')) { var kk = t.getAttribute('data-sel'); if (t.checked) S.sel[kk] = true; else delete S.sel[kk]; render(); return; }
    if (t.id && t.id.indexOf('f-') === 0) {
      var k = t.id.slice(2); S.form[k] = t.value;
      if (k === 'programaId') { var p = PR.porId(t.value); if (p) S.form.nivel = p.nivel; render(); }
      return;
    }
    if (t.hasAttribute && t.hasAttribute('data-req')) { var rq = t.getAttribute('data-req'), vv = t.checked; aplicarCambio(function () { M.editarRequisito(S.est, rq, vv, quien()); }); return; }
    if (t.id === 'obs') { aplicarCambio(function () { M.editarObservaciones(S.est, t.value, quien()); }); return; }
    if (t.hasAttribute && t.hasAttribute('data-edit')) {
      var campo = t.getAttribute('data-edit'), id = t.getAttribute('data-id'), esOpt = t.getAttribute('data-opt') === '1';
      var l = S.res.lineas.filter(function (x) { return (esOpt ? x.regKey : x.id) === id; })[0];
      if (!l) return;
      aplicarCambio(function () {
        if (esOpt) M.editarOptativa(S.est, id, campo, t.value, quien(), campo === 'cod' ? l.cod : l.nombre);
        else M.editarCursado(S.est, l, campo, t.value, quien());
      });
    }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'modal-q') { S.modal.q = t.value; var pos = t.selectionStart; render(); var q = $('#modal-q'); q.focus(); q.setSelectionRange(pos, pos); }
    if (t.id === 'f-notas') S.form.notas = t.value;
    if (t.id === 'obs') { var n = $('#obs-n'); if (n) n.textContent = t.value.length; }
    if (t.id && t.id.indexOf('f-') === 0 && t.id !== 'f-notas' && t.tagName === 'INPUT') S.form[t.id.slice(2)] = t.value;
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.modal) { S.modal = null; render(); } });

  /* ───── arranque ───── */
  function precargar() { return Backend.decano().then(function (x) { if (x && String(x).trim()) S.decano = String(x).trim(); }).catch(function () { cargarFormFirma(); }); }
  render();
  Promise.all([leerSesion(), refrescarGuardados(), cargarAssets()]).then(function () {
    precargar().then(function () { S.arranque = false; render(); });
  }).catch(function (err) { S.arranque = false; S.errorArranque = err.message; render(); });
  window.BalanceApp = { estado: S }; // útil para pruebas
})();
</script>
</body>
</html>
