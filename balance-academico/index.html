<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance Académico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--navy:#12294A;--navy2:#1F3D6B;--gold:#B8892B;--bg:#F3F5F9;--line:#D4DBE7;--line2:#E5E9F1;--ink:#16233A;--mute:#4A5A78;
  --ok-bg:#DFF2E7;--ok:#115C37;--warn-bg:#FFEFCF;--warn:#6E4300;--bad-bg:#FADFDC;--bad:#8E1A12;--mute-bg:#E5E9F1;--mute2:#33425C}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Aptos Display','Aptos','Segoe UI Variable Text','Segoe UI','Libre Franklin',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 24px;height:52px;border-bottom:3px solid var(--gold);flex-shrink:0}
.top b{font-size:16px}.top .sep{opacity:.5}
.top .quien{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.top select{background:var(--navy2);color:#fff;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.top .prueba{font-size:11px;opacity:.7}
.tabs{display:flex;gap:4px;padding:10px 24px 0;border-bottom:1px solid var(--line);background:#fff;flex-shrink:0;align-items:flex-end}
.tab{border:0;background:none;padding:9px 16px;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tab[aria-selected=true]{color:var(--navy);border-bottom-color:var(--gold)}
.tab:disabled{opacity:.45;cursor:not-allowed}
.tab .n{width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.tabs .cred{margin-left:auto;align-self:center;padding:0 0 6px 18px;font-size:12px;color:var(--mute);white-space:nowrap;font-weight:500}
.tabs .est + .cred{margin-left:0}
.tabs .est{margin-left:auto;padding-bottom:8px;display:flex;gap:8px;align-items:center;font-weight:600}
main{flex:1;min-height:0;padding:16px 24px;overflow:hidden}
.card{background:#fff;border:1px solid var(--line);border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.mute{background:var(--mute-bg);color:var(--mute2)}
.btn{font-weight:600;border-radius:8px;padding:7px 14px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.btn:hover:not(:disabled){background:#EEF2F9}
.btn.pri{background:var(--navy);color:#fff}.btn.pri:hover:not(:disabled){background:var(--navy2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1400}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
label.f{min-width:0;display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
label.f input,label.f select,label.f textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;font-weight:400;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
label.f input:focus,label.f select:focus,label.f textarea:focus,.cell:focus{outline:2px solid var(--gold);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.alert{border-radius:8px;padding:9px 12px;font-size:13px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.ok{background:var(--ok-bg);color:var(--ok)}.alert.mute{background:var(--mute-bg);color:var(--mute2)}

/* inicio */
.inicio{height:100%;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
.inicio .col{display:flex;flex-direction:column;gap:12px;min-height:0}
.inicio textarea{flex:1;min-height:120px;resize:none;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.guardados{overflow:auto;display:flex;flex-direction:column}
.gd{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2)}
.gd:last-child{border-bottom:0}
.gd .t{flex:1;min-width:0}.gd .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gd .t span{color:var(--mute);font-size:12px}

/* revisión */
.rev{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
.tablewrap{display:flex;flex-direction:column;min-height:0}
.tbar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.tbar .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.tbar .seg button{border:0;background:#fff;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--mute)}
.tbar .seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.scroll{overflow:auto;flex:1;min-height:0}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:#F7F9FC;text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:7px 8px;border-bottom:1px solid var(--line);z-index:1;white-space:nowrap}
td{padding:3px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.area td{background:#FBF6EA;color:#6B4E10;font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;border-left:3px solid var(--gold);padding:5px 8px}
tr.area td .chip{margin-left:8px;text-transform:none;letter-spacing:0}
tr.falta td{background:#FFFBF1}
tr.perdida td{background:#FEF3F1}
.cell{width:100%;border:1px solid transparent;border-radius:6px;padding:3px 6px;background:transparent}
.cell:hover:not(:disabled){border-color:var(--line);background:#fff}
.cell:disabled{color:var(--ink)}
.cell.edit{background:#FFF8E8}
.cell.falta-nombre{border-color:var(--bad);background:#FEF3F1}
table{font-size:13px}
td:nth-child(2){min-width:190px}td:nth-child(4){min-width:250px}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.kpi b{display:block;font-size:22px;color:var(--navy);line-height:1.15}.kpi span{font-size:12px;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden;margin:0 14px 14px}.bar i{display:block;height:100%;background:var(--gold)}
.log{max-height:230px;overflow:auto;font-size:12px}
.log div{padding:6px 14px;border-bottom:1px solid var(--line2)}
.log time{color:var(--mute);display:block;font-size:11px}

/* firma */
.firma{height:100%;display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px}
.firma .panel{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0;padding-right:2px}
.prevbox{height:100%;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#E9EDF4;padding:12px;display:flex;justify-content:center;align-items:flex-start}
.prevbox canvas{box-shadow:0 2px 12px rgba(18,41,74,.25);background:#fff;display:block}
.pgwrap{position:relative;flex:none}
 #f-notas{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:ui-monospace,Consolas,monospace;font-size:12px;resize:none;width:100%;background:#fff}
.chk{width:17px;height:17px;accent-color:var(--navy);cursor:pointer;flex:none}
.grupo{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:#FAFBFD}
.sigmini{border:1px dashed var(--line);border-radius:8px;height:56px;display:flex;align-items:center;justify-content:center;color:var(--mute);background:#fff;overflow:hidden;font-size:12px}
.sigmini img{max-height:52px;max-width:100%}
.sigdrag{position:absolute;cursor:move;outline:1.5px dashed var(--gold);outline-offset:0;touch-action:none;background:rgba(184,137,43,.07);user-select:none}
.sigdrag:focus-visible{outline:2px solid var(--navy)}
.sigdrag img{width:100%;height:100%;display:block;pointer-events:none}
.sigdrag .hd{position:absolute;width:11px;height:11px;background:#fff;border:2px solid var(--gold);border-radius:2px}
.sigdrag .nw{left:-6px;top:-6px;cursor:nwse-resize}.sigdrag .se{right:-6px;bottom:-6px;cursor:nwse-resize}
.sigdrag .ne{right:-6px;top:-6px;cursor:nesw-resize}.sigdrag .sw{left:-6px;bottom:-6px;cursor:nesw-resize}
.sigprev{border:1px dashed var(--line);border-radius:8px;height:70px;display:flex;align-items:center;justify-content:center;color:var(--mute);background:#fff;overflow:hidden}
.sigprev img{max-height:66px;max-width:100%}
.steps{display:flex;flex-direction:column;gap:8px}
.steps .s{display:flex;gap:10px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--mute2);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dot.ok{background:var(--ok);color:#fff}

/* modal */
.modal{position:fixed;inset:0;background:rgba(18,41,74,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:#fff;border-radius:12px;width:min(760px,94vw);max-height:84vh;display:flex;flex-direction:column;border-top:4px solid var(--gold)}
.modal .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal .bd{overflow:auto}
.modal input.q{margin:10px 18px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:calc(100% - 36px)}
.pick{display:flex;gap:10px;align-items:center;padding:7px 18px;border-top:1px solid var(--line2)}
.pick .t{flex:1;min-width:0}.pick .t span{display:block;color:var(--mute);font-size:12px}
.vacío{padding:30px;text-align:center;color:var(--mute)}
@media (max-width:1100px){.rev{grid-template-columns:1fr}.inicio,.firma{grid-template-columns:1fr}main{overflow:auto}}
</style>
</head>
<body>
<div id="app"></div>

<!-- build:libs -->
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<!-- /build:libs -->
<!-- build:modulos -->
<script src="motor.js"></script>
<script src="programas.js"></script>
<script src="lector-excel.js"></script>
<script src="pdf.js"></script>
<!-- /build:modulos -->
<!-- build:entorno -->
<script>window.__GAS = false;</script>
<!-- /build:entorno -->
<script>
(function () {
  'use strict';
  var M = BalanceMotor, PR = BalanceProgramas, LE = LectorExcel, PDF = BalancePDF;
  var ROLES = { jefe: 'Jefe de Programa' };   // la página es de un solo usuario: el Jefe de Programa de la Facultad de Administración
  var imagenesAssets = { logo: null, marca: null };

  var S = {
    vista: 'inicio', rol: 'jefe', prog: null, est: null, res: null, ver: null,
    imgs: { jefe: null }, dims: { jefe: null }, posPref: null,
    form: { notas: '' }, formErr: null, formAv: null, cargando: false, creando: false, filtro: 'todas', modal: null, firmaForm: { jefe: {} },
    sesion: { nombre: '', email: '', roles: ['jefe'], prueba: true }, msg: null,
    sel: {}, grupo: { msg: null, trabajando: false },
    guardados: [], guardando: '', toast: null, dialogo: null, arranque: true, errorArranque: null
  };

  /* ───── entorno: Apps Script (producción) o navegador suelto (pruebas) ───── */
  var GAS = !!(window.__GAS && window.google && google.script && google.script.run);
  function srv(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, no) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { no(new Error((e && e.message) || String(e))); })[fn].apply(null, args);
    });
  }
  /* Identidad: el Portal entrega el token de Microsoft (mismo mecanismo que Titulación y Concesiones).
     Sin Portal (modo independiente) no llega token y el servidor decide si permite el modo prueba. */
  var tokenMs = { valor: '', t: 0 };
  function obtenerToken() {
    if (!GAS) return Promise.resolve('');
    if (tokenMs.valor && Date.now() - tokenMs.t < 40 * 60 * 1000) return Promise.resolve(tokenMs.valor);
    if (tokenMs.sinPortal && Date.now() - tokenMs.sinPortal < 10 * 60 * 1000) return Promise.resolve('');
    return new Promise(function (ok) {
      var hecho = false;
      function on(ev) {
        if (ev.data && ev.data.type === 'balance:token' && ev.data.token) {
          hecho = true; window.removeEventListener('message', on);
          tokenMs = { valor: ev.data.token, t: Date.now() }; ok(ev.data.token);
        }
      }
      window.addEventListener('message', on);
      try { window.top.postMessage({ type: 'balance:token-request' }, '*'); } catch (e) {}
      setTimeout(function () { if (!hecho) { window.removeEventListener('message', on); tokenMs.sinPortal = Date.now(); ok(''); } }, 2500);
    });
  }
  function srvAuth(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    function intento(reintento) {
      return obtenerToken().then(function (t) { return srv.apply(null, [fn, t].concat(args)); }).catch(function (err) {
        if (!reintento && /venci/i.test(err.message)) { tokenMs = { valor: '', t: 0 }; return intento(true); }
        throw err;
      });
    }
    return intento(false);
  }
  function b64aBuffer(b64) { var bin = atob(b64), n = bin.length, u = new Uint8Array(n); for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
  function resumen(e) {
    var fs = M.estadoFirmas(e), info = e.info || {};
    return { key: claveEstado(e), programaId: e.programaId, estudiante: e.estudiante, fase: fs.fase, completo: info.completo, pendientes: info.pendientes, actualizado: new Date().toISOString() };
  }
  var Backend = {
    sesion: function () {
      return GAS ? srvAuth('infoSesion') : Promise.resolve({ email: '', roles: ['jefe'], prueba: true });
    },
    excel: function (meta) { return GAS ? srvAuth('plantilla', meta.archivo).then(b64aBuffer) : null; },
    listar: function () {
      if (GAS) return srvAuth('listarBalances');
      var out = [];
      try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('balance:') === 0) { try { var e = JSON.parse(localStorage.getItem(k)); if (e && e.programaId) { var r = resumen(e); r.actualizado = e.bitacora && e.bitacora.length ? e.bitacora[e.bitacora.length - 1].t : ''; out.push(r); } } catch (x) {} } } } catch (e) {}
      return Promise.resolve(out);
    },
    cargar: function (key) {
      if (GAS) return srvAuth('cargarBalance', key).then(function (t) { return JSON.parse(t); });
      try { return Promise.resolve(JSON.parse(localStorage.getItem(key))); } catch (e) { return Promise.reject(e); }
    },
    guardar: function (e) {
      var copia = JSON.parse(JSON.stringify(e));
      if (GAS) return srvAuth('guardarBalance', claveEstado(e), JSON.stringify(copia), JSON.stringify(resumen(e)));
      try { localStorage.setItem(claveEstado(e), JSON.stringify(copia)); } catch (x) {}
      return Promise.resolve();
    },
    borrar: function (key) {
      if (GAS) return srvAuth('eliminarBalance', key);
      try { localStorage.removeItem(key); } catch (e) {}
      return Promise.resolve();
    }
  };

  /* ───── utilidades ───── */
  function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(sel, el) { return (el || document).querySelector(sel); }
  function quien() { return S.sesion.nombre && !S.sesion.prueba ? S.sesion.nombre + ' (Jefe de Programa)' : 'Jefe de Programa'; }
  function fecha(iso) { try { return new Date(iso).toLocaleString('es-CO', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return iso; } }
  function claveEstado(e) { return 'balance:' + e.programaId + ':' + String(e.estudiante.documento).replace(/\D+/g, ''); }

  function leerSesion() {
    return Backend.sesion().then(function (x) {
      S.sesion.email = x.email || ''; S.sesion.nombre = x.nombre || x.email || '';
      S.sesion.roles = x.roles || []; S.sesion.prueba = !!x.prueba;
      if (S.sesion.roles.length && S.sesion.roles.indexOf(S.rol) < 0) S.rol = S.sesion.roles[0];
    });
  }

  /* ───── guardado ───── */
  var colaGuardado = Promise.resolve();
  function guardar() {
    if (!S.est) return colaGuardado;
    var est = S.est;
    S.guardando = 'guardando'; pintarEstadoGuardado();
    colaGuardado = colaGuardado.then(function () { return Backend.guardar(est); }).then(function () {
      S.guardando = 'guardado'; pintarEstadoGuardado();
    }).catch(function (err) {
      S.guardando = 'error'; S.errorGuardado = err.message; pintarEstadoGuardado();
    });
    return colaGuardado;
  }
  function pintarEstadoGuardado() {
    var el = $('#estado-guardado'); if (!el) return;
    var m = { guardando: ['mute', 'Guardando…'], guardado: ['ok', 'Guardado'], error: ['bad', 'No se pudo guardar'] }[S.guardando];
    el.innerHTML = m ? '<span class="chip ' + m[0] + '" title="' + h(S.errorGuardado || '') + '">' + m[1] + '</span>' : '';
  }
  function refrescarGuardados() {
    return Backend.listar().then(function (l) {
      S.guardados = (l || []).sort(function (a, b) { return String(b.actualizado || '').localeCompare(String(a.actualizado || '')); });
    }).catch(function () { S.guardados = []; });
  }

  /* ───── carga de imágenes fijas del PDF ───── */
  function aDataURL(url) {
    return fetch(url).then(function (r) { return r.blob(); }).then(function (b) {
      return new Promise(function (ok) { var fr = new FileReader(); fr.onload = function () { ok(fr.result); }; fr.readAsDataURL(b); });
    }).catch(function () { return null; });
  }
  function cargarAssets() {
    if (window.__ASSETS) { imagenesAssets.logo = window.__ASSETS.logo; imagenesAssets.marca = window.__ASSETS.marca; return Promise.resolve(); }
    return Promise.all([aDataURL('assets/logo-armada.png'), aDataURL('assets/marca-agua.png')]).then(function (r) {
      imagenesAssets.logo = r[0]; imagenesAssets.marca = r[1];
    });
  }

  /* ───── diálogos propios (sin alert/confirm del navegador) ───── */
  function pregunta(titulo, texto, ok, cancelar) {
    return new Promise(function (res) { S.dialogo = { titulo: titulo, texto: texto, ok: ok || 'Aceptar', cancelar: cancelar === undefined ? 'Cancelar' : cancelar, res: res }; render(); });
  }
  function aviso(titulo, texto) { return pregunta(titulo, texto, 'Entendido', null); }
  function vDialogo() {
    var d = S.dialogo;
    return '<div class="modal" data-act="dialogo-no"><div class="box" role="alertdialog" aria-modal="true" style="width:min(460px,94vw)"><div class="hd"><b>' + h(d.titulo) + '</b></div>' +
      '<div style="padding:16px 18px;white-space:pre-line">' + h(d.texto) + '</div><div style="padding:0 18px 16px;display:flex;gap:8px;justify-content:flex-end">' +
      (d.cancelar ? '<button class="btn" data-act="dialogo-no">' + h(d.cancelar) + '</button>' : '') + '<button class="btn pri" data-act="dialogo-si" id="dialogo-ok">' + h(d.ok) + '</button></div></div></div>';
  }

  /* ───── flujo ───── */
  function recalcular() {
    S.res = M.calcular(S.prog, S.est);
    S.ver = M.verificarEstudiante(S.res.sma, S.est.estudiante);
    S.fs = M.estadoFirmas(S.est);
    S.est.info = { completo: !!(S.res.completo && S.ver.ok), pendientes: S.res.faltantes.length + (S.res.avisosNombre || 0) };
  }
  function fase() { return S.fs ? S.fs.fase : 'borrador'; }
  function bloqueado() { return fase() !== 'borrador'; }
  function puedeEmitir() { return S.res && S.res.completo && S.ver && S.ver.ok; }

  /* Lee el pénsum del programa y calcula el balance de cualquier estado (abierto o no). */
  function evaluar(est) {
    var meta = PR.porId(est.programaId);
    if (!meta) return Promise.reject(new Error('El programa de este balance ya no tiene plantilla.'));
    return LE.cargarPrograma(meta, null, GAS ? Backend.excel : null).then(function (prog) {
      var res = M.calcular(prog, est), ver = M.verificarEstudiante(res.sma, est.estudiante), fs = M.estadoFirmas(est);
      est.info = { completo: !!(res.completo && ver.ok), pendientes: res.faltantes.length + (res.avisosNombre || 0) };
      return { est: est, prog: prog, res: res, ver: ver, fs: fs, ok: !!(res.completo && ver.ok) };
    });
  }

  function abrir(estado, irA) {
    var meta = PR.porId(estado.programaId);
    if (!meta) { aviso('Programa no disponible', 'El programa de este balance ya no tiene plantilla.'); return Promise.resolve(); }
    S.cargando = true; render();
    return LE.cargarPrograma(meta, null, GAS ? Backend.excel : null).then(function (prog) {
      S.prog = prog; S.est = estado; S.cargando = false;
      if (estado.firmas && estado.firmas.jefe) S.firmaForm.jefe = { grado: estado.firmas.jefe.grado, nombre: estado.firmas.jefe.nombre, cargo: estado.firmas.jefe.cargo };
      recalcular(); S.vista = irA || 'revision'; S.msg = null; render();
    }).catch(function (err) { S.cargando = false; S.formErr = [String(err.message || err)]; S.vista = 'inicio'; render(); });
  }

  /* Del SMA salen el programa, la cédula, los apellidos, los nombres y las notas. Se pueden pegar varios estudiantes seguidos. */
  function crear() {
    var texto = S.form.notas;
    if (!texto.trim()) { S.formErr = ['Pegue el historial del SMA (puede pegar varios estudiantes seguidos).']; S.formAv = null; render(); return; }
    var bloques = M.separarHistorias(texto), nuevos = [], errores = [];
    bloques.forEach(function (b, i) {
      var d = M.estudianteDeSMA(b);
      var etq = 'Historial ' + (i + 1) + (d.apellidos || d.nombres ? ' (' + M.titulo((d.nombres + ' ' + d.apellidos).trim()) + ')' : '');
      if (!d.documento || !(d.nombres || d.apellidos)) { errores.push(etq + ': no se encontró el encabezado del estudiante (Código, N° Ident., Apellidos y Nombre). Copie el historial completo desde el SMA.'); return; }
      var meta = PR.porTextoSMA(d.programaSMA);
      if (!meta) { errores.push(etq + ': no se reconoció el programa “' + d.programaSMA + '”.'); return; }
      if (!PR.estaActivo(meta)) { errores.push(etq + ': el programa ' + meta.nombre + ' aún no está habilitado en este módulo.'); return; }
      var est = M.nuevoEstado(meta.id, { nombres: d.nombres, apellidos: d.apellidos, tipoDoc: 'CC', documento: d.documento, nivel: meta.nivel }, quien());
      var dup = nuevos.filter(function (x) { return claveEstado(x) === claveEstado(est); })[0];
      var r = M.agregarNotas(dup || est, b, quien());
      if (!r.agregados && !dup) { errores.push(etq + ': no se encontraron asignaturas con nota.'); return; }
      if (!dup) nuevos.push(est);
    });
    if (!nuevos.length) { S.formErr = errores.length ? errores : ['No se encontró ningún historial en lo pegado.']; S.formAv = null; render(); return; }
    var existentes = nuevos.filter(function (e) { return S.guardados.some(function (g) { return g.key === claveEstado(e); }); });
    var seguir = existentes.length
      ? pregunta('Ya existen balances', 'Ya hay balances guardados de: ' + existentes.map(function (e) { return M.titulo(e.estudiante.nombres + ' ' + e.estudiante.apellidos); }).join(', ') + '.\n¿Reemplazarlos con los nuevos? Se pierde el registro de cambios de los anteriores.', 'Reemplazar')
      : Promise.resolve(true);
    seguir.then(function (si) {
      if (!si) return;
      S.formErr = null; S.formAv = null; S.creando = true; render();
      return nuevos.reduce(function (p, est) {
        return p.then(function () { return evaluar(est).then(function () { return Backend.guardar(est); }); });
      }, Promise.resolve()).then(refrescarGuardados).then(function () {
        S.creando = false;
        if (nuevos.length === 1 && !errores.length) { S.form.notas = ''; return abrir(nuevos[0], 'revision'); }
        S.sel = {}; nuevos.forEach(function (e) { S.sel[claveEstado(e)] = true; });
        S.form.notas = ''; S.formAv = errores.length ? ['No se crearon:'].concat(errores) : null;
        S.grupo.msg = { t: 'ok', x: nuevos.length + (nuevos.length === 1 ? ' balance creado' : ' balances creados') + ' y guardados' + (GAS ? ' en OneDrive' : '') + '. Revise los incompletos y firme en grupo los que estén listos.' };
        render();
      });
    }).catch(function (err) { S.creando = false; S.formErr = ['No se pudieron crear los balances: ' + err.message]; render(); });
  }

  /* Guarda el balance abierto y vuelve al visor para cargar otro; queda seleccionado en la lista. */
  function guardarVolver() {
    if (!S.est) return;
    var k = claveEstado(S.est), nom = M.titulo(S.est.estudiante.nombres + ' ' + S.est.estudiante.apellidos);
    Promise.resolve(guardar()).then(refrescarGuardados).then(function () {
      S.sel[k] = true; S.est = null; S.prog = null; S.res = null; S.fs = null; S.ver = null; S.msg = null; S.formErr = null; S.formAv = null;
      S.grupo.msg = { t: 'ok', x: 'Balance de ' + nom + ' guardado. Pegue otro historial del SMA o firme todos cuando termine.' };
      S.vista = 'inicio'; render();
    }).catch(function (err) { S.msg = { t: 'bad', x: 'No se pudo guardar: ' + err.message }; render(); });
  }
  function seleccionarTodos() { S.sel = {}; S.guardados.forEach(function (g) { S.sel[g.key] = true; }); }
  function firmarTodos() { if (!S.guardados.length) return; seleccionarTodos(); firmarGrupo(); }
  function aplicarCambio(fn) {
    if (bloqueado()) return;
    fn(); recalcular(); guardar(); render();
  }

  /* ───── firma digital (solo el Jefe de Programa) ───── */
  function cargarFormFirma() { try { var x = JSON.parse(localStorage.getItem('balance.firmante') || 'null'); if (x && typeof x === 'object') S.firmaForm.jefe = x; } catch (e) {} }
  function guardarFormFirma() { try { localStorage.setItem('balance.firmante', JSON.stringify(S.firmaForm.jefe || {})); } catch (e) {} }
  function datosFirmante() {
    var f = S.firmaForm.jefe || {}, base = S.prog ? S.prog.firmantes.jefe : 'Jefe de Programa';
    return { grado: f.grado || '', nombre: f.nombre != null ? f.nombre : (S.sesion.nombre && !S.sesion.prueba ? S.sesion.nombre : ''), cargo: f.cargo ? f.cargo : base };
  }
  function firmaLista() { return !!S.imgs.jefe && !!datosFirmante().nombre.trim(); }
  function sellar(est, fs) {   // pone la firma del Jefe en un estado
    var d = datosFirmante();
    est.firmas.jefe = { grado: d.grado.trim(), nombre: d.nombre.trim(), cargo: d.cargo.trim(), fecha: new Date().toISOString(), huella: fs.huella };
    if (S.posPref && !(est.firmasPos && est.firmasPos.jefe)) { est.firmasPos = est.firmasPos || {}; est.firmasPos.jefe = S.posPref; }
  }
  function firmar() {
    if (!puedeEmitir()) return;
    if (!S.imgs.jefe) { S.msg = { t: 'bad', x: 'Cargue la imagen de su firma antes de firmar.' }; render(); return; }
    if (!datosFirmante().nombre.trim()) { S.msg = { t: 'bad', x: 'Escriba su nombre para que salga en el balance.' }; render(); return; }
    sellar(S.est, S.fs);
    M.registrar(S.est, quien(), 'firmó el balance');
    S.msg = { t: 'ok', x: 'Balance firmado. Ya puede descargar el PDF con su firma.' };
    recalcular(); guardar().then(refrescarGuardados); render();
  }
  function reabrir() {
    pregunta('Reabrir el balance', 'Reabrir borra la firma; tendrá que firmar de nuevo. ¿Continuar?', 'Reabrir').then(function (si) {
      if (!si) return;
      S.est.firmas = { jefe: null };
      M.registrar(S.est, quien(), 'reabrió el balance', 'la firma se anuló');
      S.msg = null; recalcular(); guardar().then(refrescarGuardados); render();
    });
  }
  function cargarFirma(file) {
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function () {
      if (!/^data:image\/(png|jpeg|jpg)/i.test(fr.result)) { S.msg = { t: 'bad', x: 'La firma debe ser una imagen PNG o JPG.' }; S.grupo.msg = S.msg; render(); return; }
      S.imgs.jefe = fr.result; S.msg = null; S.grupo.msg = null;
      var im = new Image(); im.onload = function () { S.dims.jefe = { w: im.naturalWidth, h: im.naturalHeight }; render(); }; im.onerror = function () { render(); }; im.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  /* La firma se puede mover y cambiar de tamaño mientras el balance no esté firmado. */
  function firmaEditable() { return !!S.imgs.jefe && !!S.est && !(S.est.firmas.jefe && S.fs && S.fs.jefe); }
  function posJefe(est) { return (est.firmasPos && est.firmasPos.jefe) || S.posPref || null; }
  function pdfDe(est, prog, res, fs, vista) {
    var f = est.firmas.jefe, firmado = !!(f && fs.jefe), d = datosFirmante(), usar = firmado ? f : d, img = S.imgs.jefe, dm = S.dims.jefe || {};
    var firmas = {
      jefe: { img: firmado ? img : null, w: dm.w, h: dm.h, tipo: img && /image\/jpe?g/i.test(img) ? 'JPEG' : 'PNG',
              nombre: ((usar.grado ? usar.grado + ' ' : '') + (usar.nombre || '')).trim(), cargo: usar.cargo || prog.firmantes.jefe, pos: posJefe(est) },
      decano: { nombre: '', cargo: prog.firmantes.decano, soloLinea: true }       // el Decano firma aparte: solo queda su línea
    };
    if (vista && est === S.est && firmaEditable()) { firmas.jefe.img = img; firmas.jefe.oculta = true; }
    var JsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
    if (!JsPDF) throw new Error('No se cargó la librería de PDF (jsPDF). Recargue la página; si sigue igual, revise que el navegador no bloquee scripts.');
    return PDF.generar(JsPDF, { prog: prog, estado: est, res: res, logo: imagenesAssets.logo, marca: imagenesAssets.marca, firmas: firmas });
  }
  function construirPDF(vista) { return pdfDe(S.est, S.prog, S.res, S.fs, vista); }
  function bajar(blob, nombre) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  function nombreArchivo(est, usados) {
    var n = (est.estudiante.nombres + ' ' + est.estudiante.apellidos).replace(/\s+/g, ' ').trim().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_');
    var base = 'Balance_Academico_' + n, f = base + '.pdf', k = 1;
    while (usados && usados[f]) { k++; f = base + '_' + k + '.pdf'; }
    if (usados) usados[f] = 1;
    return f;
  }
  function faltaImagenFirmada() { return aviso('Falta la imagen de su firma', 'La imagen de la firma no se guarda en el balance. Cárguela otra vez para descargar el PDF con su firma.'); }
  function descargarPDF() {
    if (!S.fs || !S.fs.jefe) { S.msg = { t: 'bad', x: 'Firme el balance antes de descargar el PDF.' }; render(); return; }
    if (!puedeEmitir()) return;
    if (S.fs.jefe && !S.imgs.jefe) { faltaImagenFirmada(); return; }
    bajar(construirPDF().output('blob'), nombreArchivo(S.est));
    M.registrar(S.est, quien(), 'descargó el PDF', S.fs.jefe ? 'firmado' : 'sin firma'); guardar();
  }

  /* ───── en grupo: varios balances con una sola firma ───── */
  function clavesSel() { return S.guardados.filter(function (g) { return S.sel[g.key]; }).map(function (g) { return g.key; }); }
  function cargarEstado(key) { return S.est && claveEstado(S.est) === key ? Promise.resolve(S.est) : Backend.cargar(key); }
  function grupoOcupado(msg) { S.grupo.trabajando = msg || false; render(); }
  function firmarGrupo() {
    var claves = clavesSel(); if (!claves.length) return;
    if (!S.imgs.jefe) { S.grupo.msg = { t: 'bad', x: 'Cargue la imagen de su firma.' }; render(); return; }
    if (!datosFirmante().nombre.trim()) { S.grupo.msg = { t: 'bad', x: 'Escriba su nombre para que salga bajo la firma.' }; render(); return; }
    guardarFormFirma(); S.grupo.msg = null; grupoOcupado('Firmando…');
    var firmados = 0, omitidos = [];
    claves.reduce(function (p, key) {
      return p.then(function () {
        return cargarEstado(key).then(function (est) {
          var nom = M.titulo(est.estudiante.nombres + ' ' + est.estudiante.apellidos);
          return evaluar(est).then(function (x) {
            if (!x.ok) { omitidos.push(nom + ': el balance está incompleto'); return Backend.guardar(est); }
            if (x.fs.jefe) { omitidos.push(nom + ': ya estaba firmado'); return; }
            sellar(est, x.fs); M.registrar(est, quien(), 'firmó el balance', 'firma en grupo'); firmados++;
            if (S.est && claveEstado(S.est) === key) { recalcular(); }
            return Backend.guardar(est);
          });
        });
      });
    }, Promise.resolve()).then(refrescarGuardados).then(function () {
      S.grupo.trabajando = false;
      S.grupo.msg = { t: firmados ? 'ok' : 'warn', x: (firmados ? firmados + (firmados === 1 ? ' balance firmado' : ' balances firmados') + '. ' : 'No se firmó ningún balance. ') + (omitidos.length ? 'Omitidos: ' + omitidos.join(' · ') + '.' : 'Ya puede descargarlos.') };
      render();
    }).catch(function (err) { S.grupo.trabajando = false; S.grupo.msg = { t: 'bad', x: 'No se pudo firmar en grupo: ' + err.message }; render(); });
  }
  function descargarGrupo() {
    var claves = clavesSel(); if (!claves.length) return;
    S.grupo.msg = null; grupoOcupado('Armando los PDF…');
    var hechos = 0, omitidos = [], usados = {}, archivos = [];
    claves.reduce(function (p, key) {
      return p.then(function () {
        return cargarEstado(key).then(function (est) {
          var nom = M.titulo(est.estudiante.nombres + ' ' + est.estudiante.apellidos);
          return evaluar(est).then(function (x) {
            if (!x.ok) { omitidos.push(nom + ': incompleto'); return; }
            if (!x.fs.jefe) { omitidos.push(nom + ': falta firmarlo'); return; }
            if (x.fs.jefe && !S.imgs.jefe) { omitidos.push(nom + ': falta cargar la imagen de su firma'); return; }
            archivos.push({ blob: pdfDe(est, x.prog, x.res, x.fs, false).output('blob'), nombre: nombreArchivo(est, usados) });
            M.registrar(est, quien(), 'descargó el PDF', x.fs.jefe ? 'firmado, en grupo' : 'sin firma, en grupo'); hechos++;
            return Backend.guardar(est);
          });
        });
      });
    }, Promise.resolve()).then(function () {
      archivos.forEach(function (a, i) { setTimeout(function () { bajar(a.blob, a.nombre); }, i * 700); });
      S.grupo.trabajando = false;
      S.grupo.msg = { t: hechos ? 'ok' : 'warn', x: (hechos ? hechos + (hechos === 1 ? ' PDF descargado. ' : ' PDF descargados. ') + (hechos > 1 ? 'Si el navegador pregunta, permita las descargas múltiples. ' : '') : 'No se descargó ningún PDF. ') + (omitidos.length ? 'Omitidos: ' + omitidos.join(' · ') + '.' : '') };
      render();
    }).catch(function (err) { S.grupo.trabajando = false; S.grupo.msg = { t: 'bad', x: 'No se pudieron armar los PDF: ' + err.message }; render(); });
  }

  /* ───── vistas ───── */
  var FASES = {
    borrador: ['mute', 'En elaboración'], firmado: ['ok', 'Firmado'], cerrado_jefe: ['ok', 'Firmado']
  };
  function chipFase(f) { var x = FASES[f] || FASES.borrador; return '<span class="chip ' + x[0] + '">' + x[1] + '</span>'; }

  function vTop() {
    return '<div class="top"><b>Balance Académico</b><span class="sep">/</span><span>Escuela Naval de Cadetes “Almirante Padilla”</span>' +
      '<div class="quien">' + (S.sesion.prueba ? '<span class="prueba">Modo prueba (sin sesión del Portal)</span>' : '') +
      (S.sesion.email ? '<span style="opacity:.8">' + h(S.sesion.email) + '</span>' : '') +
      '<span class="chip" style="background:var(--navy2);color:#fff">Jefe de Programa · Facultad de Administración</span></div></div>';
  }
  function vTabs() {
    var hay = !!S.est;
    var t = [['inicio', 'Datos y notas', 1], ['revision', 'Revisión', 2], ['firma', 'Firma y PDF', 3]];
    return '<div class="tabs" role="tablist">' + t.map(function (x) {
      return '<button class="tab" role="tab" data-vista="' + x[0] + '" aria-selected="' + (S.vista === x[0]) + '"' + (x[0] !== 'inicio' && !hay ? ' disabled' : '') + '><span class="n">' + x[2] + '</span>' + x[1] + '</button>';
    }).join('') + (hay ? '<div class="est"><span id="estado-guardado"></span><span>' + h(M.titulo(S.est.estudiante.nombres + ' ' + S.est.estudiante.apellidos)) + '</span><span class="chip mute">' + h(S.prog ? S.prog.nombre : '') + '</span>' + chipFase(fase()) + '</div>' : '') +
      '</div>';
  }

  function chipLista(g) {
    if (g.fase === 'firmado' || g.fase === 'cerrado_jefe') return '<span class="chip ok">Firmado</span>';
    if (g.completo === true) return '<span class="chip warn">Listo para firmar</span>';
    if (g.completo === false) return '<span class="chip bad">Incompleto' + (g.pendientes ? ' (' + g.pendientes + ')' : '') + '</span>';
    return '<span class="chip mute">En elaboración</span>';
  }
  function panelFirmaGrupo(n) {
    var d = datosFirmante(), img = S.imgs.jefe, ocupado = S.grupo.trabajando;
    return '<div class="grupo"><div class="lbl">Firma digital del Jefe de Programa</div>' +
      '<div class="grid2"><label class="f">Grado<input id="fi-grado" value="' + h(d.grado) + '" placeholder="Ej. MYCIM"></label><label class="f">Nombre<input id="fi-nombre" value="' + h(d.nombre) + '"></label></div>' +
      '<label class="f">Cargo<input id="fi-cargo" value="' + h(d.cargo) + '"></label>' +
      '<div style="display:flex;gap:10px;align-items:center"><div class="sigmini" style="flex:1">' + (img ? '<img alt="Firma" src="' + img + '">' : 'Sin imagen de firma') + '</div>' +
      '<label class="btn sm" style="cursor:pointer">' + (img ? 'Cambiar' : 'Cargar firma') + '<input type="file" id="firma-img" accept="image/png,image/jpeg" hidden></label></div>' +
      '<div style="font-size:11.5px;color:var(--mute)">La imagen de la firma no se guarda: se carga una vez por sesión y sirve para todos los balances.</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="firmar-grupo"' + (n && !ocupado ? '' : ' disabled') + '>' + (ocupado || 'Firmar seleccionados (' + n + ')') + '</button>' +
      '<button class="btn" data-act="descargar-grupo"' + (n && !ocupado ? '' : ' disabled') + '>Descargar PDF seleccionados (' + n + ')</button></div></div>';
  }

  function vInicio() {
    var f = S.form, guard = S.guardados, nSel = clavesSel().length;
    var todos = guard.length && guard.every(function (g) { return S.sel[g.key]; });
    return '<div class="inicio"><div class="col">' +
      '<div class="card" style="padding:16px 18px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0">' +
      '<div><div class="lbl">Notas del SMA</div><div style="color:var(--mute);font-size:12.5px;margin-top:4px">Copie el historial académico tal como sale del SMA y péguelo aquí. De ahí salen el programa, la cédula, los apellidos, los nombres y las notas. Puede pegar varios estudiantes seguidos: se crea un balance por cada uno.</div></div>' +
      '<textarea id="f-notas" spellcheck="false" style="flex:1;min-height:200px" placeholder="Historia Academica&#10;Código&#9;…&#9;N° Ident. …&#10;Apellidos&#9;…&#10;Nombre&#9;…&#10;Programa&#9;…">' + h(f.notas) + '</textarea>' +
      (S.formErr ? '<div class="alert bad">' + S.formErr.map(h).join('<br>') + '</div>' : '') +
      (S.formAv && S.formAv.length ? '<div class="alert warn">' + S.formAv.map(h).join('<br>') + '</div>' : '') +
      '<div style="display:flex;gap:10px;align-items:center"><button class="btn pri" data-act="crear"' + (S.cargando || S.creando ? ' disabled' : '') + '>' + (S.creando ? 'Creando balances…' : S.cargando ? 'Leyendo pénsum…' : 'Crear balances') + '</button>' +
      '<span style="color:var(--mute);font-size:12px">Por ahora: Especialización en Gestión Logística y Maestría en Gestión Logística.</span></div>' +
      '</div></div>' +
      '<div class="col"><div class="card guardados" style="flex:1"><div style="padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px"><input type="checkbox" class="chk" id="sel-todos" aria-label="Seleccionar todos"' + (todos ? ' checked' : '') + (guard.length ? '' : ' disabled') + '><span class="lbl">Balances (' + guard.length + ')</span><span style="color:var(--mute);font-size:12px">' + nSel + ' seleccionado' + (nSel === 1 ? '' : 's') + '</span><button class="btn pri sm" style="margin-left:auto" data-act="firmar-todos"' + (guard.length && !S.grupo.trabajando ? '' : ' disabled') + '>' + (S.grupo.trabajando || 'Firmar todos (' + guard.length + ')') + '</button></div>' +
      (S.grupo.msg ? '<div class="alert ' + S.grupo.msg.t + '" style="margin:10px 14px 0">' + h(S.grupo.msg.x) + '</div>' : '') +
      (guard.length ? guard.map(function (g, i) {
        var m = PR.porId(g.programaId);
        return '<div class="gd"><input type="checkbox" class="chk" data-sel="' + h(g.key) + '" aria-label="Seleccionar"' + (S.sel[g.key] ? ' checked' : '') + '><div class="t"><b>' + h(M.titulo(g.estudiante.nombres + ' ' + g.estudiante.apellidos)) + '</b><span>' + h(m ? m.nombre : g.programaId) + ' · ' + h(g.estudiante.documento) + (g.actualizado ? ' · ' + h(fecha(g.actualizado)) : '') + '</span></div>' + chipLista(g) +
          '<button class="btn sm" data-act="abrir-g" data-i="' + i + '">Abrir</button><button class="btn sm" data-act="borrar-g" data-i="' + i + '" aria-label="Eliminar">✕</button></div>';
      }).join('') : '<div class="vacío">Aún no hay balances. Pegue un historial del SMA y pulse “Crear balances”.</div>') +
      '<div style="flex:1"></div>' + panelFirmaGrupo(nSel) +
      '<div style="padding:10px 14px;border-top:1px solid var(--line);color:var(--mute);font-size:12px">Los balances se guardan automáticamente ' + (GAS ? 'en OneDrive' : 'en este navegador (modo prueba)') + '. No se envía nada por correo: el PDF se descarga con la firma digital.</div></div></div></div>';
  }

  function chipEstado(l) {

  /* vista previa con pdf.js (funciona también dentro del recuadro protegido de Apps Script) */
  var pdfjsListo = null;
  function prepararPdfjs() {
    if (pdfjsListo) return pdfjsListo;
    pdfjsListo = new Promise(function (ok, no) {
      if (!window.pdfjsLib) return no(new Error('pdf.js no cargó'));
      var v = pdfjsLib.version, url = GAS ? 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + v + '/pdf.worker.min.js' : 'vendor/pdf.worker.min.js';
      fetch(url).then(function (r) { return r.text(); }).then(function (t) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: 'text/javascript' })); ok();
      }).catch(no);

  }
  var tokenPrevia = 0;
  /* ───── firma movible sobre la vista previa ───── */
  function montarFirmaMovible(pw, k, T, PW, PH) {
    var rol = 'jefe', dim = S.dims[rol] || {};
    var g = PDF.geometriaFirma(rol, dim.w, dim.h, posJefe(S.est));
    var cx = g.cx, top = g.top, w = g.w;                                  // top es relativo al cuadro de firmas (T)
    var el = document.createElement('div'); el.className = 'sigdrag'; el.tabIndex = 0;
    el.title = 'Arrastre para mover · esquinas para cambiar el tamaño · flechas para ajustar';
    el.innerHTML = '<img alt="Firma" draggable="false" src="' + S.imgs[rol] + '">' + ['nw', 'ne', 'sw', 'se'].map(function (c) { return '<i class="hd ' + c + '" data-h="' + c + '"></i>'; }).join('');
    pw.appendChild(el);
    function alto() { return w * g.ratio; }
    function limitar() {
      w = Math.max(18, Math.min(w, PW)); var h = alto();
      cx = Math.max(w / 2, Math.min(cx, PW - w / 2));
      top = Math.max(-T, Math.min(top, PH - T - h));
    }
    function pintar() {
      limitar(); el.style.left = ((cx - w / 2) * k) + 'px'; el.style.top = ((T + top) * k) + 'px'; el.style.width = (w * k) + 'px'; el.style.height = (alto() * k) + 'px';
    }
    function guardarPos() {
      S.est.firmasPos = S.est.firmasPos || {}; S.est.firmasPos[rol] = { cx: +cx.toFixed(2), top: +top.toFixed(2), w: +w.toFixed(2) };
      S.posPref = S.est.firmasPos[rol];            // la última posición se usa en los demás balances
      guardar();
    }
    var drag = null;
    el.addEventListener('pointerdown', function (ev) {
      if (ev.button !== undefined && ev.button !== 0) return;
      ev.preventDefault(); el.focus(); el.setPointerCapture(ev.pointerId);
      var h = ev.target.getAttribute && ev.target.getAttribute('data-h'), r = pw.getBoundingClientRect(), hh = alto();
      drag = { h: h, x: ev.clientX, y: ev.clientY, cx: cx, top: top, w: w, r: r,
               ax: (h === 'nw' || h === 'sw') ? cx + w / 2 : cx - w / 2,            // esquina contraria: queda fija al cambiar el tamaño
               ay: (h === 'nw' || h === 'ne') ? top + hh : top };
    });
    el.addEventListener('pointermove', function (ev) {
      if (!drag) return;
      if (!drag.h) { cx = drag.cx + (ev.clientX - drag.x) / k; top = drag.top + (ev.clientY - drag.y) / k; pintar(); return; }
      var px = (ev.clientX - drag.r.left) / k, nw = drag.h === 'nw' || drag.h === 'sw' ? drag.ax - px : px - drag.ax;
      w = Math.max(18, nw); var hh = alto();
      cx = (drag.h === 'nw' || drag.h === 'sw') ? drag.ax - w / 2 : drag.ax + w / 2;
      top = (drag.h === 'nw' || drag.h === 'ne') ? drag.ay - hh : drag.ay;
      pintar();
    });
    function soltar() { if (!drag) return; drag = null; limitar(); pintar(); guardarPos(); }
    el.addEventListener('pointerup', soltar); el.addEventListener('pointercancel', soltar);
    el.addEventListener('keydown', function (ev) {
      var d = ev.shiftKey ? 5 : 1, m = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, -d], ArrowDown: [0, d] }[ev.key];
      if (!m) return; ev.preventDefault(); cx += m[0]; top += m[1]; pintar(); guardarPos();
    });
    pintar();
  }

  function pintarPrevia() {
    var cont = $('#prev'); if (!cont) return;
    if (!S.res.completo) {

    }

    cont.innerHTML = '<div class="card vacío" style="height:100%;display:flex;align-items:center;justify-content:center">Armando vista previa…</div>';

      var docPrev = construirPDF(true), buf = docPrev.output('arraybuffer');
      prepararPdfjs().then(function () { return pdfjsLib.getDocument({ data: buf }).promise; }).then(function (pdf) { return pdf.getPage(1); }).then(function (page) {

        cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', 'Vista previa del Balance Académico');
        return page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise.then(function () {
          var c = $('#prev'); if (!c || mio !== tokenPrevia) return;
          c.innerHTML = '<div class="prevbox"><div class="pgwrap"></div></div>'; var pw = c.firstChild.firstChild; pw.style.width = ancho + 'px'; pw.appendChild(cv);
          if (firmaEditable()) montarFirmaMovible(pw, ancho / vp0.width, docPrev.balanceT, vp0.width, vp0.height);
        });
      }).catch(function (err) { var c = $('#prev'); if (c) c.innerHTML = '<div class="alert warn">No se pudo mostrar la vista previa (' + h(err.message) + '). Puede descargar el PDF igualmente.</div>'; });
    } catch (err) { cont.innerHTML = '<div class="alert bad">No se pudo armar el PDF: ' + h(err.message) + '</div>'; }
  }

        var aprobada = x.def >= r.minimo || x.hab >= r.minimo;
        return '<div class="pick"><div class="t"><b class="mono">' + h(x.cod) + '</b> ' + h(nombre) + (cat ? ' <span class="chip ok" style="display:inline-flex">en catálogo</span>' : '') + '<span>' + h(x.periodo) + ' · ' + x.crd + ' créd. · nota ' + M.fmtNota(x.def) + (x.hab > 0 ? ' · hab. ' + M.fmtNota(x.hab) : '') + '</span></div>' +
          '<span class="chip ' + (aprobada ? 'ok' : 'bad') + '">' + (aprobada ? 'Aprobada' : 'No aprobada') + '</span><button class="btn sm pri" data-act="elegir" data-k="' + h(x.key) + '">Elegir</button></div>';
      }).join('') : '<div class="vacío">No hay asignaturas del SMA disponibles' + (q ? ' con esa búsqueda' : '') + '.</div>') + '</div></div></div>';
  }

  /* ───── eventos ───── */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-vista],[data-act],[data-filtro]');
    if (!t) return;
    if (t.hasAttribute('data-vista')) { if (!t.disabled) { S.vista = t.getAttribute('data-vista'); S.msg = null; render(); } return; }
    if (t.hasAttribute('data-filtro')) { S.filtro = t.getAttribute('data-filtro'); render(); return; }
    var act = t.getAttribute('data-act');
    if (act === 'cerrar-modal') { if (ev.target === t || t.tagName === 'BUTTON') { S.modal = null; render(); } return; }
    if (act === 'crear') crear();
    else if (act === 'guardar-volver') guardarVolver();
    else if (act === 'firmar-todos') firmarTodos();
    else if (act === 'abrir-g') {
      var g = S.guardados[+t.getAttribute('data-i')]; if (!g) return;
      S.cargando = true; render();
      Backend.cargar(g.key).then(function (e) {
        return abrir(e, 'revision');
      }).catch(function (err) { S.cargando = false; S.formErr = ['No se pudo abrir el balance: ' + err.message]; render(); });
    }
    else if (act === 'borrar-g') {
      var g2 = S.guardados[+t.getAttribute('data-i')]; if (!g2) return;
      pregunta('Eliminar balance', 'Se eliminará el balance de ' + M.titulo(g2.estudiante.nombres + ' ' + g2.estudiante.apellidos) + '. No se puede deshacer.', 'Eliminar').then(function (si) {
        if (si) Backend.borrar(g2.key).then(refrescarGuardados).then(render).catch(function (err) { aviso('No se pudo eliminar', err.message); });
      });
    }
    else if (act === 'dialogo-si' || act === 'dialogo-no') {
      if (act === 'dialogo-no' && ev.target !== t) return;
      var d = S.dialogo; S.dialogo = null; render(); if (d) d.res(act === 'dialogo-si');
    }
    else if (act === 'equiv') { var fila = S.res.lineas.filter(function (l) { return l.id === t.getAttribute('data-id'); })[0]; S.modal = { tipo: 'equiv', fila: fila, q: '' }; render(); }
    else if (act === 'optativa') { var bl = S.res.bloques.filter(function (b) { return b.id === t.getAttribute('data-b'); })[0]; S.modal = { tipo: 'optativa', bloque: bl, q: '' }; render(); }
    else if (act === 'elegir') {
      var reg = S.res.registros.filter(function (x) { return x.key === t.getAttribute('data-k'); })[0], m = S.modal;
      S.modal = null;
      if (reg) aplicarCambio(function () { if (m.tipo === 'optativa') M.agregarOptativa(S.est, m.bloque, reg, quien()); else M.aplicarEquivalencia(S.est, m.fila, reg, quien()); });
    }
    else if (act === 'quitar-eq') { var f2 = S.res.lineas.filter(function (l) { return l.id === t.getAttribute('data-id'); })[0]; aplicarCambio(function () { M.quitarEquivalencia(S.est, f2, quien()); }); }
    else if (act === 'quitar-opt') { var k = t.getAttribute('data-id'), lo = S.res.lineas.filter(function (l) { return l.regKey === k; })[0]; aplicarCambio(function () { M.quitarOptativa(S.est, k, quien(), lo ? lo.cod + ' ' + lo.nombre : ''); }); }
    else if (act === 'mas-notas') {
      var ta = $('#mas-notas'); if (!ta || !ta.value.trim()) return;
      aplicarCambio(function () {
        var prev = M.unirSMA(S.est.textos);
        var r = M.agregarNotas(S.est, ta.value, quien());
        var ver = M.verificarEstudiante(M.unirSMA(S.est.textos), S.est.estudiante);
        if (!ver.ok) { S.est.textos.pop(); S.est.bitacora.pop(); S.msg = null; aviso('No se agregaron las notas', ver.errores.join('\n')); return; }
        if (!r.agregados) aviso('Sin cambios', 'Esas notas ya estaban en el balance o no se reconocieron.');
      });
    }
    else if (act === 'firmar') firmar();
    else if (act === 'firmar-grupo') firmarGrupo();
    else if (act === 'descargar-grupo') descargarGrupo();
    else if (act === 'pdf') descargarPDF();
    else if (act === 'firma-reset') { if (S.est.firmasPos) delete S.est.firmasPos.jefe; S.posPref = null; guardar(); render(); }
    else if (act === 'reabrir') reabrir();
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'sel-todos') { S.sel = {}; if (t.checked) S.guardados.forEach(function (g) { S.sel[g.key] = true; }); render(); return; }
    if (t.hasAttribute && t.hasAttribute('data-sel')) { var kk = t.getAttribute('data-sel'); if (t.checked) S.sel[kk] = true; else delete S.sel[kk]; render(); return; }
    if (t.id && t.id.indexOf('f-') === 0) {
      var k = t.id.slice(2); S.form[k] = t.value;
      if (k === 'programaId') { var p = PR.porId(t.value); if (p) S.form.nivel = p.nivel; render(); }
      return;
    }
    if (t.id === 'firma-img') { cargarFirma(t.files[0]); return; }
    if (t.id && t.id.indexOf('fi-') === 0) {
      var c = t.id.slice(3), f = S.firmaForm.jefe || (S.firmaForm.jefe = {}); f[c] = t.value; guardarFormFirma(); return;
    }
    if (t.id === 'obs') { aplicarCambio(function () { M.editarObservaciones(S.est, t.value, quien()); }); return; }
    if (t.hasAttribute && t.hasAttribute('data-edit')) {
      var campo = t.getAttribute('data-edit'), id = t.getAttribute('data-id'), esOpt = t.getAttribute('data-opt') === '1';
      var l = S.res.lineas.filter(function (x) { return (esOpt ? x.regKey : x.id) === id; })[0];
      if (!l) return;
      aplicarCambio(function () {
        if (esOpt) M.editarOptativa(S.est, id, campo, t.value, quien(), campo === 'cod' ? l.cod : l.nombre);
        else M.editarCursado(S.est, l, campo, t.value, quien());
      });
    }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'modal-q') { S.modal.q = t.value; var pos = t.selectionStart; render(); var q = $('#modal-q'); q.focus(); q.setSelectionRange(pos, pos); }
    if (t.id === 'f-notas') S.form.notas = t.value;
    if (t.id === 'obs') { var n = $('#obs-n'); if (n) n.textContent = t.value.length; }
    if (t.id && t.id.indexOf('f-') === 0 && t.id !== 'f-notas' && t.tagName === 'INPUT') S.form[t.id.slice(2)] = t.value;
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.modal) { S.modal = null; render(); } });

  /* ───── arranque ───── */
  function precargar() { cargarFormFirma(); }
  render();
  Promise.all([leerSesion(), refrescarGuardados(), cargarAssets()]).then(function () {
    S.arranque = false; precargar(); render();
  }).catch(function (err) { S.arranque = false; S.errorArranque = err.message; render(); });
  window.BalanceApp = { estado: S }; // útil para pruebas
})();
</script>
</body>
</html>
