      +'<div class="tl-card'+(key==='perdido'?' perdido perd':'')+'">'+(anio?'<div class="yr-m">'+anio+'</div>':'')+'<div class="t"><b>'+titulo+'</b>'+(chipD?'<span class="d" style="background:'+p[1]+';color:'+p[2]+'">'+ESCT(chipD)+'</span>':'')+'</div>'+body+(chip?'<div><span class="cp" style="background:'+p[0]+'">'+ESCT(chip)+'</span></div>':'')+'</div></div>';
    n++;
  });
  h+='</div>';
  if(!L.length)h+='<div class="card msg">No hay información de la trayectoria de este estudiante en las bases conectadas.</div>';
  /* estado de las fuentes */
  if(F.fuentes&&F.fuentes.length)h+='<details class="fuentes card" style="padding:12px 16px"><summary>Estado de las fuentes</summary><ul>'+(F.fuentes||[]).map(function(x){return '<li class="'+(x.ok?'':'no')+'"><b>'+ESC(x.nombre)+'</b> — '+(x.ok?'conectada'+(x.filas!=null?' ('+x.filas+' filas)':''):'sin datos')+(x.nota?'. '+ESC(x.nota):'')+'</li>'}).join('')+'</ul><div class="rastro"><input id="rsq" inputmode="numeric" placeholder="C\u00e9dula a rastrear en los Excel"><button type="button" id="rsb">Rastrear</button><div id="rsr"></div></div></details>';
  h+='<div class="pie">Fuente: Oficina de Estadística</div>';
  $('out').innerHTML=h;
  if($('rsb'))$('rsb').addEventListener('click',function(){var q=($('rsq').value||'').replace(/\D/g,'');
    if(q.length<5){$('rsr').textContent='Escriba la c\u00e9dula completa, solo n\u00fameros.';return}
    $('rsr').textContent='Buscando la c\u00e9dula en los Excel\u2026';
    api('rastro',{q:q}).then(function(r){
      if(!r.hallazgos.length){$('rsr').textContent='Esa c\u00e9dula no aparece escrita en ninguna celda de Bajas y Ascensos ni del CONGLOMERADO: revisar c\u00f3mo est\u00e1 digitada all\u00ed.';return}
      $('rsr').innerHTML=r.hallazgos.map(function(x){return '<div class="rsf"><b>'+ESC(x.fuente+(x.hoja?' \u00b7 hoja \u201c'+x.hoja+'\u201d':'')+(x.fila?' \u00b7 fila '+x.fila+' \u00b7 coincide en la columna '+x.col:''))+'</b>'+(x.error?' \u2014 '+ESC(x.error):'')+(x.celdas&&x.celdas.length?'<br>'+ESC(x.celdas.join('  |  ')):'')+'</div>'}).join('')
    }).catch(function(e){$('rsr').textContent=e.message})});
  $('vlv').addEventListener('click',function(){document.body.classList.remove('ficha');document.body.classList.add('ini');$('out').innerHTML='';$('q').focus();$('q').select();try{window.scrollTo(0,0)}catch(e){}});
  try{window.scrollTo(0,0);document.scrollingElement.scrollTop=0}catch(e){}
}
