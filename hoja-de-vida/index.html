<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoja de vida del estudiante — ENAP</title>
<style>
:root{--ink:#14263D;--mut:#55657A;--pri:#1F4E8C;--bg:#EEF2F7;--red:#C0392B;--redbg:#FDECEA}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:"Aptos Display",Aptos,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--ink);background:transparent;font-size:14px;line-height:1.45;overflow:auto}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:28px 20px 48px;display:flex;flex-direction:column;gap:22px}
.rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rise{animation:none}}
.top{position:sticky;top:0;z-index:15;margin:-28px -20px 0;padding:18px 20px 14px;background:linear-gradient(#EEF2F7F2,#EEF2F7E6 70%,#EEF2F700);backdrop-filter:blur(6px)}
.ttl{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ttl .ic{width:40px;height:40px;border-radius:12px;background:var(--pri);display:flex;align-items:center;justify-content:center;flex:none}
.ttl h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.2px}.ttl p{margin:0;font-size:13px;color:var(--mut)}
.bus{display:flex;gap:10px;position:relative}
.bus .in{position:relative;flex:1;min-width:0}
.bus .in svg{position:absolute;left:14px;top:50%;margin-top:-9px;pointer-events:none}
.bus input{width:100%;height:48px;border:1px solid #C9D9EC;border-radius:14px;padding:0 14px 0 44px;font:inherit;font-size:15px;background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,50,90,.05);outline:none}
.bus input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(31,78,140,.15)}
.bus #bt{height:48px;border:0;border-radius:14px;padding:0 24px;background:var(--pri);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(31,78,140,.25)}
.bus #bt:disabled{opacity:.55;cursor:wait;box-shadow:none}
.sug{position:absolute;left:0;right:0;top:54px;z-index:10;background:#fff;border-radius:14px;box-shadow:0 12px 32px rgba(20,50,90,.18);overflow:hidden;text-align:left}
.sug button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:0;background:none;font:inherit;color:var(--ink);padding:10px 16px;border-bottom:1px solid #E6EEF8;cursor:pointer}
.sug button:last-child{border-bottom:0}.sug button:hover,.sug button.on{background:#EAF1FA}
.sug button b{font-weight:700;font-size:14px}.sug button small{color:var(--mut);font-size:12.5px}
.ficha .top{display:none}
.volver{position:absolute;top:14px;right:16px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(20,50,90,.18)}
.volver:hover{background:#fff}
.ayuda{font-size:12px;color:var(--mut);margin-top:8px}
.vacio{text-align:center;padding:44px 24px}
.vacio .big{width:64px;height:64px;border-radius:20px;background:#DCE9F7;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.vacio h3{margin:0 0 6px;font-size:20px}.vacio p{margin:0 auto;max-width:520px;color:var(--mut)}
.vacio .qs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.sk{position:relative;overflow:hidden;background:#E3EAF3;border-radius:12px}
.sk:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:sh 1.2s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.skc{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 1px 2px rgba(20,50,90,.06),0 10px 28px rgba(20,50,90,.08)}
.est{font-size:13px;color:var(--mut);text-align:center;margin:0 0 -8px}
.card{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(20,50,90,.06),0 10px 28px rgba(20,50,90,.08)}
.msg{padding:18px 20px;color:var(--mut);text-align:center}
.msg.err{color:var(--red)}
.lista{display:flex;flex-direction:column}
.lista button{display:flex;gap:12px;align-items:center;justify-content:space-between;text-align:left;border:0;background:none;font:inherit;color:inherit;padding:12px 18px;border-bottom:1px solid #E6EEF8;cursor:pointer}
.lista button:last-child{border-bottom:0}.lista button:hover{background:#F3F7FC}
.lista b{font-weight:700}.lista small{color:var(--mut)}
.pv{display:inline-block;background:#FEF6E7;color:#8A5A00;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.pers{border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(20,50,90,.06),0 12px 32px rgba(20,50,90,.08)}
.pers .ban{height:92px;background:#DCE9F7;position:relative;overflow:hidden}
.pers .ban i{position:absolute;border-radius:50%}
.pers .cu{padding:0 24px 22px}
.pers .fila{position:relative;z-index:2;display:flex;align-items:flex-end;gap:16px;margin-top:-36px}
.av{width:76px;height:76px;flex:none;border-radius:50%;background:var(--pri);color:#fff;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.pers .nm{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;min-width:0;padding-bottom:4px}.pers .cc{font-size:15px;font-weight:500;color:var(--mut);white-space:nowrap}
.pers h1{margin:0;font-size:22px;font-weight:700;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#EAF1FA;color:#17406F;padding:6px 13px;border-radius:999px;font-size:14px;font-weight:500;line-height:1.2}
.chip.est{font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:14px}
.stat{flex:1 1 150px;min-width:0;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(20,50,90,.06),0 8px 24px rgba(20,50,90,.06)}
.stat .l{font-size:13px;color:var(--mut)}.stat .v{font-size:24px;font-weight:700;color:var(--pri);margin-top:2px}
.tit{text-align:center}.tit b{display:block;font-size:24px;font-weight:800}.tit span{font-size:14px;color:var(--mut)}
/* Línea de tiempo: años a la izquierda, tarjetas a la derecha */
.tl{position:relative}
.tl-line{position:absolute;top:8px;bottom:8px;left:calc(110px + 36px);width:3px;margin-left:-1.5px;border-radius:2px;background:#C5D6EA}
.phase{margin:10px 0 24px;padding-left:110px;position:relative;z-index:1}
.phase span{display:inline-flex;align-items:center;gap:10px;color:#fff;padding:9px 20px;border-radius:999px;font-size:15px;font-weight:700;box-shadow:0 6px 16px rgba(20,50,90,.22)}
.phase em{font-style:normal;font-weight:500;opacity:.85}
.tl-row{display:grid;grid-template-columns:110px 72px minmax(0,1fr);position:relative;z-index:1}
.tl-year{grid-column:1;font-size:42px;font-weight:800;line-height:1;color:#C9DAEE;padding-top:12px;letter-spacing:-1px}
.tl-axis{grid-column:2;position:relative}
.tl-node{position:absolute;left:50%;top:10px;width:46px;height:46px;margin-left:-23px;border-radius:50%;border:4px solid var(--bg);box-sizing:content-box;display:flex;align-items:center;justify-content:center}
.tl-card{grid-column:3;margin-bottom:26px;background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 1px 2px rgba(20,50,90,.06),0 10px 28px rgba(20,50,90,.08);min-width:0}
.tl-card.perdido{background:var(--redbg);box-shadow:0 0 0 1.5px #E8B4AD,0 10px 28px rgba(192,57,43,.12)}
.tl-card .t{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.tl-card .t b{font-size:18px;font-weight:700}
.tl-card .d{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.tl-card .ds{font-size:14px;color:#3B4C63;margin-top:6px}
.mets{display:flex;flex-wrap:wrap;gap:14px 20px;margin-top:14px}
.met{flex:1 1 150px;min-width:0}
.met div{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}.met div b{font-weight:700}
.met .bar{display:block;height:7px;border-radius:4px;background:#E6EEF8;margin-top:5px;overflow:hidden}.met .bar i{display:block;height:7px;border-radius:4px}
.perd .met .bar{background:#F6D3CE}
.bds{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.bd{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600}
.cp{display:inline-block;margin-top:12px;color:#fff;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600}
.yr-m{display:none;font-size:13px;font-weight:800;color:var(--pri);margin-bottom:2px}
.fuentes{font-size:12px;color:var(--mut)}
.fuentes summary{cursor:pointer}
.fuentes ul{margin:8px 0 0;padding-left:18px}.fuentes .no{color:#8A5A00}
.alerta{background:#FEF6E7;color:#8A5A00;border-radius:12px;padding:10px 14px;font-size:13px}
.pie{text-align:right;font-size:12px;color:var(--mut)}
@media (max-width:700px){
.tl-line{left:28px}
.phase{padding-left:0}
.tl-row{grid-template-columns:56px minmax(0,1fr)}
.tl-axis{grid-column:1}.tl-card{grid-column:2}
.tl-year{display:none}.tl-node{left:28px}
.yr-m{display:block}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="ttl"><div><h2>Hoja de vida del estudiante</h2><p>Trayectoria completa por la institución</p></div></div>
    <form class="bus" id="f" autocomplete="off">
      <label for="q" style="position:absolute;left:-9999px">Cédula o nombre</label>
      <div class="in"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7C93" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Cédula o nombre del estudiante" aria-autocomplete="list" aria-controls="sug" disabled>
      <div class="sug" id="sug" role="listbox" hidden></div></div>
      <button type="submit" id="bt" disabled>Consultar</button>
    </form>
    <div class="ayuda" id="ay">Verificando acceso…</div>
  </div>
  <div id="out"></div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var ESC=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function tok(){var P=window.parent&&window.parent!==window?window.parent.PortalENAP:null;
  if(!P||!P.tokenMicrosoft)return Promise.reject(new Error('Este módulo se abre desde el Portal (Estadística › Hoja de vida del estudiante).'));
  return Promise.race([P.tokenMicrosoft(),new Promise(function(_,rj){setTimeout(function(){rj(new Error('No se pudo obtener tu sesión de Microsoft del Portal. Cierra sesión, vuelve a entrar y abre de nuevo el módulo.'))},25000)})])}
function api(accion,extra){return tok().then(function(t){var ac=new AbortController();setTimeout(function(){ac.abort()},55000);
  return fetch('/api/hoja-de-vida',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({accessToken:t,accion:accion},extra||{}))})
  .catch(function(e){throw new Error(e&&e.name==='AbortError'?'El servidor tardó demasiado en responder. Intente de nuevo.':'No se pudo conectar con el servidor.')})})
  .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.error||('Error '+r.status));return j})})}
function SKL(){var b=function(w,h,x){return '<div class="sk" style="width:'+w+';height:'+h+';'+(x||'')+'"></div>'};
  return '<div class="skc" style="padding:0;overflow:hidden"><div class="sk" style="height:92px;border-radius:0"></div><div style="padding:0 24px 22px"><div style="display:flex;gap:16px;align-items:flex-end;margin-top:-36px">'+b('76px','76px','border-radius:50%;border:4px solid #fff')+b('46%','24px','margin-bottom:6px')+'</div><div style="display:flex;gap:8px;margin-top:16px">'+b('110px','28px','border-radius:999px')+b('90px','28px','border-radius:999px')+b('130px','28px','border-radius:999px')+'</div></div></div>'
  +'<div class="stats" style="margin-top:22px">'+[0,1,2,3].map(function(){return '<div class="stat">'+b('60%','12px')+b('40%','24px','margin-top:8px')+'</div>'}).join('')+'</div>'
  +[0,1,2].map(function(){return '<div class="skc" style="margin:22px 0 0 182px">'+b('40%','18px')+b('70%','12px','margin-top:12px')+b('100%','7px','margin-top:16px')+'</div>'}).join('')}
function gate(on,t){if(on){document.body.classList.remove('ficha');$('out').innerHTML='<div class="est">'+ESC(t||'Cargando…')+'</div><div style="height:14px"></div>'+SKL()}$('bt').disabled=!!on}

var PAL={ingreso:['#2F6FB5','#DCE9F7','#17406F'],semestre:['#4A82C4','#DCE9F7','#17406F'],escalafon:['#1F4E8C','#DCE9F7','#17406F'],grado:['#2E8B57','#DDF1E4','#1B5E34'],
  extension:['#1E8C7E','#D5F0EB','#0E4F46'],complementacion:['#C0562F','#FBE3D8','#6B2A12'],ley:['#C0562F','#FBE3D8','#6B2A12'],regreso:['#C0562F','#FBE3D8','#6B2A12'],concesion:['#6B5BC4','#E5E1F8','#3A2F84'],medalla:['#A97A12','#F8EBC8','#5E4408'],reconocimiento:['#A97A12','#F8EBC8','#5E4408'],retiro:['#6B7280','#E5E7EB','#374151'],perdido:['#C0392B','#FBD9D5','#7A1F16']};
var IC={flag:'M5 21V4 M5 4h11l-2 4l2 4H5',book:'M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0 M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0 M3 6v13 M12 6v13 M21 6v13',anchor:'M12 3a2.5 2.5 0 1 0 0.01 0 M12 8v13 M5 13a7 7 0 0 0 14 0 M8 11h8',medal:'M12 14a4 4 0 1 0 0.01 0 M8.5 11.5L6 3h4l2 4 M15.5 11.5L18 3h-4l-2 4',cap:'M22 9l-10-4l-10 4l10 4l10-4v6 M6 10.6v5.4a6 3 0 0 0 12 0v-5.4',bars:'M4 20h4v-6H4z M10 20h4V8h-4z M16 20h4V4h-4z',scroll:'M8 3h8a2 2 0 0 1 2 2v14l-3-2l-3 2l-3-2l-3 2V5a2 2 0 0 1 2-2z M9 8h6 M9 12h6',layers:'M12 3l9 5l-9 5l-9-5z M3 13l9 5l9-5',up:'M12 19V5 M6 11l6-6l6 6',out:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5l-5-5 M21 12H9',alert:'M12 9v4 M12 17h.01 M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',check:'M20 6L9 17l-5-5',tag:'M3 12V5a2 2 0 0 1 2-2h7l9 9l-9 9z M8 8h.01'};
var MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fch(f){var m=String(f||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?(+m[3]+' '+MES[+m[2]-1]+' '+m[1]):''}
function f3(v){return v==null?'—':Number(v).toFixed(3)}
function svg(p,s,c){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+p+'"></path></svg>'}
function ced(c){var s=String(c||'').replace(/\D/g,'');return s&&s===String(c).replace(/[.\s]/g,'')?s.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):String(c||'')}
function ini(n){var t=String(n||'').split(' ').filter(Boolean);return ((t[0]||'')[0]||'')+((t[1]||t[0]||'')[0]||'')}
function pvTag(e){return e.pv?'<div style="margin-top:8px"><span class="pv">Coincidencia por nombre, por verificar</span></div>':''}

/* ---------- Autocompletar (nombres de CONGLOMERADO, mientras se escribe) ---------- */
var sq=0,st=null,sel=-1;
function cerrar(){$('sug').hidden=true;$('sug').innerHTML='';sel=-1}
$('q').addEventListener('input',function(){clearTimeout(st);var q=$('q').value.trim();if(q.length<3){cerrar();return}
  st=setTimeout(function(){var n=++sq;api('sugerir',{q:q}).then(function(r){if(n!==sq)return;
    if(!r.lista.length){cerrar();return}
    $('sug').innerHTML=r.lista.map(function(p){return '<button type="button" role="option" data-id="'+ESC(p.id)+'"><span><b>'+ESC(p.nombre)+'</b><br><small>'+(p.cedula?'C.C. '+ESC(ced(p.cedula)):'Sin cédula')+(p.sigla?' · '+ESC(p.sigla):'')+(p.cont?' · '+ESC(p.cont):'')+(p.anio?' · '+p.anio:'')+'</small></span></button>'}).join('')+(r.total>r.lista.length?'<div class="msg" style="padding:8px">Hay '+r.total+' coincidencias; siga escribiendo para afinar.</div>':'');
    $('sug').hidden=false;sel=-1;
    Array.prototype.forEach.call($('sug').querySelectorAll('button'),function(b){b.addEventListener('mousedown',function(e){e.preventDefault();var id=b.getAttribute('data-id');cerrar();abrir(id)})});
  }).catch(function(){})},220)});
$('q').addEventListener('keydown',function(e){var bs=$('sug').querySelectorAll('button');if(!bs.length||$('sug').hidden)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;Array.prototype.forEach.call(bs,function(b,i){b.classList.toggle('on',i===sel)})}
  else if(e.key==='Enter'&&sel>=0){e.preventDefault();var id=bs[sel].getAttribute('data-id');cerrar();abrir(id)}
  else if(e.key==='Escape')cerrar()});
$('q').addEventListener('blur',function(){setTimeout(cerrar,150)});

/* ---------- Búsqueda ---------- */
$('f').addEventListener('submit',function(ev){ev.preventDefault();sq++;cerrar();var q=$('q').value.trim();if(q.length<3){msg('Escriba al menos 3 caracteres (cédula o nombre).',1);return}
  $('bt').disabled=true;gate(true,'Buscando…');
  api('buscar',{q:q}).then(function(r){
    if(!r.lista.length){msg('No hay coincidencias para “'+ESC(q)+'”.');return}
    if(r.lista.length===1){abrir(r.lista[0].id);return}
    document.body.classList.remove('ficha');$('out').innerHTML='<div class="card rise lista">'+r.lista.map(function(p){return '<button type="button" data-id="'+ESC(p.id)+'"><span><b>'+ESC(p.nombre)+'</b><br><small>'+(p.cedula?'C.C. '+ESC(ced(p.cedula)):'Sin cédula')+(p.sigla?' · '+ESC(p.sigla):'')+(p.cont?' · '+ESC(p.cont):'')+(p.anio?' · '+p.anio:'')+'</small></span>'+(p.sinCedula?'<span class="pv">sin cédula</span>':'')+'</button>'}).join('')+(r.total>r.lista.length?'<div class="msg">Hay '+r.total+' coincidencias; se muestran 30. Escriba más del nombre para afinar.</div>':'')+'</div>';
    Array.prototype.forEach.call($('out').querySelectorAll('button[data-id]'),function(b){b.addEventListener('click',function(){abrir(b.getAttribute('data-id'))})});
  }).catch(function(e){msg(e.message,1)}).then(function(){$('bt').disabled=false;gate(false)})});
function msg(t,err){document.body.classList.remove('ficha');$('out').innerHTML='<div class="card msg'+(err?' err':'')+'">'+t+'</div>'}
function abrir(id){gate(true,'Armando la hoja de vida…');api('ficha',{id:id}).then(pintar).catch(function(e){msg(e.message,1)}).then(function(){gate(false);$('bt').disabled=false})}

/* ---------- Ficha ---------- */
function fase(e,ya){ // formación / escalafón y grado / después / retiro
  if(e.tipo==='retiro')return 'ret';
  if(e.tipo==='escalafon'||e.tipo==='grado')return 'esc';
  if(e.tipo==='ingreso'||e.tipo==='semestre')return ya.esc?'des':'for';
  return ya.esc?'des':'for'}
var FASES={for:['Formación','#1F4E8C'],esc:['Escalafón y grado','#2E8B57'],des:['Después del escalafón','#C0562F'],ret:['Retiro','#6B7280']};

function pintar(F){document.body.classList.add('ficha');
  var P=F.persona,L=F.linea.slice();
  /* Cursos de extensión con fecha dentro de un semestre van DENTRO de su tarjeta */
  var sems=L.filter(function(e){return e.tipo==='semestre'});
  L=L.filter(function(e){
    if(e.tipo==='concesion'||e.tipo==='medalla'||e.tipo==='reconocimiento'){if(e.clase==='distinguido'&&e.periodo&&sems.some(function(x){return x.semestre.periodo===e.periodo&&x.semestre.dist}))return false;var sc=sems.filter(function(x){return e.periodo&&x.semestre.periodo===e.periodo})[0];if(!sc)return true;(sc.extras=sc.extras||[]).push(e);return false}
    if(e.tipo!=='extension'||!e.fecha)return true;
