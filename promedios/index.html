<html lang="es-CO" translate="no">
<head>
<meta charset="utf-8">
<meta name="author" content="CAMARGO MARTÍNEZ BEYTY PATRICIA">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generación de Promedios Académicos — ENAP</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Aptos Display",Aptos,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#212529;background:transparent;font-size:13px;line-height:1.45;cursor:default;overflow:hidden;caret-color:transparent}
input,select,textarea{caret-color:auto;cursor:text}
button,.btn,.op,.slot,select,label.slot{cursor:pointer}
.main{height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:16px 24px}
.card{background:transparent;border:0;border-radius:0;box-shadow:none;width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;animation:ent .35s ease both}
@keyframes ent{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.in{padding:20px 32px 18px;overflow:auto;min-height:0;display:flex;flex-direction:column}
.in{scrollbar-width:none}.in::-webkit-scrollbar{display:none}
.gold{font-size:10.5px;font-weight:700;letter-spacing:.24em;color:#8a6d0b;text-transform:uppercase}
h1{margin:4px 0 0;font-size:25px;font-weight:600;color:#062a4a}
h2{margin:4px 0 0;font-size:18px;font-weight:600;color:#062a4a}
.sub{margin:5px 0 0;font-size:13px;color:#566370}
.rule{height:3px;width:56px;background:#c9a227;border-radius:2px;margin:14px auto 0}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:600;border-radius:9px;padding:8px 16px;border:1px solid #0b3d66;background:#0b3d66;color:#fff;box-shadow:0 6px 14px -8px rgba(6,42,74,.6);transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px);background:#0e4a7d}
.btn.sec{background:#fff;color:#0b3d66;box-shadow:none}.btn.sec:hover{background:#f1f6fb}
.btn:disabled{background:#c8d3de;border-color:#c8d3de;color:#fff;box-shadow:none;transform:none;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.ok{background:#e3f3ef;color:#0b5f56}.rev{background:#e6eff8;color:#0b3d66}.aviso{background:#fdf1d6;color:#7a5200}.err{background:#fdeceb;color:#a3281d}
.lbl{font-size:11px;font-weight:600;color:#566370;letter-spacing:.03em;margin-bottom:4px}
.inp{font:inherit;font-size:13px;border:1px solid #c9d5e1;border-radius:8px;padding:7px 11px;background:#fff;color:#212529;width:100%;outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:#0b3d66;box-shadow:0 0 0 3px rgba(11,61,102,.14)}
.inp[readonly]{background:#f4f7fa;color:#3b4754}
.ops{display:flex;gap:20px;margin-top:28px;text-align:left;flex-wrap:wrap}
.op{flex:1;min-width:210px;border:1px solid #c9d5e1;border-radius:14px;padding:20px 20px 18px;background:#fff;display:flex;flex-direction:column;gap:6px;font:inherit;text-align:left;color:inherit;transition:transform .18s,box-shadow .18s,border-color .18s}
.op:hover{transform:translateY(-3px);box-shadow:0 16px 30px -16px rgba(6,42,74,.45);border-color:#9db4cc}
.op b{font-size:14px;color:#062a4a}.op span{font-size:12px;color:#566370}
.ib{width:42px;height:42px;border-radius:12px;background:#e6eff8;color:#0b3d66;display:flex;align-items:center;justify-content:center;margin-bottom:6px;position:relative}
.cnt{position:absolute;top:-6px;right:-8px;background:#c9a227;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.fila{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid #e3eaf1}
.n{width:26px;height:26px;font-size:12px;border-radius:50%;background:#e6eff8;color:#0b3d66;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.slot{flex:1;display:flex;align-items:center;gap:10px;border:1.5px dashed #9db4cc;border-radius:10px;padding:8px 12px;background:#f8fbfe;color:#0b3d66;font-size:13px;font-weight:600;min-height:46px;min-width:0;transition:background .15s,border-color .15s}
.slot:hover,.slot.sobre{background:#eef5fb;border-color:#0b3d66}
.slot small{display:block;font-weight:400;color:#566370;font-size:11.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot>div{min-width:0}.slot .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.lleno{border:1.5px solid #8ac2b9;background:#f1f9f7;color:#0b5f56}
.x{border:0;background:none;color:#8a98a8;font-size:22px;line-height:1;padding:4px 8px;border-radius:8px}.x:hover{background:#eef2f6;color:#a3281d}
.r{display:grid;grid-template-columns:1.5fr 1.3fr .6fr 1.5fr;gap:14px;align-items:start;padding:8px 0;border-top:1px solid #e3eaf1;font-size:13px}
.r.h{border-top:0;padding:12px 0 6px}.h .lbl{margin:0;text-transform:uppercase;font-size:11.5px;letter-spacing:.08em}
.r .m{font-size:11.5px;color:#566370;margin-top:4px;line-height:1.35}
.spin{width:14px;height:14px;border-radius:50%;border:2.5px solid #c8d8e8;border-top-color:#0b3d66;animation:g .8s linear infinite;display:inline-block}
@keyframes g{to{transform:rotate(360deg)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tab{font:inherit;font-size:12px;font-weight:600;border:1px solid #d9e2ec;background:#fff;color:#566370;border-radius:999px;padding:5px 12px}.tab.on{background:#0b3d66;color:#fff;border-color:#0b3d66}
.doc{flex:1;min-height:0;border:1px solid #d9e2ec;border-radius:12px;background:#f4f7fa;display:flex;align-items:center;justify-content:center;overflow:auto}
.doc img{max-width:100%;max-height:100%;display:block;cursor:zoom-in}
.doc.zoom{display:block;align-items:flex-start;justify-content:flex-start;cursor:grab}.doc.zoom img{max-width:none;max-height:none;cursor:grab;-webkit-user-drag:none;user-select:none}.doc.mov,.doc.mov img{cursor:grabbing}
.zb{display:inline-flex;gap:6px;margin-left:auto}.zb button{border:1px solid #c9d5e1;background:#fff;color:#0b3d66;border-radius:8px;width:30px;height:26px;font:inherit;font-weight:700;cursor:pointer}
.tr{display:grid;gap:8px;align-items:center}
.vac{text-align:center;color:#566370;padding:26px}
.gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:transparent;z-index:9;text-align:center;font-weight:600;color:#0a2540}
.gate[hidden]{display:none}.gate .spin{width:38px;height:38px;border-width:4px}
body.centrado .main{align-items:center;padding-top:16px}
.fsb{position:fixed;top:12px;right:14px;z-index:15;width:38px;height:38px;border-radius:11px;border:1px solid #c9d5e1;background:rgba(255,255,255,.85);color:#0b3d66;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(6,42,74,.12);transition:background .15s,transform .15s}.fsb:hover{background:#fff;transform:translateY(-1px)}.fsb svg{width:18px;height:18px}
.cred{display:none;position:fixed;left:0;right:0;bottom:8px;text-align:center;font-size:12px;line-height:1.45;color:#5b6b7a;pointer-events:none}.cred span{display:block;white-space:nowrap}
html:fullscreen,html:fullscreen body,body.fs{background:#edf1f6}body.fs .cred{display:block}body.fs .main{padding-bottom:52px}
body.fs::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:url(../assets/escudo-marca-agua-sm.webp) center/min(100vmin,980px) no-repeat;opacity:.022}body.fs .main,body.fs .cred,body.fs .fsb{position:relative;z-index:1}body.fs .cred{position:fixed}body.fs .fsb{position:fixed}
@media (max-width:820px){.cred{font-size:10px}.fsb{top:8px;right:8px}body.fs .cred{position:static;padding:6px 0 12px}body.fs .main{padding-bottom:12px}}
.modal-f{position:fixed;inset:0;background:rgba(6,42,74,.38);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30;animation:mf .18s ease}.modal{background:#fff;border-radius:16px;padding:24px 26px;width:100%;max-width:480px;box-shadow:0 24px 60px rgba(6,42,74,.28);animation:mm .2s ease}@keyframes mf{from{opacity:0}}@keyframes mm{from{opacity:0;transform:translateY(10px) scale(.98)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#062a4a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.fm{border:1.5px dashed #9db4cc;border-radius:9px;padding:8px 12px;color:#0b3d66;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:12px;background:#f8fbfe}
.fm img{height:38px}
[hidden]{display:none!important}
@media (max-width:820px){body{overflow:auto}.main{height:auto;min-height:100vh;padding:12px}.card{max-height:none}.in{padding:20px 18px}.fila{flex-wrap:wrap}.fila .slot{flex:1 1 100%}.r{grid-template-columns:1fr 1fr}.r.h{display:none}.g2{grid-template-columns:1fr}h1{font-size:21px}.sdoc{flex-direction:column}}
</style>
</head>
<body>
<div class="gate" id="gate" role="status"><div class="spin"></div><span id="gt">Cargando sesión…</span></div>
<div class="main"><div class="card" id="card" hidden><div class="in" id="vista"></div></div></div>
<button class="fsb" id="fsb" type="button" title="Pantalla completa" aria-label="Pantalla completa" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="fsi"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
<div class="cred" aria-hidden="true"><span>© 2026 Escuela Naval de Cadetes "Almirante Padilla"</span><span>Desarrollado por la Oficina de Estadística | PD02 Beyty P. Camargo M.</span></div>
<script>
(function () {
  var b = document.getElementById('fsb'), de = document.documentElement;
  if (!b || !document.fullscreenEnabled || !de.requestFullscreen) return;
  b.hidden = false;
  var ENTRAR = '<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>', SALIR = '<path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M16 21v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>';
  b.onclick = function () { try { if (document.fullscreenElement) document.exitFullscreen(); else de.requestFullscreen(); } catch (e) {} };
  document.addEventListener('fullscreenchange', function () { var on = !!document.fullscreenElement; document.body.classList.toggle('fs', on); document.getElementById('fsi').innerHTML = on ? SALIR : ENTRAR; b.title = on ? 'Salir de pantalla completa' : 'Pantalla completa'; });
})();
</script>
<div class="toast" id="toast" role="status"></div>
<script src="js/nucleo.js"></script>
<script src="js/certificado.js"></script>
<script src="js/lector.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="js/app.js"></script>
</body>
