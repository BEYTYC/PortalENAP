<script>
(function () {
  'use strict';
  var S = { vista: 'mis', datos: null, admin: null, cargandoId: null, filtro: '', verComo: '', kpi: '' };
  var app = document.getElementById('app');
  var ESTADO = { pendiente: ['Pendiente', 'gris'], devuelta: ['Devuelta', 'rojo'], revision: ['En revisión', 'ambar'], validada: ['Validada', 'verde'] };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fecha(iso) { return iso ? iso.split('-').reverse().join('/') : ''; }
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3600); }
  var TK = { v: null, hasta: 0 };
  function token() {
    if (TK.v && Date.now() < TK.hasta) return Promise.resolve(TK.v);
    return pedirToken().then(function (v) { TK.v = v; TK.hasta = Date.now() + 10 * 60 * 1000; return v; });
  }
  function pedirToken() {
    var P = window.parent && window.parent !== window ? window.parent.PortalENAP : null;
    if (!P || !P.tokenMicrosoft) return Promise.reject(new Error('Este módulo se abre desde el Portal (Facultades › Plantillas SNIES).'));
    return Promise.race([P.tokenMicrosoft(), new Promise(function (_, no) { setTimeout(function () { no(new Error('No se pudo obtener su sesión de Microsoft. Cierre sesión, vuelva a entrar y abra de nuevo el módulo.')); }, 25000); })]);
  }
  function api(accion, extra) {
    return token().then(function (t) {
      return fetch('/api/snies', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ accessToken: t, accion: accion }, extra || {})) });
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Error del servidor.'); return j; }); });
  }
  function leerB64(file) {
    return new Promise(function (ok, no) { var r = new FileReader(); r.onload = function () { ok(String(r.result).split(',')[1] || ''); }; r.onerror = function () { no(new Error('No se pudo leer el archivo.')); }; r.readAsDataURL(file); });
  }
  function bajar(nombre, b64, tipo) {
    var bin = atob(b64), n = bin.length, u = new Uint8Array(n); for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([u], { type: tipo || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function modal(html) { var m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div class="card">' + html + '</div>'; document.body.appendChild(m); m.addEventListener('click', function (e) { if (e.target === m) m.remove(); }); return m; }

  function verInstructivo(id) {
    var m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = '<div class="card ins"><button class="x" aria-label="Cerrar" title="Cerrar">×</button><iframe src="instructivo.html?p=' + encodeURIComponent(id) + '" title="Instructivo de diligenciamiento"></iframe></div>';
    var cerrar = function () { m.remove(); document.removeEventListener('keydown', esc27); };
    var esc27 = function (e) { if (e.key === 'Escape') cerrar(); };
    m.addEventListener('click', function (e) { if (e.target === m || e.target.className === 'x') cerrar(); });
    document.addEventListener('keydown', esc27); document.body.appendChild(m);
  }

  /* ---------------- Carga de datos ---------------- */
  function cargarSesion() {
    return api('sesion', S.verComo ? { verComo: S.verComo } : {}).then(function (d) { if (d.admin && d.usuarios) S.usuarios = d.usuarios; if (d.admin && !d.verComo) S.nombreReal = d.nombre; S.datos = d; if (!d.admin && S.vista !== 'mis') S.vista = 'mis'; });
  }
  function cargarAdmin(p) { return api('admin', p ? { periodo: p } : {}).then(function (d) { S.admin = d;
    /* Entregas que aún no tienen cruce con Participantes: se calcula solo, una vez por sesión y periodo, y se refresca el Panel */
    var falt = (d.plantillas || []).some(function (x) { return x.archivo && !x.cruce && ['participante', 'inscritos-relacion-de-inscritos', 'inscrito-programa', 'admitidos'].indexOf(x.id) < 0; }), kc = 'c' + d.periodo;
    if (falt && !S[kc]) { S[kc] = 1; api('cruce-actualizar', { periodo: d.periodo }).then(function (r) { if (r.n) return api('admin', { periodo: d.periodo }).then(function (d2) { S.admin = d2; pintar(); }); }).catch(function () {}); }
  }); }

  /* ---------------- Responsable: Mis plantillas ---------------- */
  /* Plantillas oficiales vacías incluidas en el portal (carpeta oficiales/), por si no hay copia subida en «Plantillas oficiales». */
  var OFICIALES = ["actividad-cultural", "actividad-de-bienestar", "admitidos", "apoyos-financieros-academicos-u-otros", "autoridades", "centros-de-investigacion", "consultoria", "convenios-internacionales", "cupos-proyectados-y-matricula-esperada", "cursos", "directivos", "docentes-universidad-publica", "educacion-continua", "estudiantes-de-primer-curso", "evento-cultural", "graduados", "grupos-de-investigacion", "informacion-complementaria-de-la-ies", "inscrito-programa", "inscritos-relacion-de-inscritos", "integrantes-maximo-organo-de-gobierno", "materias-matriculado", "matriculados", "movilidad-de-docentes-del-exterior-hacia-colombia", "movilidad-de-docentes-hacia-el-exterior", "movilidad-de-estudiantes-del-exterior-hacia-colombia", "movilidad-de-estudiantes-hacia-el-exterior", "movilidad-de-personal-administrativo-del-exterior-hacia-colombia", "movilidad-de-personal-administrativo-hacia-el-exterior", "otras-actividades-de-investigacion", "participante", "productos-de-investigacion", "programas-presenciales-ofrecidos-en-el-exterior", "proyecto-de-extension", "proyectos-de-investigacion", "redes-de-investigacion", "retiros-estudiantiles", "servicios-de-extension", "unidad-organizacional",'recursos-historico'];
  /* Instructivo de diligenciamiento por plantilla: sección del Manual del Usuario del SNIES (MEN, v2.11), recortada por plantilla. */
  var INSTRUCTIVOS = ["actividad-cultural", "actividad-de-bienestar", "admitidos", "apoyos-financieros-academicos-u-otros", "autoridades", "centros-de-investigacion", "consultoria", "convenios-internacionales", "cupos-proyectados-y-matricula-esperada", "cursos", "directivos", "docentes-universidad-publica", "educacion-continua", "estudiantes-de-primer-curso", "evento-cultural", "graduados", "grupos-de-investigacion", "informacion-complementaria-de-la-ies", "inscrito-programa", "inscritos-relacion-de-inscritos", "integrantes-maximo-organo-de-gobierno", "materias-matriculado", "matriculados", "movilidad-de-docentes-del-exterior-hacia-colombia", "movilidad-de-docentes-hacia-el-exterior", "movilidad-de-estudiantes-del-exterior-hacia-colombia", "movilidad-de-estudiantes-hacia-el-exterior", "movilidad-de-personal-administrativo-del-exterior-hacia-colombia", "movilidad-de-personal-administrativo-hacia-el-exterior", "otras-actividades-de-investigacion", "participante", "productos-de-investigacion", "programas-presenciales-ofrecidos-en-el-exterior", "proyecto-de-extension", "proyectos-de-investigacion", "redes-de-investigacion", "retiros-estudiantiles", "servicios-de-extension", "unidad-organizacional"];
  function tarjeta(p) {
    var est = ESTADO[p.estado], color = est[1], cuerpo = '', acts = '', zona = '';
    if (p.modo === 'directo') color = 'gris';
    else if (p.vencida && p.estado !== 'validada') color = 'rojo';   /* vencida = rojo; pendiente a tiempo = gris */
    var chips = p.modo === 'directo' ? '<span class="chip c-teal">Solo notificaciones</span>' : '<span class="chip c-' + est[1] + '">' + est[0] + '</span>' + (p.noAplica ? '<span class="chip c-teal">No aplica</span>' : '') + (p.vencida ? '<span class="chip c-rojo">Vencida</span>' : '');
    var fechaTxt = p.limite ? fecha(p.limite) : (p.textoFecha || 'Cuando se presente la novedad');

      var cuerpo = r.total ? '<div class="mu">' + r.total + ' documento(s) de esta entrega no están en Participantes' + (r.base ? ' (base del SNIES de ' + r.base.n + ' documentos' + (r.entrega ? ' y entrega de Participante' : '') + ')' : ' (entrega de Participante)') + '. Es solo informativo: no bloquea la plantilla y el responsable no lo ve.</div><div style="max-height:46vh;overflow:auto"><table><thead><tr><th>Hoja</th><th>Fila</th><th>Tipo</th><th>Documento</th></tr></thead><tbody>' + r.faltan.map(function (x) { return '<tr><td>' + esc(x.hoja) + '</td><td>' + x.fila + '</td><td>' + esc(x.tipo) + '</td><td>' + esc(x.num) + '</td></tr>'; }).join('') + '</tbody></table></div>' + (r.total > r.faltan.length ? '<div class="mu">Se muestran los primeros ' + r.faltan.length + '.</div>' : '') : '<div class="mu">Todos los documentos de esta entrega (' + r.revisados + ') están en Participantes.</div>';
      var mc = modal('<div style="font-size:18px">Cruce con Participante · ' + esc(q2.nombre || '') + '</div>' + cuerpo + '<div style="display:flex;justify-content:flex-end"><button class="btn" id="ok">Cerrar</button></div>');
      mc.querySelector('#ok').onclick = function () { mc.remove(); };
    }).catch(function (x) { b.disabled = false; b.textContent = tx; toast(x.message); }); }
    else if (a === 'validar') api('estado', { id: id, estado: 'validada', periodo: S.admin.periodo }).then(function (r) { toast(r.correo === false ? 'Validada (el correo «Plantilla recibida» no se pudo enviar).' : 'Validada. Se envió el correo «Plantilla recibida» al responsable.'); return refrescar(); }).catch(function (x) { toast(x.message); });
    else if (a === 'correo') { b.disabled = true; api('enviar-correo', { id: id, periodo: S.admin.periodo }).then(function (r) { toast('Correo enviado a ' + r.para.join(', ') + '.'); }).catch(function (x) { toast(x.message); }).then(function () { b.disabled = false; }); }
    else if (a === 'deshacer') {
      var md = modal('<div style="font-size:18px">Deshacer cargue</div><div class="mu">La plantilla vuelve a <b>Pendiente</b> y se quita la entrega registrada. Úsalo para deshacer una prueba. Los correos que ya se hayan enviado no se pueden retirar.</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn sec" id="dsNo">Cancelar</button><button class="btn" id="dsSi">Deshacer cargue</button></div>');
      md.querySelector('#dsNo').onclick = function () { md.remove(); };
      md.querySelector('#dsSi').onclick = function () { var bs = this; bs.disabled = true; bs.textContent = 'Deshaciendo…'; api('deshacer-cargue', { id: id, periodo: S.admin.periodo }).then(function () { md.remove(); toast('Cargue deshecho. La plantilla volvió a Pendiente.'); return cargarAdmin(S.admin.periodo); }).then(function () { pintar(); }).catch(function (x) { bs.disabled = false; bs.textContent = 'Deshacer cargue'; toast(x.message); }); };
    }
    else if (a === 'devolver') {
      api('novedades', { id: id, vista: true, periodo: S.admin.periodo }).then(function (r) {
        if (r.datos && r.detalle && r.detalle.hojas && r.detalle.hojas.length) { visorCorreccion(id, r.nombre, r.datos, r, false, 'devolver'); return; }
        devolverManual(id);
      }).catch(function () { devolverManual(id); });
      return;
    }
    else if (a === 'guardar') {
      var tr = b.closest('tr'), sep = function (s) { return s.split(/[,;\s]+/).filter(Boolean); };
      var est = tr.querySelector('.r-est'), txt = b.textContent; b.disabled = true; b.textContent = 'Guardando…'; est.textContent = ''; est.style.color = '#14633d';
      api('responsables', { id: id, entrega: sep(tr.querySelector('.r-ent').value), diligencia: sep(tr.querySelector('.r-dil').value), fecha: tr.querySelector('.r-pro').value }).then(function (r) {
        b.disabled = false; b.textContent = txt; est.textContent = 'Guardado ✓';
        tr.querySelector('.r-ent').value = r.entrega.join(', '); tr.querySelector('.r-dil').value = r.diligencia.join(', ');
        var p = S.admin.plantillas.filter(function (x) { return x.id === id; })[0]; if (p) { p.entrega = r.entrega; p.diligencia = r.diligencia; p.prorroga = tr.querySelector('.r-pro').value; }
        toast('Guardado.');
      }).catch(function (x) { b.disabled = false; b.textContent = txt; est.style.color = '#a3281d'; est.textContent = x.message; toast(x.message); });
    }
    else if (a === 'periodo') {
      var m2 = modal('<div style="font-size:18px">Periodo activo</div><div class="mu">Formato AAAA-1 o AAAA-2. Cambia el periodo para todos los responsables.</div><input class="inp" id="per" value="' + esc(S.admin.periodoActivo) + '"><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="no">Cancelar</button><button class="btn" id="si">Guardar</button></div>');
      m2.querySelector('#no').onclick = function () { m2.remove(); };
      m2.querySelector('#si').onclick = function () { api('periodo', { nuevo: m2.querySelector('#per').value }).then(function () { m2.remove(); return cargarAdmin(); }).then(pintar).catch(function (x) { toast(x.message); }); };
    }
    else if (a === 'abrir') {
      var m3 = modal('<div style="font-size:18px">Abrir el ciclo ' + esc(S.admin.periodo) + '</div><div class="mu">Se enviará a cada responsable (de la entrega y del diligenciamiento) un correo con sus plantillas, fechas y el enlace del módulo. Solo se envía a las plantillas que ya tienen responsables asignados.</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="no">Cancelar</button><button class="btn" id="si">Enviar solicitudes</button></div>');
      m3.querySelector('#no').onclick = function () { m3.remove(); };
      m3.querySelector('#si').onclick = function () { m3.querySelector('#si').disabled = true; api('abrir-ciclo', { periodo: S.admin.periodo }).then(function (r) { m3.remove(); toast('Se enviaron ' + r.enviados + ' correos' + (r.fallos ? ' (' + r.fallos + ' fallaron)' : '') + '.'); }).catch(function (x) { m3.remove(); toast(x.message); }); };
    }
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'vercomo') {
      S.verComo = e.target.value; S.datos = null;
      /* Cargando mientras llegan las plantillas de la otra persona */
      var ldv = document.getElementById('ld'), sel = e.target, nom = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';
      /* Se quitan las tarjetas de la persona anterior; solo quedan las pestañas y el selector */ var ocultos = []; Array.prototype.forEach.call(app.children, function (c) { if (!c.classList.contains('tabs') && !c.contains(sel)) { ocultos.push([c, c.style.display]); c.style.display = 'none'; } }); app.style.pointerEvents = 'none';
      if (ldv) { ldv.querySelector('b').textContent = 'Cargando las plantillas' + (S.verComo && nom ? ' de ' + nom.split(' · ')[0].split(' - ')[0] : '') + '…'; ldv.hidden = false; }
      var fin = function () { ocultos.forEach(function (o) { o[0].style.display = o[1]; }); app.style.pointerEvents = ''; if (ldv) { ldv.hidden = true; ldv.querySelector('b').textContent = 'Cargando'; } };
      cargarSesion().then(function () { fin(); pintar(); }).catch(function (x) { fin(); toast(x.message); });
      return;
    }
    var i = e.target; if (i.dataset && i.dataset.a === 'subir' && i.files[0]) {
      var id = i.dataset.id, f = i.files[0];
      leerB64(f).then(function (b64) { return api('oficial-subir', { id: id, nombre: f.name, datos: b64 }).then(function (r) {
        if (r.ok) { toast('Plantilla oficial guardada (versión ' + r.version + ').'); return refrescar(); }
        var m = modal('<div style="font-size:18px">Revisa el archivo</div><div style="font-size:15px">' + esc(r.aviso) + '</div><div class="mu">Si estás seguro de que es la plantilla correcta, puedes guardarla de todos modos.</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="no">Cancelar</button><button class="btn" id="si">Guardar de todos modos</button></div>');
        m.querySelector('#no').onclick = function () { m.remove(); };
        m.querySelector('#si').onclick = function () { m.remove(); api('oficial-subir', { id: id, nombre: f.name, datos: b64, forzar: true }).then(function (r2) { toast('Plantilla oficial guardada (versión ' + r2.version + ').'); return refrescar(); }).catch(function (x) { toast(x.message); }); };
      }); }).catch(function (x) { toast(x.message); });
    }
  });
  /* No dejar que soltar un archivo fuera de una tarjeta abra el Excel en el navegador */
  window.addEventListener('dragover', function (e) { e.preventDefault(); }); window.addEventListener('drop', function (e) { e.preventDefault(); });

  cargarSesion().then(function () { pintar(); if (S.datos && S.datos.admin) cargarAdmin().catch(function () {}); var nv = new URLSearchParams(location.search).get('novedades'); if (nv) setTimeout(function () { abrirNovedades(nv); }, 300); else if (!S.verComo && S.datos && S.datos.plantillas) { /* Al entrar, al responsable le sale de una lo que debe corregir (sin que Estadística se lo diga). */ var pn = S.datos.plantillas.filter(function (x) { return x.puedeCargar && x.estado === 'devuelta' && x.novedades; })[0]; if (pn) setTimeout(function () { abrirNovedades(pn.id); }, 400); } }).catch(function (e) { document.getElementById('ld').hidden = true; app.innerHTML = '<div class="ban e">' + esc(e.message) + '</div>'; });
})();
</script>
