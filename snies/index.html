<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Aptos Display",Aptos,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;font-weight:500;color:#14233a;background:transparent;font-size:14px;line-height:1.45;cursor:default}
b,strong{font-weight:600}
button,.btn,label.btn,select,.tab,.drop{cursor:pointer}
input,textarea{cursor:text}
.wrap{max-width:1700px;margin:0 auto;padding:18px 72px 40px;display:flex;flex-direction:column;gap:18px;animation:ent .35s ease both}
@keyframes ent{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{margin:0;font-size:20px;font-weight:600;color:#062a4a}
.sub{font-size:13px;color:#4c6386;margin-top:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.wrap{position:relative}
.tab{font:inherit;font-weight:600;font-size:14px;padding:8px 18px;border-radius:999px;border:1px solid #c4d2e7;background:#fff;color:#123a73;transition:all .15s}
.tab:hover{background:#eef4fb}.tab.on{background:#123a73;border-color:#123a73;color:#fff;box-shadow:0 4px 12px rgba(18,58,115,.22)}
.card{background:#fff;border:1px solid #d6e0ec;border-radius:14px;box-shadow:0 1px 2px rgba(7,28,60,.05),0 6px 18px rgba(7,28,60,.05)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:9px 16px;border:1px solid #123a73;background:#123a73;color:#fff;white-space:nowrap;transition:transform .12s,background .15s}
.btn:hover{transform:translateY(-1px);background:#184a92}
.btn.sec{background:#fff;color:#123a73;border-color:#c4d2e7}.btn.sec:hover{background:#eef4fb}
.btn.teal{background:#fff;color:#0f5c5c;border-color:#bfe0e0}.btn.teal:hover{background:#f1f8f8}
.btn.y{background:#d3a62a;border-color:#d3a62a;color:#071142}
.btn:disabled{background:#c8d3de;border-color:#c8d3de;color:#fff;transform:none;cursor:default}
.btn.sm{padding:6px 12px;font-size:13px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.c-rojo{background:#fbe4e1;color:#a3281d}.c-ambar{background:#fdf0c4;color:#7a5200}.c-verde{background:#dff3e8;color:#14633d}.c-teal{background:#dff1f1;color:#0f5c5c}.c-gris{background:#e8edf4;color:#4c6386}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.t{padding:12px 14px;border:1px solid;display:flex;flex-direction:column;gap:7px;transition:box-shadow .15s}
.t.rojo{background:#fdf1f0;border-color:#d9726a}.t.ambar{background:#fff8dc;border-color:#d9b445}.t.verde{background:#f0f9f4;border-color:#5fb68a}.t.gris{background:#f3f6fa;border-color:#a9b8cb}
.t h3{margin:0;font-size:19px;font-weight:600;line-height:1.2}
.mu{color:#4c6386;font-size:12px}
.mu.l1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zone{min-height:48px;padding-top:4px;padding-bottom:4px;border:2px dashed;border-radius:10px;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:#4c6386;padding:0 12px;line-height:1.35}
.acts{display:flex;gap:8px;flex-wrap:nowrap;margin-top:auto;min-height:28px;align-items:center}
.acts .btn{padding:4px 11px;font-size:12px;border-radius:7px}
.links{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;padding-top:10px;border-top:1px solid rgba(7,28,60,.10)}
.links a{color:#1b4c92;text-decoration:none}.links a:hover{text-decoration:underline}
.ban{border-radius:12px;padding:12px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.ban.i{background:#f1f8f8;border:1px solid #bfe0e0;color:#0f5c5c}.ban.w{background:#fff4d6;border:1px solid #e2c766;color:#5f4a0b}.ban.e{background:#fdf1f0;border:1px solid #f0c4c0;color:#a3281d}
.prog{padding:10px 18px;display:flex;gap:18px;align-items:center;flex-wrap:nowrap;width:100%}
.kpi{padding:14px 18px;min-width:140px;flex:1;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}.kpi:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(7,28,60,.06),0 10px 24px rgba(7,28,60,.1)}.kpi.on{border-color:#2f6fba;box-shadow:0 0 0 2px #cfe0f5,0 10px 24px rgba(7,28,60,.1);background:#f3f8ff}.kpi .kn{font-size:30px;line-height:1.15}.kpi .kp{font-size:12px;color:#4c6386}
.bar{height:22px;background:#e2eaf4;border-radius:11px;overflow:hidden}.bar.cero{background:transparent;box-shadow:inset 0 0 0 1.5px #f1a7a1}.bar i{display:block;height:100%;background:linear-gradient(90deg,#e5584f 0%,#f2b834 50%,#2f9e72 100%);background-repeat:no-repeat;border-radius:11px;transition:width .4s}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:#4c6386;text-transform:uppercase;letter-spacing:.3px;text-align:left;padding:8px 10px;font-weight:600}
td{padding:9px 10px;border-top:1px solid #e3eaf2;vertical-align:top;font-size:13.5px}
.gh td{background:#0b2a55;color:#fff;font-size:13px;letter-spacing:.4px;border:0}
.inp{font:inherit;font-weight:600;font-size:13px;border:1px solid #95aecf;border-radius:8px;padding:7px 10px;background:#fff;color:#14233a;width:100%;outline:none}
.inp:focus{border-color:#123a73;box-shadow:0 0 0 3px rgba(18,58,115,.14)}
textarea.inp{resize:vertical;min-height:54px}
.modal{position:fixed;inset:0;background:rgba(7,28,60,.35);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal .card{max-width:520px;width:100%;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.err li{margin:4px 0}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#123a73;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:30;box-shadow:0 8px 24px rgba(7,28,60,.3)}
.cargando[hidden]{display:none}.cargando{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cargando .gk{font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#b58b2a;margin-bottom:4px}
.cargando .gmod{margin:0 0 6px;font-size:clamp(26px,5vw,34px);font-weight:600;line-height:1.1;color:#14233a}
.cargando .gm{font-size:16px;color:#123a73}
.cargando .gsp{width:34px;height:34px;margin:14px auto 0;border:3px solid #d6e2f0;border-top-color:#123a73;border-radius:50%;animation:gspin .9s linear infinite}
.cargando b{display:block;margin-top:10px;font-size:18px;color:#14233a}
.cargando b::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:gdots 1.4s steps(4,end) infinite}
@keyframes gspin{to{transform:rotate(360deg)}}@keyframes gdots{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0 0 0)}}
@media(prefers-reduced-motion:reduce){.cargando .gsp,.cargando b::after{animation:none}}
@media(max-width:1250px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.acts{flex-wrap:wrap}}
/* Tamaño: todo el módulo a escala reducida para que los campos y textos no se vean gigantes */
body{zoom:.88}
@media(max-width:700px){body{zoom:.85}}
/* Letra menos negrita: texto normal 500; solo los títulos y los números grandes en semi negrita */
.tab,.btn,.chip,th,.inp,.mu,.zone,.ban,.toast{font-weight:500}
b,strong{font-weight:600}
h1,h2,h3{font-weight:600}
</style>
<style>/* Sin cursor de texto parpadeante fuera de los campos de escritura */html,body{caret-color:transparent}input,textarea,select,[contenteditable="true"]{caret-color:auto}</style>

<div class="cargando" id="ld" role="status"><i class="gsp" aria-hidden="true"></i><b>Cargando</b></div>
<script>
(function () {
  'use strict';
  var S = { vista: 'mis', datos: null, admin: null, cargandoId: null, filtro: '', verComo: '', kpi: '' };
  var app = document.getElementById('app');
  var ESTADO = { pendiente: ['Pendiente', 'rojo'], devuelta: ['Devuelta', 'rojo'], revision: ['En revisión', 'ambar'], validada: ['Validada', 'verde'] };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fecha(iso) { return iso ? iso.split('-').reverse().join('/') : ''; }
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3600); }
  var TK = { v: null, hasta: 0 };
  function token() {
    if (TK.v && Date.now() < TK.hasta) return Promise.resolve(TK.v);
    return pedirToken().then(function (v) { TK.v = v; TK.hasta = Date.now() + 10 * 60 * 1000; return v; });
  }
  function pedirToken() {
    var P = window.parent && window.parent !== window ? window.parent.PortalENAP : null;
    if (!P || !P.tokenMicrosoft) return Promise.reject(new Error('Este módulo se abre desde el Portal (Facultades › Plantillas SNIES).'));
    return Promise.race([P.tokenMicrosoft(), new Promise(function (_, no) { setTimeout(function () { no(new Error('No se pudo obtener su sesión de Microsoft. Cierre sesión, vuelva a entrar y abra de nuevo el módulo.')); }, 25000); })]);
  }
  function api(accion, extra) {
    return token().then(function (t) {
      return fetch('/api/snies', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ accessToken: t, accion: accion }, extra || {})) });
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Error del servidor.'); return j; }); });
  }
  function leerB64(file) {
    return new Promise(function (ok, no) { var r = new FileReader(); r.onload = function () { ok(String(r.result).split(',')[1] || ''); }; r.onerror = function () { no(new Error('No se pudo leer el archivo.')); }; r.readAsDataURL(file); });
  }
  function bajar(nombre, b64) {
    var bin = atob(b64), n = bin.length, u = new Uint8Array(n); for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([u], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function modal(html) { var m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div class="card">' + html + '</div>'; document.body.appendChild(m); m.addEventListener('click', function (e) { if (e.target === m) m.remove(); }); return m; }

  /* ---------------- Carga de datos ---------------- */
  function cargarSesion() {
    return api('sesion', S.verComo ? { verComo: S.verComo } : {}).then(function (d) { if (d.admin && d.usuarios) S.usuarios = d.usuarios; if (d.admin && !d.verComo) S.nombreReal = d.nombre; S.datos = d; if (!d.admin && S.vista !== 'mis') S.vista = 'mis'; });
  }
  function cargarAdmin(p) { return api('admin', p ? { periodo: p } : {}).then(function (d) { S.admin = d; }); }

  /* ---------------- Responsable: Mis plantillas ---------------- */
  /* Plantillas oficiales vacías incluidas en el portal (carpeta oficiales/), por si no hay copia subida en «Plantillas oficiales». */
  var OFICIALES = ["actividad-cultural", "actividad-de-bienestar", "admitidos", "apoyos-financieros-academicos-u-otros", "autoridades", "centros-de-investigacion", "consultoria", "convenios-internacionales", "cupos-proyectados-y-matricula-esperada", "cursos", "directivos", "docentes-universidad-publica", "educacion-continua", "estudiantes-de-primer-curso", "evento-cultural", "graduados", "grupos-de-investigacion", "informacion-complementaria-de-la-ies", "inscrito-programa", "inscritos-relacion-de-inscritos", "integrantes-maximo-organo-de-gobierno", "materias-matriculado", "matriculados", "movilidad-de-docentes-del-exterior-hacia-colombia", "movilidad-de-docentes-hacia-el-exterior", "movilidad-de-estudiantes-del-exterior-hacia-colombia", "movilidad-de-estudiantes-hacia-el-exterior", "movilidad-de-personal-administrativo-del-exterior-hacia-colombia", "movilidad-de-personal-administrativo-hacia-el-exterior", "otras-actividades-de-investigacion", "participante", "productos-de-investigacion", "programas-presenciales-ofrecidos-en-el-exterior", "proyecto-de-extension", "proyectos-de-investigacion", "redes-de-investigacion", "retiros-estudiantiles", "servicios-de-extension", "unidad-organizacional"];
  /* Instructivo de diligenciamiento por plantilla: sección del Manual del Usuario del SNIES (MEN, v2.11), recortada por plantilla. */
  var INSTRUCTIVOS = ["actividad-cultural", "actividad-de-bienestar", "admitidos", "apoyos-financieros-academicos-u-otros", "autoridades", "centros-de-investigacion", "consultoria", "convenios-internacionales", "cupos-proyectados-y-matricula-esperada", "cursos", "directivos", "docentes-universidad-publica", "educacion-continua", "estudiantes-de-primer-curso", "evento-cultural", "graduados", "grupos-de-investigacion", "informacion-complementaria-de-la-ies", "inscrito-programa", "inscritos-relacion-de-inscritos", "integrantes-maximo-organo-de-gobierno", "materias-matriculado", "matriculados", "movilidad-de-docentes-del-exterior-hacia-colombia", "movilidad-de-docentes-hacia-el-exterior", "movilidad-de-estudiantes-del-exterior-hacia-colombia", "movilidad-de-estudiantes-hacia-el-exterior", "movilidad-de-personal-administrativo-del-exterior-hacia-colombia", "movilidad-de-personal-administrativo-hacia-el-exterior", "otras-actividades-de-investigacion", "participante", "productos-de-investigacion", "programas-presenciales-ofrecidos-en-el-exterior", "proyecto-de-extension", "proyectos-de-investigacion", "redes-de-investigacion", "retiros-estudiantiles", "servicios-de-extension", "unidad-organizacional"];
  function tarjeta(p) {
    var est = ESTADO[p.estado], color = est[1], cuerpo = '', acts = '', zona = '';
    if (p.modo === 'directo') color = 'gris';
    var chips = p.modo === 'directo' ? '<span class="chip c-teal">Solo notificaciones</span>' : '<span class="chip c-' + est[1] + '">' + est[0] + '</span>' + (p.noAplica ? '<span class="chip c-teal">No aplica</span>' : '') + (p.vencida ? '<span class="chip c-rojo">Vencida</span>' : '');
    var fechaTxt = p.limite ? fecha(p.limite) : (p.textoFecha || 'Cuando se presente la novedad');
    var plazo = p.dias == null ? '—' : (p.dias < 0 ? 'Vencida hace ' + (-p.dias) + ' días' : p.dias === 0 ? 'Vence hoy' : 'Faltan ' + p.dias + ' días');
    if (p.modo === 'directo') {
      zona = '<div class="zone" style="border:0;background:rgba(223,241,241,.6);color:#0f5c5c">Esta plantilla se reporta directo al SNIES con su propio usuario. Aquí solo recibe las notificaciones.</div>';
    } else if (p.estado === 'devuelta') {
      zona = '<div class="zone" style="border-color:#c8372d;color:#a3281d">Devuelta por Estadística: ' + esc(p.motivo) + '</div>';
    } else if (p.estado === 'pendiente' && p.puedeCargar) {
      zona = '';
    } else if (p.estado === 'pendiente') {
      zona = '<div class="zone" style="border-color:#8da0b8">' + esc(p.bloqueo || 'Aún no hay plantilla para cargar.') + '</div>';
    } else {
      zona = '';
    }
    if (p.puedeCargar && (p.estado === 'pendiente' || p.estado === 'devuelta')) acts = '<button class="btn" data-a="cargar" data-id="' + p.id + '">Cargar plantilla</button><button class="btn teal" data-a="na" data-id="' + p.id + '">No aplica</button>';
    var links = '';
    if (p.tieneOficial) links += '<a href="#" data-a="oficial" data-id="' + p.id + '">↓ Plantilla oficial vacía</a>';
    else if (OFICIALES.indexOf(p.id) >= 0) links += '<a href="oficiales/' + p.id + '.xlsx" download>↓ Plantilla oficial vacía</a>';
    if (INSTRUCTIVOS.indexOf(p.id) >= 0) links += '<a href="instructivo.html?p=' + p.id + '" target="_blank" rel="noopener">↗ Instructivo de diligenciamiento</a>';
    if (p.anterior) links += '<a href="#" data-a="anterior" data-id="' + p.id + '" data-p="' + p.anterior + '">↓ Plantilla diligenciada ' + p.anterior + '</a>';
    var nota = p.posgrados ? '<div class="ban i" style="padding:8px 12px;font-size:13px"><span>Las facultades envían su parte a <b>posgrados@enap.edu.co</b>; Posgrados centraliza y entrega esta plantilla.</span></div>' : '';
    return '<div class="card t ' + color + '" data-drop="' + (p.puedeCargar && (p.estado === 'pendiente' || p.estado === 'devuelta') ? p.id : '') + '">'
      + '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><h3>' + esc(p.nombre) + '</h3><div style="display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;flex:none;max-width:48%">' + chips + (p.periodoReporte ? '<span class="mu" style="font-size:11px;line-height:1.25">Periodo que se reporta: <b style="color:#14233a">' + esc(p.periodoReporte) + '</b></span>' : '') + '</div></div>'
      + (p.estado === 'validada' && p.modo !== 'directo' ? '<div style="font-size:15px;font-weight:600;color:#1f7a55">Plantilla entregada satisfactoriamente</div>' : p.estado === 'revision' && p.modo !== 'directo' ? '<div style="font-size:15px;font-weight:600;color:#7a5200">Plantilla cargada. En revisión por Estadística.</div>' : '<div style="display:flex;gap:18px;font-size:13px"><div><div class="mu">Entrega antes del</div><div style="font-size:15px">' + esc(fechaTxt) + '</div></div><div><div class="mu">Plazo</div><div style="font-size:15px">' + esc(plazo) + '</div></div></div>')
      + '<div class="mu l1" title="' + esc(p.entregaTexto) + '">Responsable de la entrega: <b style="color:#14233a">' + esc(p.entregaTexto) + '</b></div>' + (p.diligenciaTexto ? '<div class="mu l1" title="' + esc(p.diligenciaTexto) + '">Responsable del diligenciamiento: <b style="color:#14233a">' + esc(p.diligenciaTexto) + '</b></div>' : '') + nota + zona
      + (acts ? '<div class="acts">' + acts + '</div>' : '<div class="acts"></div>')
      + (links ? '<div class="links">' + links + '</div>' : '') + '</div>';
  }
  function vistaMis() {
    var d = S.datos, ps = d.plantillas, ent = ps.filter(function (p) { return p.modo !== 'directo' && (p.estado === 'revision' || p.estado === 'validada'); }).length, total = ps.filter(function (p) { return p.modo !== 'directo'; }).length;
    var fl = ps.filter(function (p) { return p.limite && p.modo !== 'directo'; }).map(function (p) { return p.limite; }).sort()[0];
    var barra = '';
    if (d.admin) {
      barra = '<div class="card" style="padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:fit-content;margin-bottom:12px"><span class="mu" style="font-weight:600">Modo administrador · Ver como:</span><select class="inp" id="vercomo" style="width:auto;min-width:260px"><option value="">Yo (' + esc(d.verComo ? S.nombreReal || '' : d.nombre) + ')</option>' + (S.usuarios || []).map(function (u) { return '<option value="' + esc(u.correo) + '"' + (u.correo === S.verComo ? ' selected' : '') + '>' + esc(u.nombre) + ' · ' + esc(u.correo) + '</option>'; }).join('') + '</select>' + (S.verComo ? '<span class="chip c-teal">Actúas en nombre de esta persona: lo que cargues queda a su nombre y no se le envía correo</span>' : '') + '</div>';
    }
    var h = barra;
    if (!ps.length) return h + '<div class="card" style="padding:28px;text-align:center;color:#4c6386">Todavía no tienes plantillas asignadas. Si crees que es un error, escribe a la Oficina de Estadística.</div>';
    var pct = total ? Math.round(100 * ent / total) : 0;
    h += '<div class="card prog"><div style="font-size:14px;color:#4c6386;white-space:nowrap">Avance: <b style="font-size:18px;color:#0b2a55">' + pct + ' %</b></div><div style="flex:1;min-width:220px"><div class="bar' + (pct === 0 ? ' cero' : '') + '"><i style="width:' + pct + '%;background-size:' + (pct ? 10000 / pct : 100) + '% 100%"></i></div></div></div>';
    var rango = function (p) { return p.modo === 'directo' ? 2 : (p.estado === 'pendiente' || p.estado === 'devuelta') && !p.noAplica ? 0 : 1; };   /* primero las que aún no se han cargado */
    var orden = ps.map(function (p, i) { return { p: p, i: i }; }).sort(function (a, b) { return rango(a.p) - rango(b.p) || a.i - b.i; }).map(function (x) { return x.p; });
    h += '<div class="grid">' + orden.map(tarjeta).join('') + '</div>';
    return h;
  }

  /* ---------------- Cargue ---------------- */

  /* Envía el archivo (con las correcciones hechas en pantalla, si las hay) y muestra el resultado. */

  }
  /* Visor: muestra solo las filas con error, las celdas con error en amarillo; se puede editar cada celda o eliminar la fila completa. */

      h += '<div class="ban i">Cada plantilla tiene un responsable de la entrega (quien carga) y uno o varios responsables del diligenciamiento. Todos reciben los correos. Escribe los correos separados por coma.</div>' + tablaResp(ps);

      var est = tr.querySelector('.r-est'), txt = b.textContent; b.disabled = true; b.textContent = 'Guardando…'; est.textContent = ''; est.style.color = '#14633d';
      api('responsables', { id: id, entrega: sep(tr.querySelector('.r-ent').value), diligencia: sep(tr.querySelector('.r-dil').value), fecha: tr.querySelector('.r-pro').value }).then(function (r) {
        b.disabled = false; b.textContent = txt; est.textContent = 'Guardado ✓';
        tr.querySelector('.r-ent').value = r.entrega.join(', '); tr.querySelector('.r-dil').value = r.diligencia.join(', ');
        var p = S.admin.plantillas.filter(function (x) { return x.id === id; })[0]; if (p) { p.entrega = r.entrega; p.diligencia = r.diligencia; p.prorroga = tr.querySelector('.r-pro').value; }
        toast('Guardado.');
      }).catch(function (x) { b.disabled = false; b.textContent = txt; est.style.color = '#a3281d'; est.textContent = x.message; toast(x.message); });
    }
    else if (a === 'periodo') {
      var m2 = modal('<div style="font-size:17px">Periodo activo</div><div class="mu">Formato AAAA-1 o AAAA-2. Cambia el periodo para todos los responsables.</div><input class="inp" id="per" value="' + esc(S.admin.periodoActivo) + '"><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="no">Cancelar</button><button class="btn" id="si">Guardar</button></div>');
      m2.querySelector('#no').onclick = function () { m2.remove(); };
      m2.querySelector('#si').onclick = function () { api('periodo', { nuevo: m2.querySelector('#per').value }).then(function () { m2.remove(); return cargarAdmin(); }).then(pintar).catch(function (x) { toast(x.message); }); };
    }
    else if (a === 'abrir') {
      var m3 = modal('<div style="font-size:17px">Abrir el ciclo ' + esc(S.admin.periodo) + '</div><div class="mu">Se enviará a cada responsable (de la entrega y del diligenciamiento) un correo con sus plantillas, fechas y el enlace del módulo. Solo se envía a las plantillas que ya tienen responsables asignados.</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="no">Cancelar</button><button class="btn" id="si">Enviar solicitudes</button></div>');
      m3.querySelector('#no').onclick = function () { m3.remove(); };
      m3.querySelector('#si').onclick = function () { m3.querySelector('#si').disabled = true; api('abrir-ciclo', { periodo: S.admin.periodo }).then(function (r) { m3.remove(); toast('Se enviaron ' + r.enviados + ' correos' + (r.fallos ? ' (' + r.fallos + ' fallaron)' : '') + '.'); }).catch(function (x) { m3.remove(); toast(x.message); }); };
    }
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'vercomo') { S.verComo = e.target.value; S.datos = null; cargarSesion().then(pintar).catch(function (x) { toast(x.message); }); return; }
    var i = e.target; if (i.dataset && i.dataset.a === 'subir' && i.files[0]) {
      var id = i.dataset.id, f = i.files[0];
      leerB64(f).then(function (b64) { return api('oficial-subir', { id: id, nombre: f.name, datos: b64 }).then(function (r) {
        if (r.ok) { toast('Plantilla oficial guardada (versión ' + r.version + ').'); return refrescar(); }
        var m = modal('<div style="font-size:17px">Revisa el archivo</div><div style="font-size:14px">' + esc(r.aviso) + '</div><div class="mu">Si estás seguro de que es la plantilla correcta, puedes guardarla de todos modos.</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="no">Cancelar</button><button class="btn" id="si">Guardar de todos modos</button></div>');
        m.querySelector('#no').onclick = function () { m.remove(); };
        m.querySelector('#si').onclick = function () { m.remove(); api('oficial-subir', { id: id, nombre: f.name, datos: b64, forzar: true }).then(function (r2) { toast('Plantilla oficial guardada (versión ' + r2.version + ').'); return refrescar(); }).catch(function (x) { toast(x.message); }); };
      }); }).catch(function (x) { toast(x.message); });
    }
  });
  /* No dejar que soltar un archivo fuera de una tarjeta abra el Excel en el navegador */
  window.addEventListener('dragover', function (e) { e.preventDefault(); }); window.addEventListener('drop', function (e) { e.preventDefault(); });

  cargarSesion().then(function () { pintar(); if (S.datos && S.datos.admin) cargarAdmin().catch(function () {}); }).catch(function (e) { document.getElementById('ld').hidden = true; app.innerHTML = '<div class="ban e">' + esc(e.message) + '</div>'; });
})();
</script>
</body>
</html>
